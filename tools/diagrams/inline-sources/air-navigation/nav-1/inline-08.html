<svg width="100%" viewBox="0 0 280 260">
            <!-- Spheroid (ellipse) cross-section -->
            <ellipse cx="140" cy="140" rx="110" ry="95" fill="#d6eaf8" stroke="#1a3a5c" stroke-width="2"/>
            <!-- Equator -->
            <line x1="30" y1="140" x2="250" y2="140" stroke="#c0392b" stroke-width="1.5"/>
            <!-- Polar axis -->
            <line x1="140" y1="45" x2="140" y2="235" stroke="#1a3a5c" stroke-width="1" stroke-dasharray="5,3"/>
            <!-- N / S labels -->
            <circle cx="140" cy="45" r="3" fill="#1a3a5c"/>
            <circle cx="140" cy="235" r="3" fill="#1a3a5c"/>
            <text x="140" y="36" text-anchor="middle" font-size="9" font-weight="700" fill="#1a3a5c">NP</text>
            <text x="140" y="250" text-anchor="middle" font-size="9" font-weight="700" fill="#1a3a5c">SP</text>
            <!-- Surface point -->
            <circle cx="218" cy="85" r="5" fill="#d4a017"/>
            <text x="228" y="85" font-size="10" font-weight="700" fill="#d4a017" dominant-baseline="central">Surface Pt</text>
            <!-- Geocentric line (to centre) -->
            <line x1="140" y1="140" x2="218" y2="85" stroke="#c0392b" stroke-width="1.8"/>
            <!-- Geodetic normal (perpendicular to spheroid surface, NOT through centre) -->
            <line x1="218" y1="85" x2="218" y2="155" stroke="#1a7a4a" stroke-width="1.8" stroke-dasharray="6,3"/>
            <!-- Geocentric angle arc -->
            <path d="M163,140 A24,24 0 0,0 153,117" fill="none" stroke="#c0392b" stroke-width="1.5"/>
            <text x="172" y="131" font-size="9" fill="#c0392b" font-weight="700">Geocentric</text>
            <text x="172" y="142" font-size="9" fill="#c0392b">lat</text>
            <!-- Geodetic angle arc -->
            <path d="M218,125 A20,20 0 0,0 200,120" fill="none" stroke="#1a7a4a" stroke-width="1.5"/>
            <text x="152" y="100" font-size="9" fill="#1a7a4a" font-weight="700">Geodetic</text>
            <text x="152" y="111" font-size="9" fill="#1a7a4a">lat (normal</text>
            <text x="152" y="122" font-size="9" fill="#1a7a4a">to surface)</text>
            <!-- Max diff label -->
            <text x="140" y="220" text-anchor="middle" font-size="10" fill="#6c3483" font-weight="700">Max diff = 11.6ʹ at 45°N/S</text>
            <!-- Equator label -->
            <text x="258" y="140" font-size="9" fill="#c0392b" dominant-baseline="central">0°</text>
          </svg>
