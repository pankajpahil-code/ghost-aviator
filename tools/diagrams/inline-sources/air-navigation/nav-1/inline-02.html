<svg width="100%" viewBox="0 0 280 200">
            <!-- North pole view -->
            <circle cx="75" cy="100" r="55" fill="#d6eaf8" stroke="#1a3a5c" stroke-width="1.5"/>
            <circle cx="75" cy="100" r="4" fill="#1a3a5c"/>
            <text x="75" y="38" text-anchor="middle" font-size="10" fill="#1a3a5c" font-weight="700">N POLE</text>
            <!-- anticlockwise arrow arc -->
            <path d="M75,50 A50,50 0 0,0 125,100" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#aarrow)"/>
            <text x="75" y="120" text-anchor="middle" font-size="9" fill="#c0392b" font-weight="700">Anti-clockwise</text>
            <text x="75" y="132" text-anchor="middle" font-size="9" fill="#c0392b">(from above N)</text>

            <!-- South pole view -->
            <circle cx="210" cy="100" r="55" fill="#d5f5e3" stroke="#1a7a4a" stroke-width="1.5"/>
            <circle cx="210" cy="100" r="4" fill="#1a7a4a"/>
            <text x="210" y="38" text-anchor="middle" font-size="10" fill="#1a7a4a" font-weight="700">S POLE</text>
            <!-- clockwise arrow arc -->
            <path d="M210,50 A50,50 0 0,1 260,100" fill="none" stroke="#1a7a4a" stroke-width="2.5" marker-end="url(#aarrow2)"/>
            <text x="210" y="120" text-anchor="middle" font-size="9" fill="#1a7a4a" font-weight="700">Clockwise</text>
            <text x="210" y="132" text-anchor="middle" font-size="9" fill="#1a7a4a">(from above S)</text>

            <defs>
              <marker id="aarrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
                <path d="M2 1L8 5L2 9" fill="none" stroke="#c0392b" stroke-width="2"/>
              </marker>
              <marker id="aarrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
                <path d="M2 1L8 5L2 9" fill="none" stroke="#1a7a4a" stroke-width="2"/>
              </marker>
            </defs>
          </svg>
