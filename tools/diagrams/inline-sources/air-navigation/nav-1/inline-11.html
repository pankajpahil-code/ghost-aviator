<svg width="100%" viewBox="0 0 280 260">
            <defs><marker id="da" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#c0392b" stroke-width="2"/></marker></defs>
            <!-- Globe top view for Ch Long -->
            <circle cx="140" cy="130" r="100" fill="#d6eaf8" stroke="#1a3a5c" stroke-width="1.5"/>
            <circle cx="140" cy="130" r="4" fill="#1a3a5c"/>
            <!-- Greenwich -->
            <line x1="140" y1="130" x2="140" y2="230" stroke="#1a7a4a" stroke-width="2"/>
            <text x="140" y="244" text-anchor="middle" font-size="9" fill="#1a7a4a" font-weight="700">0° Greenwich</text>
            <!-- 180° -->
            <line x1="140" y1="130" x2="140" y2="30" stroke="#1a7a4a" stroke-width="1.5" stroke-dasharray="4,3"/>
            <text x="140" y="22" text-anchor="middle" font-size="9" fill="#1a7a4a">180°</text>
            <!-- Two meridians, same side example (40°E and 70°E) -->
            <line x1="140" y1="130" x2="218" y2="200" stroke="#6c3483" stroke-width="1.8"/>
            <line x1="140" y1="130" x2="232" y2="160" stroke="#d4a017" stroke-width="1.8"/>
            <text x="222" y="198" font-size="9" fill="#6c3483" font-weight="700">040°E</text>
            <text x="236" y="160" font-size="9" fill="#d4a017" font-weight="700">070°E</text>
            <!-- Arc between them -->
            <path d="M202,193 A100,100 0 0,1 228,157" fill="none" stroke="#c0392b" stroke-width="2.5"/>
            <text x="235" y="220" font-size="9" fill="#c0392b" font-weight="700">Ch Long</text>
            <text x="235" y="234" font-size="9" fill="#c0392b" font-weight="700">= 030°</text>
            <!-- Cross-180 example: 163E and 152W -->
            <line x1="140" y1="130" x2="60"  y2="42"  stroke="#ca6f1e" stroke-width="1.8" stroke-dasharray="5,3"/>
            <line x1="140" y1="130" x2="220" y2="42"  stroke="#117a65" stroke-width="1.8" stroke-dasharray="5,3"/>
            <text x="30" y="40" font-size="8" fill="#ca6f1e" font-weight="700">152°W</text>
            <text x="218" y="40" font-size="8" fill="#117a65" font-weight="700">163°E</text>
            <!-- Short arc via 180° -->
            <path d="M78,50 A100,100 0 0,0 214,50" fill="none" stroke="#6c3483" stroke-width="2"/>
            <text x="140" y="40" text-anchor="middle" font-size="8" fill="#6c3483" font-weight="700">45° (short way)</text>
            <text x="140" y="258" text-anchor="middle" font-size="9" fill="#5a7a9a">Always use the shorter arc!</text>
          </svg>
