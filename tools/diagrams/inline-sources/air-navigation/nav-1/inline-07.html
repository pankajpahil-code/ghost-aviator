<svg width="100%" viewBox="0 0 280 310">
            <!-- Earth cross section -->
            <circle cx="140" cy="155" r="115" fill="#d6eaf8" stroke="#1a3a5c" stroke-width="2"/>
            <!-- Equator line (horizontal) -->
            <line x1="25" y1="155" x2="255" y2="155" stroke="#c0392b" stroke-width="2"/>
            <text x="260" y="158" font-size="10" fill="#c0392b" dominant-baseline="central" font-weight="700">Equator 0°</text>
            <!-- Polar axis (vertical) -->
            <line x1="140" y1="40" x2="140" y2="270" stroke="#1a3a5c" stroke-width="1.5" stroke-dasharray="6,4"/>
            <!-- North Pole label -->
            <circle cx="140" cy="40" r="4" fill="#1a3a5c"/>
            <text x="140" y="28" text-anchor="middle" font-size="10" font-weight="800" fill="#1a3a5c">N POLE 90°N</text>
            <!-- South Pole -->
            <circle cx="140" cy="270" r="4" fill="#1a3a5c"/>
            <text x="140" y="288" text-anchor="middle" font-size="10" font-weight="800" fill="#1a3a5c">S POLE 90°S</text>
            <!-- 40°N parallel -->
            <line x1="25" y1="86" x2="255" y2="86" stroke="#d4a017" stroke-width="1" stroke-dasharray="5,4"/>
            <!-- Angle arc for 40°N -->
            <path d="M140,155 L190,93" stroke="#1a7a4a" stroke-width="2"/>
            <circle cx="190" cy="93" r="5" fill="#1a7a4a"/>
            <path d="M140,125 A30,30 0 0,0 162,101" fill="none" stroke="#1a7a4a" stroke-width="1.5"/>
            <text x="162" y="118" font-size="11" font-weight="700" fill="#1a7a4a">40°</text>
            <!-- Point labels -->
            <text x="196" y="88" font-size="11" font-weight="700" fill="#1a7a4a">A</text>
            <text x="145" y="152" font-size="10" fill="#c0392b">P</text>
            <!-- Lat annotation -->
            <text x="14" y="88" text-anchor="middle" font-size="9" fill="#d4a017">40°N</text>
            <!-- West / East -->
            <text x="15" y="158" font-size="10" font-weight="700" fill="#1a3a5c">W</text>
            <text x="258" y="158" font-size="10" font-weight="700" fill="#1a3a5c" text-anchor="end">E</text>
            <!-- Caption annotations -->
            <text x="140" y="302" text-anchor="middle" font-size="11" font-weight="700" fill="#ca6f1e">Latitude of Point A = 40°N</text>
          </svg>
