<svg width="100%" viewBox="0 0 680 210">

        <circle cx="340" cy="10" r="4" fill="#1a3a5c"/>

        <text x="340" y="208" text-anchor="middle" font-size="10" font-weight="800" fill="#1a3a5c">S POLE</text>

        <path d="M340,105 L365,77" stroke="#6c3483" stroke-width="1.5"/>
