<svg width="100%" viewBox="0 0 300 320">
            <!-- Perfect sphere -->
            <ellipse cx="75" cy="80" rx="55" ry="55" fill="#d6eaf8" stroke="#1a3a5c" stroke-width="1.5"/>
            <text x="75" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#1a3a5c">Perfect</text>
            <text x="75" y="92" text-anchor="middle" font-size="11" font-weight="700" fill="#1a3a5c">Sphere</text>
            <text x="75" y="148" text-anchor="middle" font-size="10" fill="#5a7a9a">Polar dia = Equatorial dia</text>

            <!-- Oblate spheroid -->
            <ellipse cx="220" cy="80" rx="65" ry="50" fill="#d5f5e3" stroke="#1a7a4a" stroke-width="1.5"/>
            <!-- Equatorial line -->
            <line x1="155" y1="80" x2="285" y2="80" stroke="#e74c3c" stroke-width="1" stroke-dasharray="3,3"/>
            <!-- Polar axis -->
            <line x1="220" y1="25" x2="220" y2="135" stroke="#e74c3c" stroke-width="1" stroke-dasharray="3,3"/>
            <text x="220" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#1a7a4a">Oblate</text>
            <text x="220" y="92" text-anchor="middle" font-size="11" font-weight="700" fill="#1a7a4a">Spheroid</text>
            <!-- Annotations -->
            <text x="290" y="79" font-size="9" fill="#e74c3c" dominant-baseline="central">Equator</text>
            <text x="224" y="28" font-size="9" fill="#e74c3c">Polar</text>
            <text x="224" y="39" font-size="9" fill="#e74c3c">axis</text>
            <text x="220" y="148" text-anchor="middle" font-size="10" fill="#5a7a9a">Polar dia &lt; Equatorial dia by 43 km</text>

            <!-- GEOID -->
            <ellipse cx="75" cy="230" rx="55" ry="52" fill="#fef9e7" stroke="#d4a017" stroke-width="1.5"/>
            <!-- slight irregular bump -->
            <path d="M75 178 Q95 188 105 200 Q115 212 110 230 Q105 248 90 255 Q75 260 60 255 Q45 248 30 235 Q20 218 25 200 Q35 185 55 180 Q65 177 75 178Z" fill="none" stroke="#ca6f1e" stroke-width="1.2" stroke-dasharray="4,3"/>
            <text x="75" y="228" text-anchor="middle" font-size="11" font-weight="700" fill="#d4a017">Geoid</text>
            <text x="75" y="242" text-anchor="middle" font-size="11" font-weight="700" fill="#d4a017">(Real Earth)</text>
            <text x="75" y="292" text-anchor="middle" font-size="10" fill="#5a7a9a">Irregular — "Earth-shaped"</text>

            <!-- Real Earth pear -->
            <ellipse cx="220" cy="225" rx="60" ry="53" fill="#f5eef8" stroke="#6c3483" stroke-width="1.5"/>
            <!-- Max diameter below equator line -->
            <line x1="157" y1="236" x2="283" y2="236" stroke="#6c3483" stroke-width="0.8" stroke-dasharray="3,3"/>
            <text x="220" y="224" text-anchor="middle" font-size="11" font-weight="700" fill="#6c3483">Real Shape</text>
            <text x="220" y="238" text-anchor="middle" font-size="11" font-weight="700" fill="#6c3483">(Pear slightly)</text>
            <text x="280" y="237" font-size="9" fill="#6c3483" dominant-baseline="central">Max↓</text>
            <text x="220" y="292" text-anchor="middle" font-size="10" fill="#5a7a9a">Max diameter south of Equator</text>
          </svg>
