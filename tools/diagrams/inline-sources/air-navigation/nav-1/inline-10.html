<svg width="100%" viewBox="0 0 280 280">
            <!-- N-pole view (looking down) -->
            <circle cx="140" cy="140" r="110" fill="#d6eaf8" stroke="#1a3a5c" stroke-width="1.5"/>
            <!-- North Pole centre point -->
            <circle cx="140" cy="140" r="5" fill="#1a3a5c"/>
            <text x="140" y="128" text-anchor="middle" font-size="9" font-weight="700" fill="#1a3a5c">N POLE</text>
            <!-- Greenwich Meridian - bottom -->
            <line x1="140" y1="140" x2="140" y2="250" stroke="#1a7a4a" stroke-width="2.5"/>
            <text x="140" y="264" text-anchor="middle" font-size="10" fill="#1a7a4a" font-weight="700">0° (Greenwich)</text>
            <!-- Anti-Meridian - top -->
            <line x1="140" y1="140" x2="140" y2="30" stroke="#1a7a4a" stroke-width="1.5" stroke-dasharray="5,3"/>
            <text x="140" y="22" text-anchor="middle" font-size="9" fill="#1a7a4a">180°E/W</text>
            <!-- Equator circle -->
            <circle cx="140" cy="140" r="110" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="8,5"/>
            <text x="248" y="148" font-size="9" fill="#c0392b">Equator</text>
            <!-- Point B meridian (40°E) -->
            <line x1="140" y1="140" x2="220" y2="210" stroke="#6c3483" stroke-width="2"/>
            <circle cx="220" cy="210" r="5" fill="#6c3483"/>
            <text x="226" y="208" font-size="10" font-weight="700" fill="#6c3483">B</text>
            <text x="231" y="220" font-size="9" fill="#6c3483">040°E</text>
            <!-- Q point on Equator (where B's meridian crosses) -->
            <circle cx="196" cy="230" r="4" fill="#d4a017"/>
            <text x="186" y="243" font-size="9" fill="#d4a017">Q (on Equator)</text>
            <!-- Angle arc for 40°E -->
            <path d="M140,220 A80,80 0 0,1 190,226" fill="none" stroke="#6c3483" stroke-width="1.5"/>
            <text x="148" y="238" font-size="9" fill="#6c3483">40°</text>
            <!-- East / West labels -->
            <text x="245" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="#1a7a4a">E→</text>
            <text x="35" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="#1a7a4a">←W</text>
            <!-- East longitudes region label -->
            <text x="200" y="95" text-anchor="middle" font-size="9" fill="#1a5276">East</text>
            <text x="200" y="105" text-anchor="middle" font-size="9" fill="#1a5276">Longitudes</text>
            <!-- West longitudes region label -->
            <text x="80" y="95" text-anchor="middle" font-size="9" fill="#7e5009">West</text>
            <text x="80" y="105" text-anchor="middle" font-size="9" fill="#7e5009">Longitudes</text>
          </svg>
