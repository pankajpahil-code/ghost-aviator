<svg width="100%" viewBox="0 0 280 260">
            <defs><marker id="nm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#1a7a4a" stroke-width="2"/></marker></defs>
            <!-- Meridian line (vertical) -->
            <line x1="140" y1="20" x2="140" y2="230" stroke="#1a3a5c" stroke-width="2.5"/>
            <!-- Earth circle outline -->
            <circle cx="140" cy="130" r="100" fill="none" stroke="#b8cfe8" stroke-width="1.5" stroke-dasharray="8,5"/>
            <!-- Centre -->
            <circle cx="140" cy="130" r="4" fill="#1a3a5c"/>
            <!-- 1-minute arc markers (approx 1 NM) -->
            <circle cx="158" cy="80" r="4" fill="#1a7a4a"/>
            <circle cx="155" cy="65" r="4" fill="#1a7a4a"/>
            <!-- Arc between them -->
            <path d="M140,130 L158,80" stroke="#d4a017" stroke-width="1.2" stroke-dasharray="3,3"/>
            <path d="M140,130 L155,65" stroke="#d4a017" stroke-width="1.2" stroke-dasharray="3,3"/>
            <path d="M155,65 A4.5,4.5 0 0,1 158,80" fill="none" stroke="#6c3483" stroke-width="1.5"/>
            <text x="165" y="74" font-size="10" fill="#6c3483" font-weight="700">1'</text>
            <!-- distance label -->
            <line x1="162" y1="80" x2="195" y2="80" stroke="#1a7a4a" stroke-width="1.5" marker-end="url(#nm)"/>
            <text x="200" y="83" font-size="9" fill="#1a7a4a" font-weight="700">= 1 NM</text>
            <text x="200" y="93" font-size="8" fill="#5a7a9a">= 1852 m</text>
            <!-- Equator line -->
            <line x1="40" y1="130" x2="240" y2="130" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,3"/>
            <text x="245" y="133" font-size="9" fill="#c0392b" dominant-baseline="central">Equator</text>
            <!-- Two latitude points on meridian -->
            <circle cx="140" cy="100" r="5" fill="#ca6f1e"/>
            <circle cx="140" cy="130" r="5" fill="#ca6f1e"/>
            <text x="150" y="103" font-size="10" font-weight="700" fill="#ca6f1e">50°05'N</text>
            <text x="150" y="133" font-size="10" font-weight="700" fill="#ca6f1e">50°00'N</text>
            <!-- Distance between them -->
            <line x1="132" y1="100" x2="132" y2="130" stroke="#c0392b" stroke-width="2" marker-end="url(#nm)"/>
            <text x="100" y="117" font-size="10" fill="#c0392b" font-weight="700">5' = 5 NM</text>
            <!-- Labels -->
            <text x="140" y="248" text-anchor="middle" font-size="11" font-weight="700" fill="#1a3a5c">1ʹ latitude change = 1 NM</text>
          </svg>
