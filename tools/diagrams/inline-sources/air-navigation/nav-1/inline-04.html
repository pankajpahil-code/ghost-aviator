<svg width="100%" viewBox="0 0 280 320">
            <!-- Outer ring -->
            <circle cx="140" cy="155" r="115" fill="#f8fafd" stroke="#b8cfe8" stroke-width="1"/>
            <circle cx="140" cy="155" r="90"  fill="#eef4fb" stroke="#1a3a5c" stroke-width="1.5"/>
            <!-- Degree ticks -->
            <g id="ticks">
              <!-- Major ticks every 30° -->
              <line x1="140" y1="65" x2="140" y2="80" stroke="#1a3a5c" stroke-width="2"/>
              <line x1="140" y1="230" x2="140" y2="245" stroke="#1a3a5c" stroke-width="2"/>
              <line x1="50"  y1="155" x2="65" y2="155" stroke="#1a3a5c" stroke-width="2"/>
              <line x1="215" y1="155" x2="230" y2="155" stroke="#1a3a5c" stroke-width="2"/>
            </g>
            <!-- Cardinal directions on ring -->
            <text x="140" y="58" text-anchor="middle" font-size="15" font-weight="800" fill="#d4a017">N</text>
            <text x="140" y="265" text-anchor="middle" font-size="15" font-weight="800" fill="#c0392b">S</text>
            <text x="245" y="160" text-anchor="middle" font-size="15" font-weight="800" fill="#1a7a4a">E</text>
            <text x="35"  y="160" text-anchor="middle" font-size="15" font-weight="800" fill="#1a5276">W</text>
            <!-- Degree values -->
            <text x="140" y="96" text-anchor="middle" font-size="11" fill="#1a3a5c" font-family="'Source Code Pro',monospace">000°</text>
            <text x="225" y="160" text-anchor="middle" font-size="11" fill="#1a7a4a" font-family="'Source Code Pro',monospace">090°</text>
            <text x="140" y="228" text-anchor="middle" font-size="11" fill="#c0392b" font-family="'Source Code Pro',monospace">180°</text>
            <text x="56"  y="160" text-anchor="middle" font-size="11" fill="#1a5276" font-family="'Source Code Pro',monospace">270°</text>
            <!-- Clockwise arrow -->
            <path d="M 140,75 A 80,80 0 0,1 215,140" fill="none" stroke="#6c3483" stroke-width="2" marker-end="url(#markerCW)"/>
            <text x="200" y="110" text-anchor="middle" font-size="9" fill="#6c3483" font-weight="700">Clockwise</text>
            <!-- Centre dot -->
            <circle cx="140" cy="155" r="6" fill="#1a3a5c"/>
            <!-- True North indicator -->
            <polygon points="140,75 134,105 146,105" fill="#d4a017"/>
            <!-- Title -->
            <text x="140" y="295" text-anchor="middle" font-size="12" fill="#1a3a5c" font-weight="700">True North (T)</text>
            <text x="140" y="310" text-anchor="middle" font-size="10" fill="#5a7a9a">Sexagesimal compass — 360° system</text>
            <defs>
              <marker id="markerCW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
                <path d="M2 1L8 5L2 9" fill="none" stroke="#6c3483" stroke-width="2"/>
              </marker>
            </defs>
          </svg>
