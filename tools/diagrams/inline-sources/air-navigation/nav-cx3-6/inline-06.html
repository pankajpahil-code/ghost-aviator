<svg viewBox="0 0 820 520" width="820" height="520" role="img" aria-labelledby="dcT dcD">
  <title id="dcT">Decision chart for the four Chapter 6 calculations</title>
  <desc id="dcD">Start by asking what the question wants. If it wants a speed, and gives Mach, use
  Airspeed Planned MACH. If it wants a speed from CAS, use Airspeed Planned TAS, which handles
  compressibility itself. If it wants a height for terrain clearance, that is true altitude and
  there is no CX-3 function — use the formula. If it wants a height for performance, that is
  density altitude and the CX-3 Altitude function does it.</desc>

  <defs>
    <marker id="d6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9a227" stroke="none"/>
    </marker>
  </defs>

  <rect x="290" y="14" width="240" height="44" rx="6" fill="#1a2942" stroke="#c9a227" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" fill="#f5f2e8" font-family="Georgia,serif" font-size="15">What is the question asking for?</text>

  <path d="M410,58 L410,80 L210,80 L210,104" fill="none" stroke="#c9a227" stroke-width="2" marker-end="url(#d6)"/>
  <path d="M410,58 L410,80 L610,80 L610,104" fill="none" stroke="#c9a227" stroke-width="2" marker-end="url(#d6)"/>

  <rect x="110" y="108" width="200" height="38" rx="5" fill="#eef6fa" stroke="#2e86ab" stroke-width="1.8"/>
  <text x="210" y="132" text-anchor="middle" fill="#1d5f7d" font-family="Georgia,serif" font-size="14" font-weight="bold">a SPEED</text>

  <rect x="510" y="108" width="200" height="38" rx="5" fill="#fdf6e8" stroke="#b9770e" stroke-width="1.8"/>
  <text x="610" y="132" text-anchor="middle" fill="#8a5a08" font-family="Georgia,serif" font-size="14" font-weight="bold">a HEIGHT</text>

  <!-- speed branch -->
  <path d="M210,146 L210,168 L130,168 L130,196" fill="none" stroke="#2e86ab" stroke-width="1.8" marker-end="url(#d6)"/>
  <path d="M210,146 L210,168 L290,168 L290,196" fill="none" stroke="#2e86ab" stroke-width="1.8" marker-end="url(#d6)"/>
  <text x="130" y="188" text-anchor="middle" fill="#41616f" font-family="Georgia,serif" font-size="11.5">given Mach</text>
  <text x="290" y="188" text-anchor="middle" fill="#41616f" font-family="Georgia,serif" font-size="11.5">given CAS</text>

  <rect x="34" y="200" width="192" height="62" rx="5" fill="#1a2942" stroke="#2e86ab" stroke-width="1.6"/>
  <text x="130" y="221" text-anchor="middle" fill="#f5f2e8" font-family="Georgia,serif" font-size="13">TAS from Mach</text>
  <text x="130" y="240" text-anchor="middle" fill="#7fc4e4" font-family="monospace" font-size="11">Airspeed &#8594; Planned MACH#</text>
  <text x="130" y="255" text-anchor="middle" fill="#9db4c6" font-family="Georgia,serif" font-size="11">needs temperature only</text>

  <rect x="238" y="200" width="192" height="62" rx="5" fill="#1a2942" stroke="#2e86ab" stroke-width="1.6"/>
  <text x="334" y="221" text-anchor="middle" fill="#f5f2e8" font-family="Georgia,serif" font-size="13">TAS from CAS</text>
  <text x="334" y="240" text-anchor="middle" fill="#7fc4e4" font-family="monospace" font-size="11">Airspeed &#8594; Planned TAS</text>
  <text x="334" y="255" text-anchor="middle" fill="#9db4c6" font-family="Georgia,serif" font-size="11">compressibility handled inside</text>

  <!-- height branch -->
  <path d="M610,146 L610,168 L530,168 L530,196" fill="none" stroke="#b9770e" stroke-width="1.8" marker-end="url(#d6)"/>
  <path d="M610,146 L610,168 L700,168 L700,196" fill="none" stroke="#b9770e" stroke-width="1.8" marker-end="url(#d6)"/>
  <text x="524" y="188" text-anchor="middle" fill="#7a5a10" font-family="Georgia,serif" font-size="11.5">for terrain</text>
  <text x="706" y="188" text-anchor="middle" fill="#7a5a10" font-family="Georgia,serif" font-size="11.5">for performance</text>

  <rect x="438" y="200" width="188" height="62" rx="5" fill="#fdf1ef" stroke="#c0392b" stroke-width="1.8"/>
  <text x="532" y="221" text-anchor="middle" fill="#8e2c21" font-family="Georgia,serif" font-size="13" font-weight="bold">TRUE ALTITUDE</text>
  <text x="532" y="240" text-anchor="middle" fill="#3a3020" font-family="Georgia,serif" font-size="11.5">no CX-3 function</text>
  <text x="532" y="255" text-anchor="middle" fill="#8e2c21" font-family="Georgia,serif" font-size="11.5">formula &mdash; 4 ft / 1000 / degree</text>

  <rect x="638" y="200" width="150" height="62" rx="5" fill="#1a2942" stroke="#2e86ab" stroke-width="1.6"/>
  <text x="713" y="221" text-anchor="middle" fill="#f5f2e8" font-family="Georgia,serif" font-size="13">Density altitude</text>
  <text x="713" y="240" text-anchor="middle" fill="#7fc4e4" font-family="monospace" font-size="11">Altitude &#8594; DAlt</text>
  <text x="713" y="255" text-anchor="middle" fill="#9db4c6" font-family="Georgia,serif" font-size="11">check with &times;120</text>

  <!-- the tell -->
  <rect x="34" y="300" width="754" height="88" rx="6" fill="#eef8f1" stroke="#1e8449" stroke-width="1.8"/>
  <text x="410" y="324" text-anchor="middle" fill="#146034" font-family="Georgia,serif" font-size="14" font-weight="bold">The tell, when two of them look alike</text>
  <text x="410" y="348" text-anchor="middle" fill="#20301f" font-family="Georgia,serif" font-size="13">True altitude and density altitude both take an altitude and a temperature and give you a height.</text>
  <text x="410" y="368" text-anchor="middle" fill="#20301f" font-family="Georgia,serif" font-size="13">Ask what the answer is <tspan font-style="italic">for</tspan>: clearing the ground, or predicting the climb.</text>

  <rect x="34" y="404" width="754" height="96" rx="6" fill="#fdf6e8" stroke="#b9770e" stroke-width="1.8"/>
  <text x="410" y="428" text-anchor="middle" fill="#8a5a08" font-family="Georgia,serif" font-size="14" font-weight="bold">Two sign checks that catch almost every error in this chapter</text>
  <text x="410" y="452" text-anchor="middle" fill="#3a3020" font-family="Georgia,serif" font-size="13">COLD day &#8594; true altitude is LOWER than indicated. You have less clearance, not more.</text>
  <text x="410" y="472" text-anchor="middle" fill="#3a3020" font-family="Georgia,serif" font-size="13">HOT day &#8594; density altitude is HIGHER than pressure altitude. You have less performance.</text>
  <text x="410" y="492" text-anchor="middle" fill="#7a6a48" font-family="Georgia,serif" font-size="12" font-style="italic">Both bad conditions push the number the way that costs you something. That is how you remember them.</text>
</svg>
