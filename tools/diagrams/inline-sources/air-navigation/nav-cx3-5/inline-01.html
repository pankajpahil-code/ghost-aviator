<svg viewBox="0 0 820 500" role="img" width="820" height="500"
     aria-labelledby="flowtitle flowdesc">
  <title id="flowtitle">Decision chart for choosing between the CX-3 and a scientific calculator</title>
  <desc id="flowdesc">A navigation problem is tested with one question: does it need a
  specific gravity? If yes, the scientific calculator is the route, because no CX-3
  function exists. If no, the CX-3 has a function, and the four routes are Ground
  Speed for distance, speed and time; Fuel for fuel problems; CONV UNIT for unit
  conversions; and Airspeed for temperature.</desc>

  <defs>
    <marker id="ar5" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9a227" stroke="none"/>
    </marker>
  </defs>

  <!-- start -->
  <rect x="300" y="14" width="220" height="44" rx="6"
        fill="#1a2942" stroke="#c9a227" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" fill="#f5f2e8"
        font-family="Georgia,serif" font-size="16">A navigation problem</text>
  <path d="M410,58 L410,98" fill="none" stroke="#c9a227" stroke-width="2" marker-end="url(#ar5)"/>

  <!-- the one question -->
  <polygon points="410,104 550,150 410,196 270,150"
           fill="#24354f" stroke="#c9a227" stroke-width="2"/>
  <text x="410" y="145" text-anchor="middle" fill="#f5f2e8"
        font-family="Georgia,serif" font-size="15">Does it need a</text>
  <text x="410" y="164" text-anchor="middle" fill="#f5f2e8"
        font-family="Georgia,serif" font-size="15">specific gravity?</text>

  <path d="M270,150 L175,150 L175,232" fill="none" stroke="#c9a227"
        stroke-width="2" marker-end="url(#ar5)"/>
  <text x="205" y="142" fill="#c9a227" font-family="Georgia,serif"
        font-size="14" font-weight="bold">yes</text>

  <path d="M550,150 L645,150 L645,232" fill="none" stroke="#c9a227"
        stroke-width="2" marker-end="url(#ar5)"/>
  <text x="600" y="142" fill="#c9a227" font-family="Georgia,serif"
        font-size="14" font-weight="bold">no</text>

  <!-- calculator branch -->
  <rect x="30" y="236" width="290" height="112" rx="6"
        fill="#fdf6e8" stroke="#b9770e" stroke-width="2"/>
  <text x="175" y="262" text-anchor="middle" fill="#8a5a08"
        font-family="Georgia,serif" font-size="15" font-weight="bold">Scientific calculator</text>
  <text x="175" y="288" text-anchor="middle" fill="#3a3020"
        font-family="Georgia,serif" font-size="14">litres &#215; SG = kilograms</text>
  <text x="175" y="310" text-anchor="middle" fill="#3a3020"
        font-family="Georgia,serif" font-size="14">kilograms &#247; SG = litres</text>
  <text x="175" y="333" text-anchor="middle" fill="#7a6a48"
        font-family="Georgia,serif" font-size="12.5">no CX-3 function exists</text>

  <!-- CX-3 branch -->
  <rect x="500" y="236" width="290" height="62" rx="6"
        fill="#eef8f1" stroke="#1e8449" stroke-width="2"/>
  <text x="645" y="262" text-anchor="middle" fill="#146034"
        font-family="Georgia,serif" font-size="15" font-weight="bold">CX-3</text>
  <text x="645" y="285" text-anchor="middle" fill="#20301f"
        font-family="Georgia,serif" font-size="13.5">pick the function, then check the units</text>

  <!-- spine down the four routes -->
  <path d="M645,298 L645,318 L478,318 L478,462" fill="none"
        stroke="#2e86ab" stroke-width="1.6"/>

  <g font-family="Georgia,serif" font-size="13.5">
    <path d="M478,334 L500,334" fill="none" stroke="#2e86ab" stroke-width="1.6"/>
    <rect x="500" y="316" width="290" height="36" rx="5"
          fill="#1a2942" stroke="#2e86ab" stroke-width="1.4"/>
    <text x="516" y="339" fill="#f5f2e8">distance / speed / time</text>
    <text x="774" y="339" text-anchor="end" fill="#7fc4e4"
          font-family="monospace" font-size="11.5">FLT &#8594; Ground Speed</text>

    <path d="M478,376 L500,376" fill="none" stroke="#2e86ab" stroke-width="1.6"/>
    <rect x="500" y="358" width="290" height="36" rx="5"
          fill="#1a2942" stroke="#2e86ab" stroke-width="1.4"/>
    <text x="516" y="381" fill="#f5f2e8">fuel</text>
    <text x="774" y="381" text-anchor="end" fill="#7fc4e4"
          font-family="monospace" font-size="11.5">FLT &#8594; Fuel</text>

    <path d="M478,418 L500,418" fill="none" stroke="#2e86ab" stroke-width="1.6"/>
    <rect x="500" y="400" width="290" height="36" rx="5"
          fill="#1a2942" stroke="#2e86ab" stroke-width="1.4"/>
    <text x="516" y="423" fill="#f5f2e8">a unit conversion</text>
    <text x="774" y="423" text-anchor="end" fill="#7fc4e4"
          font-family="monospace" font-size="11.5">CONV UNIT</text>

    <path d="M478,460 L500,460" fill="none" stroke="#2e86ab" stroke-width="1.6"/>
    <rect x="500" y="442" width="290" height="36" rx="5"
          fill="#1a2942" stroke="#2e86ab" stroke-width="1.4"/>
    <text x="516" y="465" fill="#f5f2e8">SAT from TAT</text>
    <text x="774" y="465" text-anchor="end" fill="#7fc4e4"
          font-family="monospace" font-size="11.5">FLT &#8594; Airspeed</text>
  </g>
</svg>
