<title id="composition-title">Approximate composition of dry air by volume</title>
<desc id="composition-desc">Nitrogen about 78 percent, oxygen about 21 percent and other gases about 1 percent. Carbon dioxide is variable and is approximately 0.04 percent in contemporary near-surface dry air, rather than the historical 0.03 percent in the replaced illustration.</desc>
