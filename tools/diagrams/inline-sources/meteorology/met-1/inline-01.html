<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="thermal-title thermal-desc">
<title id="thermal-title">Atmospheric layers and their general temperature trend</title><desc id="thermal-desc">A qualitative temperature profile: temperature generally falls in the troposphere, rises through the upper stratosphere, falls in the mesosphere, then rises in the thermosphere. Heights vary; the ionosphere overlaps several upper layers.</desc>
<defs><marker id="thermal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker></defs>
<rect width="1000" height="800" rx="10" fill="#fff"/>
<g font-family="Arial,sans-serif" fill="#17304d">
<text x="500" y="38" text-anchor="middle" font-size="27" font-weight="700">Atmospheric layers and temperature trend</text>
<rect x="80" y="70" width="870" height="100" fill="#fce7e9"/><rect x="80" y="170" width="870" height="130" fill="#fff1d4"/><rect x="80" y="300" width="870" height="190" fill="#def1e6"/><rect x="80" y="490" width="870" height="130" fill="#dfedff"/>
<g font-size="25" font-weight="700"><text x="100" y="110">THERMOSPHERE</text><text x="100" y="220">MESOSPHERE</text><text x="100" y="365">STRATOSPHERE</text><text x="100" y="540">TROPOSPHERE</text></g>
<g font-size="20"><text x="100" y="145">Temperature generally rises</text><text x="100" y="255">Temperature generally falls</text><text x="100" y="400">Temperature rises in the upper part</text><text x="100" y="435">Ozone absorbs ultraviolet radiation</text><text x="100" y="575">Temperature usually falls</text><text x="100" y="605">Most clouds and weather</text></g>
<g stroke="#71839b" stroke-width="2" stroke-dasharray="7 5"><line x1="80" y1="170" x2="950" y2="170"/><line x1="80" y1="300" x2="950" y2="300"/><line x1="80" y1="490" x2="950" y2="490"/></g>
<g font-size="17" text-anchor="start"><text x="100" y="164">MESOPAUSE · about 80–85 km</text><text x="100" y="294">STRATOPAUSE · about 50 km</text><text x="100" y="484">TROPOPAUSE · roughly 8–18 km</text></g>
<polyline points="850,620 700,490 700,445 840,300 650,170 900,70" fill="none" stroke="#7e3ca3" stroke-width="5" stroke-linejoin="round"/>
<line x1="55" y1="620" x2="55" y2="80" stroke="#334155" stroke-width="3" marker-end="url(#thermal-arrow)"/><text x="28" y="350" text-anchor="middle" font-size="21" transform="rotate(-90 28 350)">Increasing height</text>
<line x1="600" y1="660" x2="930" y2="660" stroke="#334155" stroke-width="3" marker-end="url(#thermal-arrow)"/><g font-size="20"><text x="600" y="689">Colder</text><text x="930" y="689" text-anchor="end">Warmer</text><text x="500" y="733" text-anchor="middle">Qualitative schematic, not to scale. Layer heights vary.</text><text x="500" y="771" text-anchor="middle">The ionosphere overlaps several upper layers; it is not a separate thermal layer.</text></g>
</g></svg>
