<svg viewBox="0 0 420 200" xmlns="http://www.w3.org/2000/svg" width="420" height="200">
      <rect width="420" height="200" fill="#f9f9f9" rx="8"/>
      <text x="210" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a237e">Isobaric Levels: Warm vs Cold Column</text>
      <!-- Cold column -->
      <rect x="30" y="35" width="100" height="140" fill="#dbeeff" stroke="#2c5aa0" stroke-width="1.5" rx="4"/>
      <text x="80" y="55" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">COLD</text>
      <!-- Warm column -->
      <rect x="150" y="35" width="100" height="140" fill="#fff3e0" stroke="#e65100" stroke-width="1.5" rx="4"/>
      <text x="200" y="55" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">WARM</text>
      <!-- Cold column 2 -->
      <rect x="270" y="35" width="100" height="140" fill="#dbeeff" stroke="#2c5aa0" stroke-width="1.5" rx="4"/>
      <text x="320" y="55" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">COLD</text>
      <!-- 5000 ft: a fixed height, so a level line -->
      <text x="380" y="88" font-size="10" fill="#c0392b">5000 ft</text>
      <line x1="30" y1="85" x2="370" y2="85" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3"/>
      <!-- 850 hPa line -->
      <text x="380" y="106" font-size="10" fill="#7b1fa2">850 hPa</text>
      <path d="M30,102 L125,102 C140,102 140,70 155,70 L245,70 C260,70 260,102 275,102 L370,102" fill="none" stroke="#7b1fa2" stroke-width="2" stroke-dasharray="5,3"/>
      <!-- 1000 hPa line at base -->
      <text x="380" y="165" font-size="10" fill="#555">1000 hPa</text>
      <line x1="30" y1="162" x2="370" y2="162" stroke="#1a237e" stroke-width="2"/>
      <!-- ISA label -->
      <text x="210" y="188" text-anchor="middle" font-size="10" fill="#555">Surface: the same pressure under every column</text>
    </svg>
