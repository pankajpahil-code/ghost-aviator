<svg viewBox="0 0 420 180" xmlns="http://www.w3.org/2000/svg" width="420" height="180">
      <rect width="420" height="180" fill="#f9f9f9" rx="8"/>
      <text x="210" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a237e">Obliquity of Sun's Rays — Insolation Comparison</text>
      <!-- LEFT: Oblique rays (less insolation) -->
      <text x="135" y="40" text-anchor="middle" font-size="11" fill="#555">Oblique Rays</text>
      <text x="150" y="52" text-anchor="middle" font-size="10" fill="#555">(Less Insolation)</text>
      <line x1="40" y1="60" x2="140" y2="140" stroke="#f57c00" stroke-width="2.5"/>
      <line x1="55" y1="60" x2="155" y2="140" stroke="#f57c00" stroke-width="2.5"/>
      <line x1="70" y1="60" x2="170" y2="140" stroke="#f57c00" stroke-width="2.5"/>
      <!-- Ground left -->
      <line x1="20" y1="148" x2="180" y2="148" stroke="#4e342e" stroke-width="3"/>
      <!-- Spread indicator left -->
      <line x1="40" y1="148" x2="170" y2="148" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3"/>
      <text x="105" y="163" text-anchor="middle" font-size="10" fill="#c0392b">Wide spread → Less intensity</text>
      <!-- SUN left -->
      <circle cx="55" cy="50" r="10" fill="#FDD835" stroke="#f57c00" stroke-width="1.5"/>
      <text x="55" y="54" text-anchor="middle" font-size="9" fill="#333">SUN</text>

      <!-- RIGHT: Vertical rays (more insolation) -->
      <text x="370" y="40" text-anchor="middle" font-size="11" fill="#555">Vertical Rays</text>
      <text x="370" y="52" text-anchor="middle" font-size="10" fill="#555">(More Insolation)</text>
      <line x1="295" y1="58" x2="295" y2="148" stroke="#f57c00" stroke-width="2.5"/>
      <line x1="310" y1="58" x2="310" y2="148" stroke="#f57c00" stroke-width="2.5"/>
      <line x1="325" y1="58" x2="325" y2="148" stroke="#f57c00" stroke-width="2.5"/>
      <!-- Ground right -->
      <line x1="270" y1="148" x2="380" y2="148" stroke="#4e342e" stroke-width="3"/>
      <!-- Spread indicator right -->
      <line x1="295" y1="148" x2="325" y2="148" stroke="#2e7d32" stroke-width="2" stroke-dasharray="4,3"/>
      <text x="322" y="163" text-anchor="middle" font-size="10" fill="#2e7d32">Narrow → More intensity</text>
      <!-- SUN right -->
      <circle cx="310" cy="47" r="10" fill="#FDD835" stroke="#f57c00" stroke-width="1.5"/>
      <text x="310" y="51" text-anchor="middle" font-size="9" fill="#333">SUN</text>
    </svg>
