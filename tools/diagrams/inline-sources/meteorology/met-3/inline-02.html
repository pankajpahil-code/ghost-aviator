<svg viewBox="0 0 460 230" xmlns="http://www.w3.org/2000/svg" width="460" height="230">
      <rect width="460" height="230" fill="#f9f9f9" rx="8"/>
      <text x="230" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a237e">Diurnal Variation of Surface Temperature</text>
      <!-- Axes -->
      <line x1="50" y1="180" x2="430" y2="180" stroke="#333" stroke-width="2"/>
      <line x1="50" y1="30" x2="50" y2="180" stroke="#333" stroke-width="2"/>
      <!-- X axis labels -->
      <text x="50" y="195" text-anchor="middle" font-size="9" fill="#555">0000</text>
      <text x="114" y="195" text-anchor="middle" font-size="9" fill="#555">0400</text>
      <text x="178" y="195" text-anchor="middle" font-size="9" fill="#555">0800</text>
      <text x="242" y="195" text-anchor="middle" font-size="9" fill="#555">1200</text>
      <text x="306" y="195" text-anchor="middle" font-size="9" fill="#555">1600</text>
      <text x="370" y="195" text-anchor="middle" font-size="9" fill="#555">2000</text>
      <text x="430" y="195" text-anchor="middle" font-size="9" fill="#555">2400</text>
      <text x="240" y="215" text-anchor="middle" font-size="10" fill="#555">Local Time →</text>
      <!-- Y axis label -->
      <text x="18" y="110" text-anchor="middle" font-size="10" fill="#555" transform="rotate(-90,18,110)">Temp</text>
      <!-- Temperature curve: starts moderate, drops to min ~0530 (x≈130), rises to max ~1430 (x≈308), then falls -->
      <path d="M50,120 Q90,125 130,140 Q160,148 178,140 Q220,110 270,60 Q308,42 320,42 Q360,55 390,85 Q420,110 430,120"
            fill="none" stroke="#c0392b" stroke-width="3"/>
      <!-- Min marker -->
      <circle cx="130" cy="140" r="5" fill="#2c5aa0"/>
      <line x1="130" y1="140" x2="130" y2="180" stroke="#2c5aa0" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="130" y="175" text-anchor="middle" font-size="9" fill="#2c5aa0">MIN</text>
      <text x="130" y="165" text-anchor="middle" font-size="8" fill="#2c5aa0">½–1hr</text>
      <text x="130" y="157" text-anchor="middle" font-size="8" fill="#2c5aa0">after dawn</text>
      <!-- Max marker -->
      <circle cx="320" cy="42" r="5" fill="#c0392b"/>
      <line x1="320" y1="42" x2="320" y2="180" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="320" y="175" text-anchor="middle" font-size="9" fill="#c0392b">MAX</text>
      <text x="320" y="165" text-anchor="middle" font-size="8" fill="#c0392b">2–3hr</text>
      <text x="320" y="157" text-anchor="middle" font-size="8" fill="#c0392b">after noon</text>
      <!-- Sunrise marker -->
      <line x1="170" y1="30" x2="170" y2="180" stroke="#f57c00" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="170" y="46" text-anchor="middle" font-size="9" fill="#f57c00">Sunrise</text>
      <!-- Noon marker -->
      <line x1="242" y1="30" x2="242" y2="180" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="242" y="46" text-anchor="middle" font-size="9" fill="#888">Noon</text>
    </svg>
