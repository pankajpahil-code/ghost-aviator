<svg viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg" style="max-width:700px; border:1px solid #ddd; border-radius:8px;">
    <!-- Background -->
    <rect width="700" height="280" fill="#f9f9ff" rx="8"/>
    <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a237e">Factors Affecting Air Density</text>
    <!-- Central node -->
    <ellipse cx="350" cy="140" rx="80" ry="35" fill="#1a237e" stroke="#0d1b6e" stroke-width="2"/>
    <text x="350" y="135" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Air</text>
    <text x="350" y="152" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Density</text>
    <!-- Altitude -->
    <rect x="40" y="60" width="160" height="70" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="120" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565c0">ALTITUDE ↑</text>
    <text x="120" y="108" text-anchor="middle" font-size="11" fill="#333">Less dense air</text>
    <text x="120" y="122" text-anchor="middle" font-size="11" fill="#c0392b">(↓ Density)</text>
    <line x1="200" y1="95" x2="268" y2="128" stroke="#1565c0" stroke-width="2" marker-end="url(#arr)"/>
    <!-- Temperature -->
    <rect x="40" y="168" width="160" height="70" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
    <text x="120" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">TEMPERATURE ↑</text>
    <text x="120" y="216" text-anchor="middle" font-size="11" fill="#333">Warmer air</text>
    <text x="120" y="230" text-anchor="middle" font-size="11" fill="#c0392b">(↓ Density)</text>
    <line x1="200" y1="190" x2="268" y2="155" stroke="#e65100" stroke-width="2" marker-end="url(#arr2)"/>
    <!-- Humidity -->
    <rect x="500" y="105" width="160" height="70" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="580" y="133" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d32">HUMIDITY ↑</text>
    <text x="580" y="153" text-anchor="middle" font-size="11" fill="#333">Moist air</text>
    <text x="580" y="167" text-anchor="middle" font-size="11" fill="#c0392b">(↓ Density, small)</text>
    <line x1="500" y1="140" x2="432" y2="140" stroke="#2e7d32" stroke-width="2" marker-end="url(#arr3)"/>
    <!-- Arrow markers -->
    <defs>
      <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#1565c0"/></marker>
      <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#e65100"/></marker>
      <marker id="arr3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2e7d32"/></marker>
    </defs>
    <text x="350" y="260" text-anchor="middle" font-size="11" fill="#666">All three factors reduce density when increased</text>
  </svg>
