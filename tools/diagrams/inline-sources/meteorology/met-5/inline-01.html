<svg viewBox="0 0 750 260" xmlns="http://www.w3.org/2000/svg" style="max-width:750px; border:1px solid #ddd; border-radius:8px;">
    <rect width="750" height="260" fill="#f9f9ff" rx="8"/>
    <text x="375" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a237e">Temperature Hierarchy in Unsaturated Air</text>

    <!-- Temperature scale bar -->
    <rect x="80" y="55" width="590" height="30" rx="5" fill="url(#tempGrad)"/>
    <defs>
      <linearGradient id="tempGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#b3e5fc"/>
        <stop offset="50%" style="stop-color:#81c784"/>
        <stop offset="100%" style="stop-color:#ef9a9a"/>
      </linearGradient>
    </defs>
    <text x="80" y="48" text-anchor="middle" font-size="11" fill="#1565c0">COLD</text>
    <text x="670" y="48" text-anchor="middle" font-size="11" fill="#c0392b">WARM</text>

    <!-- Frost Point -->
    <line x1="155" y1="85" x2="155" y2="145" stroke="#6a1b9a" stroke-width="2" stroke-dasharray="4"/>
    <rect x="90" y="148" width="130" height="55" rx="6" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
    <text x="155" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#6a1b9a">Frost Point</text>
    <text x="155" y="182" text-anchor="middle" font-size="10" fill="#555">Saturation wrt ICE</text>
    <text x="155" y="196" text-anchor="middle" font-size="10" fill="#555">Below → Hoar Frost</text>

    <!-- Dew Point -->
    <line x1="310" y1="85" x2="310" y2="145" stroke="#1565c0" stroke-width="2" stroke-dasharray="4"/>
    <rect x="240" y="148" width="140" height="55" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="310" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">Dew Point (Td)</text>
    <text x="310" y="182" text-anchor="middle" font-size="10" fill="#555">Saturation wrt WATER</text>
    <text x="310" y="196" text-anchor="middle" font-size="10" fill="#555">Below → Condensation</text>

    <!-- Wet Bulb -->
    <line x1="480" y1="85" x2="480" y2="145" stroke="#2e7d32" stroke-width="2" stroke-dasharray="4"/>
    <rect x="410" y="148" width="140" height="55" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="480" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">Wet Bulb (Tw)</text>
    <text x="480" y="182" text-anchor="middle" font-size="10" fill="#555">Evaporative cooling</text>
    <text x="480" y="196" text-anchor="middle" font-size="10" fill="#555">Desert cooler principle</text>

    <!-- Air Temp -->
    <line x1="620" y1="85" x2="620" y2="145" stroke="#c0392b" stroke-width="2" stroke-dasharray="4"/>
    <rect x="560" y="148" width="120" height="55" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <text x="620" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Air Temp (TT)</text>
    <text x="620" y="182" text-anchor="middle" font-size="10" fill="#555">Actual temp</text>
    <text x="620" y="196" text-anchor="middle" font-size="10" fill="#555">Dry bulb reading</text>

    <!-- Relationship label -->
    <text x="375" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a237e">Unsaturated Air: Frost Pt &lt; Td &lt; Tw &lt; TT</text>
    <text x="375" y="250" text-anchor="middle" font-size="12" fill="#2e7d32">Saturated Air (Fog/Rain): TT = Tw = Td</text>
  </svg>
