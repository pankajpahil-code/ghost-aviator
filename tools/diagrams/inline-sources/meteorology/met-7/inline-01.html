<svg viewBox="0 0 500 200" xmlns="http://www.w3.org/2000/svg" style="margin:15px 0;max-width:100%;border:1px solid #ddd;border-radius:6px;">
  <rect width="500" height="200" fill="#f8f9fa"/>
  <!-- Ground -->
  <rect x="0" y="160" width="500" height="40" fill="#8d6e63"/>
  <text x="250" y="180" text-anchor="middle" fill="white" font-size="12">AERODROME</text>
  <!-- Fog layer -->
  <rect x="0" y="100" width="500" height="60" fill="rgba(180,200,220,0.6)" stroke="#90a4ae" stroke-width="1"/>
  <text x="10" y="125" fill="#37474f" font-size="11">Fog/Haze layer</text>
  <!-- Aircraft -->
  <text x="420" y="60" font-size="20">✈</text>
  <text x="370" y="25" fill="#1a237e" font-size="11">Aircraft descending</text>
  <!-- Vertical arrow (good) -->
  <line x1="350" y1="65" x2="350" y2="155" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="355" y="90" fill="#2e7d32" font-size="10">Vertical viz</text>
  <text x="355" y="102" fill="#2e7d32" font-size="10">(GOOD)</text>
  <!-- Slant arrow (poor) -->
  <line x1="420" y1="65" x2="200" y2="158" stroke="#c0392b" stroke-width="2"/>
  <text x="170" y="125" fill="#c0392b" font-size="10">Slant viz (POOR)</text>
  <!-- Aerodrome clearly visible label -->
  <text x="50" y="75" fill="#555" font-size="10">Aerodrome clearly visible</text>
  <text x="50" y="88" fill="#555" font-size="10">from directly above</text>
  <!-- Thick fog base label -->
  <text x="10" y="155" fill="#37474f" font-size="10">Thick fog base</text>
</svg>
