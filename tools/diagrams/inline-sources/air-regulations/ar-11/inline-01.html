<svg viewBox="0 0 600 120" xmlns="http://www.w3.org/2000/svg" style="max-height:120px;">
        <rect x="10" y="40" width="580" height="40" rx="4" fill="#e8e8e8" stroke="#bbb"/>
        <!-- White section -->
        <rect x="10" y="40" width="290" height="40" rx="4" fill="#f0f0f0" stroke="none"/>
        <!-- Alt R/W section -->
        <rect x="300" y="40" width="150" height="40" fill="#fde8e8" stroke="none"/>
        <!-- Red section -->
        <rect x="450" y="40" width="140" height="40" rx="4" fill="#f8d7da" stroke="none"/>
        <!-- Threshold marker -->
        <line x1="10" y1="30" x2="10" y2="90" stroke="#333" stroke-width="2" stroke-dasharray="4,3"/>
        <text x="12" y="28" font-size="9" fill="#333" font-family="monospace">Threshold</text>
        <!-- 900m marker -->
        <line x1="300" y1="30" x2="300" y2="90" stroke="#666" stroke-width="1.5" stroke-dasharray="4,3"/>
        <text x="250" y="28" font-size="9" fill="#555" font-family="monospace">900 m from end</text>
        <!-- 300m marker -->
        <line x1="450" y1="30" x2="450" y2="90" stroke="#666" stroke-width="1.5" stroke-dasharray="4,3"/>
        <text x="400" y="28" font-size="9" fill="#555" font-family="monospace">300 m from end</text>
        <!-- End marker -->
        <line x1="590" y1="30" x2="590" y2="90" stroke="#333" stroke-width="2" stroke-dasharray="4,3"/>
        <text x="560" y="28" font-size="9" fill="#333" font-family="monospace">END</text>
        <!-- Labels inside -->
        <text x="155" y="65" font-size="10" fill="#444" text-anchor="middle" font-family="monospace">Variable WHITE</text>
        <text x="375" y="62" font-size="9" fill="#c0392b" text-anchor="middle" font-family="monospace">Alt R/W</text>
        <text x="520" y="65" font-size="10" fill="#c0392b" text-anchor="middle" font-family="monospace">RED</text>
        <!-- Dots representing lights -->
        <g>
          <circle cx="50" cy="60" r="4" fill="white" stroke="#aaa" stroke-width="1"/>
          <circle cx="100" cy="60" r="4" fill="white" stroke="#aaa" stroke-width="1"/>
          <circle cx="150" cy="60" r="4" fill="white" stroke="#aaa" stroke-width="1"/>
          <circle cx="200" cy="60" r="4" fill="white" stroke="#aaa" stroke-width="1"/>
          <circle cx="250" cy="60" r="4" fill="white" stroke="#aaa" stroke-width="1"/>
          <!-- Alt section -->
          <circle cx="320" cy="60" r="4" fill="white" stroke="#888" stroke-width="1"/>
          <circle cx="350" cy="60" r="4" fill="#dc3545" stroke="#b02a37" stroke-width="1"/>
          <circle cx="380" cy="60" r="4" fill="white" stroke="#888" stroke-width="1"/>
          <circle cx="410" cy="60" r="4" fill="#dc3545" stroke="#b02a37" stroke-width="1"/>
          <!-- Red section -->
          <circle cx="470" cy="60" r="4" fill="#dc3545" stroke="#b02a37" stroke-width="1"/>
          <circle cx="500" cy="60" r="4" fill="#dc3545" stroke="#b02a37" stroke-width="1"/>
          <circle cx="530" cy="60" r="4" fill="#dc3545" stroke="#b02a37" stroke-width="1"/>
          <circle cx="560" cy="60" r="4" fill="#dc3545" stroke="#b02a37" stroke-width="1"/>
        </g>
      </svg>
