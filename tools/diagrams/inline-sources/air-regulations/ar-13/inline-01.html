<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" style="max-width:680px;width:100%;border:1px solid #dce3ee;border-radius:6px;background:#fafbfd;">
      <!-- Boxes -->
      <rect x="20" y="80" width="140" height="52" rx="6" fill="#fff3cd" stroke="#d4ac0d" stroke-width="1.5"/>
      <text x="90" y="101" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7d5a00" font-weight="bold">Pilot realises he</text>
      <text x="90" y="118" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7d5a00">is over prohibited</text>
      <text x="90" y="131" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7d5a00">area</text>

      <rect x="210" y="80" width="140" height="52" rx="6" fill="#fde8e8" stroke="#c0392b" stroke-width="1.5"/>
      <text x="280" y="101" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#922b21" font-weight="bold">IMMEDIATELY</text>
      <text x="280" y="118" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#922b21">Give DISTRESS</text>
      <text x="280" y="131" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#922b21">SIGNAL</text>

      <rect x="400" y="60" width="140" height="52" rx="6" fill="#e8faf0" stroke="#1e8449" stroke-width="1.5"/>
      <text x="470" y="81" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e5631" font-weight="bold">Do NOT fly</text>
      <text x="470" y="98" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e5631">deeper into area</text>
      <text x="470" y="111" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e5631">(unless weather)</text>

      <rect x="400" y="130" width="140" height="52" rx="6" fill="#e8f0fe" stroke="#1a3a6e" stroke-width="1.5"/>
      <text x="470" y="151" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1a3a6e" font-weight="bold">Land at nearest</text>
      <text x="470" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1a3a6e">aerodrome</text>
      <text x="470" y="181" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1a3a6e">outside the area</text>

      <!-- Arrows -->
      <line x1="160" y1="106" x2="208" y2="106" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>
      <line x1="350" y1="90" x2="398" y2="86" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>
      <line x1="350" y1="116" x2="390" y2="150" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>
      <defs>
        <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
          <path d="M0,0 L0,6 L8,3 z" fill="#888"/>
        </marker>
      </defs>
    </svg>
