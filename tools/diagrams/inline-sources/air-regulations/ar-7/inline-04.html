<svg viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:660px;">
    <rect width="680" height="220" fill="#0f1e38" rx="8"/>

    <!-- Runway in Use (horizontal, centre) -->
    <rect x="0" y="90" width="680" height="30" fill="#4a4a5a"/>
    <text x="340" y="111" fill="#d4af37" font-size="12" font-family="JetBrains Mono" font-weight="700" text-anchor="middle">RUNWAY IN USE</text>

    <!-- Centre dashes -->
    <line x1="40" y1="105" x2="100" y2="105" stroke="#fff" stroke-width="1.5" stroke-dasharray="16,10"/>
    <line x1="130" y1="105" x2="200" y2="105" stroke="#fff" stroke-width="1.5" stroke-dasharray="16,10"/>
    <line x1="230" y1="105" x2="300" y2="105" stroke="#fff" stroke-width="1.5" stroke-dasharray="16,10"/>
    <line x1="330" y1="105" x2="400" y2="105" stroke="#fff" stroke-width="1.5" stroke-dasharray="16,10"/>
    <line x1="430" y1="105" x2="500" y2="105" stroke="#fff" stroke-width="1.5" stroke-dasharray="16,10"/>
    <line x1="530" y1="105" x2="600" y2="105" stroke="#fff" stroke-width="1.5" stroke-dasharray="16,10"/>

    <!-- Intersecting taxiway -->
    <rect x="298" y="0" width="24" height="90" fill="#3a3a4a"/>
    <rect x="298" y="120" width="24" height="100" fill="#3a3a4a"/>

    <!-- Aircraft A (landed, on taxiway exiting) -->
    <!-- Body -->
    <ellipse cx="310" cy="160" rx="10" ry="28" fill="#ff6b35"/>
    <ellipse cx="310" cy="160" rx="24" ry="8" fill="#ff6b35"/>
    <polygon points="310,134 305,128 315,128" fill="#ff6b35"/>
    <text x="310" y="195" fill="#ff6b35" font-size="10" font-family="JetBrains Mono" text-anchor="middle" font-weight="700">A</text>
    <text x="310" y="207" fill="#ff6b35" font-size="8" font-family="JetBrains Mono" text-anchor="middle">(Landed)</text>

    <!-- Aircraft B (departing, just cleared end left) -->
    <ellipse cx="80" cy="60" rx="28" ry="9" fill="#00e5ff"/>
    <ellipse cx="80" cy="60" rx="8" ry="20" fill="#00e5ff"/>
    <polygon points="80,40 74,28 86,28" fill="#00e5ff"/>
    <line x1="80" y1="20" x2="80" y2="60" stroke="rgba(0,229,255,0.3)" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="80" y="78" fill="#00e5ff" font-size="10" font-family="JetBrains Mono" text-anchor="middle" font-weight="700">B</text>
    <text x="80" y="89" fill="#00e5ff" font-size="8" font-family="JetBrains Mono" text-anchor="middle">(Started turn)</text>

    <!-- Aircraft C (arriving from right) -->
    <ellipse cx="600" cy="60" rx="28" ry="9" fill="#a8ff78"/>
    <ellipse cx="600" cy="60" rx="8" ry="20" fill="#a8ff78"/>
    <polygon points="580,60 594,55 594,65" fill="#a8ff78"/>
    <line x1="640" y1="60" x2="600" y2="60" stroke="rgba(168,255,120,0.4)" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="600" y="78" fill="#a8ff78" font-size="10" font-family="JetBrains Mono" text-anchor="middle" font-weight="700">C</text>
    <text x="600" y="89" fill="#a8ff78" font-size="8" font-family="JetBrains Mono" text-anchor="middle">(Arriving)</text>

    <!-- Legend box -->
    <rect x="400" y="128" width="265" height="78" fill="rgba(0,0,0,0.4)" rx="4"/>
    <text x="410" y="144" fill="#fff" font-size="9" font-family="JetBrains Mono">B or C must pass position limits</text>
    <text x="410" y="157" fill="#fff" font-size="9" font-family="JetBrains Mono">before arriving aircraft crosses</text>
    <text x="410" y="170" fill="#fff" font-size="9" font-family="JetBrains Mono">runway threshold, OR before</text>
    <text x="410" y="183" fill="#fff" font-size="9" font-family="JetBrains Mono">departing aircraft may take off.</text>
    <text x="410" y="198" fill="#d4af37" font-size="8" font-family="JetBrains Mono">(Unless otherwise by ATS authority)</text>
  </svg>
