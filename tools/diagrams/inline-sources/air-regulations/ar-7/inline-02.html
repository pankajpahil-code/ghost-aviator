<svg viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:680px;">
    <!-- Background -->
    <rect width="700" height="360" fill="#0f1e38" rx="8"/>

    <!-- Runway -->
    <rect x="220" y="200" width="260" height="24" fill="#4a4a5a" rx="2"/>
    <!-- Runway centre line dashes -->
    <line x1="230" y1="212" x2="280" y2="212" stroke="#fff" stroke-width="2" stroke-dasharray="14,10"/>
    <line x1="300" y1="212" x2="360" y2="212" stroke="#fff" stroke-width="2" stroke-dasharray="14,10"/>
    <line x1="380" y1="212" x2="440" y2="212" stroke="#fff" stroke-width="2" stroke-dasharray="14,10"/>
    <!-- Runway label -->
    <text x="320" y="218" fill="#d4af37" font-size="12" font-family="JetBrains Mono" font-weight="700" text-anchor="middle" dominant-baseline="middle">RUNWAY</text>

    <!-- Threshold arrow -->
    <polygon points="220,212 230,206 230,218" fill="#d4af37"/>

    <!-- CIRCUIT PATH -->
    <!-- Upwind leg (right side, going up) -->
    <line x1="480" y1="212" x2="480" y2="100" stroke="#00e5ff" stroke-width="2.5" stroke-dasharray="none"/>
    <!-- Arrow upwind -->
    <polygon points="480,100 474,114 486,114" fill="#00e5ff"/>

    <!-- Crosswind leg (top, going left) -->
    <line x1="480" y1="100" x2="320" y2="100" stroke="#00e5ff" stroke-width="2.5"/>
    <polygon points="320,100 334,94 334,106" fill="#00e5ff"/>

    <!-- Downwind leg (going further left, top) -->
    <line x1="320" y1="100" x2="140" y2="100" stroke="#00e5ff" stroke-width="2.5" stroke-dasharray="8,4"/>
    <polygon points="140,100 154,94 154,106" fill="#00e5ff"/>

    <!-- Base leg (left side, going down) -->
    <line x1="140" y1="100" x2="140" y2="212" stroke="#00e5ff" stroke-width="2.5"/>
    <polygon points="140,212 134,198 146,198" fill="#00e5ff"/>

    <!-- Final (coming right, to runway) -->
    <line x1="140" y1="212" x2="220" y2="212" stroke="#00e5ff" stroke-width="2.5"/>
    <!-- Long Final extended -->
    <line x1="30" y1="212" x2="140" y2="212" stroke="#00e5ff" stroke-width="2" stroke-dasharray="6,4"/>
    <polygon points="140,212 126,206 126,218" fill="#00e5ff"/>

    <!-- LABELS -->
    <text x="490" y="158" fill="#00e5ff" font-size="11" font-family="JetBrains Mono" font-weight="700">UPWIND</text>

    <text x="310" y="87" fill="#00e5ff" font-size="11" font-family="JetBrains Mono" font-weight="700" text-anchor="middle">DOWNWIND</text>

    <text x="128" y="160" fill="#00e5ff" font-size="11" font-family="JetBrains Mono" font-weight="700" text-anchor="end">BASE LEG</text>

    <text x="180" y="235" fill="#00e5ff" font-size="11" font-family="JetBrains Mono" font-weight="700" text-anchor="middle">FINAL</text>

    <text x="66" y="235" fill="#ffd700" font-size="10" font-family="JetBrains Mono" font-weight="700" text-anchor="middle">LONG</text>
    <text x="66" y="247" fill="#ffd700" font-size="10" font-family="JetBrains Mono" font-weight="700" text-anchor="middle">FINAL</text>

    <!-- Crosswind label -->
    <text x="400" y="87" fill="#00e5ff" font-size="10" font-family="JetBrains Mono" text-anchor="middle">CROSSWIND</text>

    <!-- Wind direction arrow -->
    <line x1="320" y1="145" x2="420" y2="145" stroke="#ff6b35" stroke-width="2"/>
    <polygon points="420,145 408,139 408,151" fill="#ff6b35"/>
    <text x="365" y="140" fill="#ff6b35" font-size="10" font-family="JetBrains Mono" text-anchor="middle">WIND</text>

    <!-- Distances -->
    <!-- 4NM bracket -->
    <line x1="80" y1="268" x2="220" y2="268" stroke="#d4af37" stroke-width="1.5"/>
    <line x1="80" y1="262" x2="80" y2="274" stroke="#d4af37" stroke-width="1.5"/>
    <line x1="220" y1="262" x2="220" y2="274" stroke="#d4af37" stroke-width="1.5"/>
    <text x="150" y="285" fill="#d4af37" font-size="11" font-family="JetBrains Mono" font-weight="700" text-anchor="middle">← 4 NM →</text>
    <text x="150" y="298" fill="#aaa" font-size="9" font-family="JetBrains Mono" text-anchor="middle">(Final)</text>

    <!-- Beyond 4NM bracket -->
    <line x1="30" y1="308" x2="220" y2="308" stroke="#ffd700" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="30" y1="302" x2="30" y2="314" stroke="#ffd700" stroke-width="1.5"/>
    <line x1="220" y1="302" x2="220" y2="314" stroke="#ffd700" stroke-width="1.5"/>
    <text x="125" y="328" fill="#ffd700" font-size="10" font-family="JetBrains Mono" font-weight="700" text-anchor="middle">Beyond 4 NM, up to 8 NM</text>
    <text x="125" y="342" fill="#ffd700" font-size="9" font-family="JetBrains Mono" text-anchor="middle">(Long Final)</text>

    <!-- Legend -->
    <rect x="520" y="280" width="160" height="64" fill="rgba(0,0,0,0.4)" rx="4"/>
    <line x1="530" y1="296" x2="560" y2="296" stroke="#00e5ff" stroke-width="2"/>
    <text x="568" y="300" fill="#00e5ff" font-size="9" font-family="JetBrains Mono">Visual Circuit</text>
    <line x1="530" y1="316" x2="560" y2="316" stroke="#00e5ff" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="568" y="320" fill="#00e5ff" font-size="9" font-family="JetBrains Mono">Extended (Long)</text>
    <line x1="530" y1="336" x2="560" y2="336" stroke="#ff6b35" stroke-width="2"/>
    <text x="568" y="340" fill="#ff6b35" font-size="9" font-family="JetBrains Mono">Wind Direction</text>
  </svg>
