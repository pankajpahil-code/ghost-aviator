<svg viewBox="0 0 520 260" xmlns="http://www.w3.org/2000/svg" width="100%" style="max-width:520px;">
      <!-- runway -->
      <rect x="220" y="200" width="60" height="50" fill="#555" rx="2"/>
      <text x="250" y="230" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">DER</text>
      <!-- straight segment -->
      <line x1="250" y1="200" x2="250" y2="110" stroke="#2980b9" stroke-width="2.5"/>
      <!-- turn -->
      <path d="M250,110 Q260,80 320,60 Q380,40 420,30" stroke="#27ae60" stroke-width="2.5" fill="none"/>
      <!-- VOR/NDB -->
      <circle cx="420" cy="30" r="7" fill="none" stroke="#e67e22" stroke-width="2"/>
      <text x="432" y="34" font-size="11" fill="#e67e22" font-weight="700">VOR/NDB</text>
      <!-- 15° label -->
      <text x="258" y="105" font-size="11" fill="#c0392b" font-weight="700">Turn ≥ 15°</text>
      <!-- 120m height -->
      <line x1="210" y1="110" x2="240" y2="110" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,2"/>
      <text x="140" y="114" font-size="11" fill="#c0392b" font-weight="700">120 m (394 ft)</text>
      <!-- splay angle -->
      <line x1="250" y1="200" x2="150" y2="50" stroke="#e74c3c" stroke-width="1" stroke-dasharray="4,2" opacity="0.5"/>
      <line x1="250" y1="200" x2="350" y2="50" stroke="#e74c3c" stroke-width="1" stroke-dasharray="4,2" opacity="0.5"/>
      <text x="80" y="48" font-size="10" fill="#e74c3c">Splay 7.8°/10.3°</text>
      <!-- 150m label -->
      <text x="262" y="220" font-size="10" fill="#555">150 m</text>
    </svg>
