<svg viewBox="0 0 560 200" xmlns="http://www.w3.org/2000/svg" width="100%" style="max-width:560px;">
      <!-- runway -->
      <rect x="250" y="140" width="60" height="50" fill="#555" rx="2"/>
      <text x="280" y="170" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">RWY</text>
      <!-- DER line -->
      <line x1="230" y1="140" x2="330" y2="140" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,2"/>
      <text x="340" y="144" font-size="11" fill="#c0392b" font-weight="700">DER</text>
      <!-- C/L extension -->
      <line x1="280" y1="140" x2="280" y2="10" stroke="#2980b9" stroke-width="2" stroke-dasharray="5,3"/>
      <text x="310" y="42" font-size="10" fill="#2980b9">C/L Extended</text>
      <!-- splay 15° left -->
      <line x1="280" y1="140" x2="80" y2="10" stroke="#27ae60" stroke-width="1.5"/>
      <text x="62" y="8" font-size="10" fill="#27ae60">15°</text>
      <!-- splay 15° right -->
      <line x1="280" y1="140" x2="480" y2="10" stroke="#27ae60" stroke-width="1.5"/>
      <text x="482" y="8" font-size="10" fill="#27ae60">15°</text>
      <!-- VOR distance markers -->
      <circle cx="280" cy="10" r="5" fill="none" stroke="#2980b9" stroke-width="2"/>
      <text x="310" y="18" font-size="10" fill="#2980b9">VOR/NDB</text>
      <!-- 150m label -->
      <line x1="250" y1="170" x2="190" y2="170" stroke="#555" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="148" y="174" font-size="10" fill="#555">150 m</text>
      <text x="148" y="186" font-size="10" fill="#555">from C/L</text>
      <!-- departure track -->
      <text x="290" y="75" font-size="11" fill="#1a3a6b" font-weight="700">Departure</text>
      <text x="290" y="88" font-size="11" fill="#1a3a6b" font-weight="700">Track</text>
    </svg>
