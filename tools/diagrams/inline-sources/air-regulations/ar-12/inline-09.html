<svg viewBox="0 0 480 200" xmlns="http://www.w3.org/2000/svg" width="100%" style="max-width:480px;">
      <!-- vertical axis -->
      <line x1="60" y1="20" x2="60" y2="175" stroke="#555" stroke-width="2"/>
      <!-- FL zone -->
      <rect x="70" y="20" width="370" height="60" rx="4" fill="#e8f4fd" stroke="#2980b9" stroke-width="1.5"/>
      <text x="255" y="46" text-anchor="middle" font-size="13" fill="#1a3a6b" font-weight="700">FLIGHT LEVELS (1013.2 hPa)</text>
      <text x="255" y="62" text-anchor="middle" font-size="11" fill="#2980b9">Above transition level</text>
      <!-- transition layer -->
      <rect x="70" y="80" width="370" height="30" rx="4" fill="#fff3cd" stroke="#f0a500" stroke-width="1.5"/>
      <text x="255" y="100" text-anchor="middle" font-size="12" fill="#7a5800" font-weight="700">TRANSITION LAYER</text>
      <!-- Altitude zone -->
      <rect x="70" y="110" width="370" height="55" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
      <text x="255" y="135" text-anchor="middle" font-size="13" fill="#1a6b3a" font-weight="700">ALTITUDE (QNH)</text>
      <text x="255" y="153" text-anchor="middle" font-size="11" fill="#27ae60">At or below transition altitude</text>
      <!-- arrows -->
      <text x="30" y="55" text-anchor="middle" font-size="10" fill="#2980b9" font-weight="700" transform="rotate(-90,30,55)">SET 1013.2</text>
      <text x="30" y="135" text-anchor="middle" font-size="10" fill="#27ae60" font-weight="700" transform="rotate(-90,30,135)">SET QNH</text>
      <!-- climb descent -->
      <text x="450" y="68" text-anchor="end" font-size="11" fill="#c0392b" font-weight="700">↑ Change at TA</text>
      <text x="450" y="116" text-anchor="end" font-size="11" fill="#c0392b" font-weight="700">↓ Change at TL</text>
    </svg>
