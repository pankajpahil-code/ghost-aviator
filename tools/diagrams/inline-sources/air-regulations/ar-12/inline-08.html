<svg viewBox="0 0 440 300" xmlns="http://www.w3.org/2000/svg" width="100%" style="max-width:440px;">
      <!-- Sector 1 (parallel) -->
      <path d="M220,150 L220,30 L30,30 L30,150 Z" fill="#1a3a6b" opacity="0.7"/>
      <text x="110" y="100" text-anchor="middle" font-size="20" fill="#fff" font-weight="900">1</text>
      <text x="110" y="120" text-anchor="middle" font-size="11" fill="#b0c8e8">Parallel Entry</text>
      <!-- Sector 2 (offset) -->
      <path d="M220,150 L220,270 L30,270 L30,150 Z" fill="#0d5c63" opacity="0.7"/>
      <text x="110" y="220" text-anchor="middle" font-size="20" fill="#fff" font-weight="900">2</text>
      <text x="110" y="240" text-anchor="middle" font-size="11" fill="#b0e0d8">Offset Entry (30°)</text>
      <!-- Sector 3 (direct) -->
      <path d="M220,30 L410,150 L220,270 Z" fill="#27ae60" opacity="0.6"/>
      <text x="330" y="155" text-anchor="middle" font-size="20" fill="#fff" font-weight="900">3</text>
      <text x="332" y="175" text-anchor="middle" font-size="11" fill="#d0f5e0">Direct Entry</text>
      <!-- Holding fix -->
      <circle cx="220" cy="150" r="8" fill="#c0392b"/>
      <text x="222" y="185" font-size="11" fill="#c0392b" font-weight="700">FIX</text>
      <!-- Holding pattern -->
      <ellipse cx="330" cy="100" rx="60" ry="40" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="5,3"/>
      <!-- 70° angles -->
      <line x1="220" y1="150" x2="220" y2="30" stroke="#fff" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.7"/>
      <line x1="220" y1="150" x2="30" y2="150" stroke="#fff" stroke-width="1" stroke-dasharray="3,2" opacity="0.4"/>
      <!-- angle labels -->
      <text x="224" y="50" font-size="11" fill="#fff" font-weight="700">70°</text>
      <text x="224" y="255" font-size="11" fill="#fff" font-weight="700">70°</text>
      <!-- zone of flexibility -->
      <text x="220" y="22" text-anchor="middle" font-size="10" fill="#ffd700">Zone of flexibility: ±5°</text>
    </svg>
