<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;">
      <!-- Background grid -->
      <line x1="60" y1="40" x2="760" y2="40" stroke="#e0e0e0" stroke-width="1"/>
      <line x1="60" y1="100" x2="760" y2="100" stroke="#e0e0e0" stroke-width="1"/>
      <line x1="60" y1="160" x2="760" y2="160" stroke="#e0e0e0" stroke-width="1"/>
      <line x1="60" y1="220" x2="760" y2="220" stroke="#e0e0e0" stroke-width="1"/>
      <line x1="60" y1="280" x2="760" y2="280" stroke="#e0e0e0" stroke-width="1"/>

      <!-- Y axis -->
      <line x1="60" y1="40" x2="60" y2="280" stroke="#333" stroke-width="2"/>
      <text x="55" y="44" font-size="11" text-anchor="end" fill="#333">25%</text>
      <text x="55" y="104" font-size="11" text-anchor="end" fill="#333">20%</text>
      <text x="55" y="164" font-size="11" text-anchor="end" fill="#333">15%</text>
      <text x="55" y="224" font-size="11" text-anchor="end" fill="#333">10%</text>
      <text x="55" y="284" font-size="11" text-anchor="end" fill="#333">0%</text>

      <!-- Title -->
      <text x="400" y="20" font-size="13" font-weight="700" text-anchor="middle" fill="#1a3a6c">Aircraft Accident Distribution by Phase of Flight</text>

      <!-- Bars (height proportional to %) -->
      <!-- Preflight/Taxi: 9.5% -->
      <rect x="80" y="166" width="60" height="114" fill="#c0392b" stroke="#8b1a13" stroke-width="1"/>
      <text x="110" y="160" font-size="11" font-weight="700" text-anchor="middle" fill="#c0392b">9.5%</text>

      <!-- Takeoff/Initial Climb: 23.4% -->
      <rect x="160" y="50" width="60" height="230" fill="#c0392b" stroke="#8b1a13" stroke-width="1"/>
      <text x="190" y="44" font-size="11" font-weight="700" text-anchor="middle" fill="#c0392b">23.4%</text>

      <!-- Climb: 3.3% -->
      <rect x="240" y="240" width="60" height="40" fill="#c0392b" stroke="#8b1a13" stroke-width="1"/>
      <text x="270" y="234" font-size="11" font-weight="700" text-anchor="middle" fill="#c0392b">3.3%</text>

      <!-- Cruise: 15.7% -->
      <rect x="320" y="92" width="60" height="188" fill="#c0392b" stroke="#8b1a13" stroke-width="1"/>
      <text x="350" y="86" font-size="11" font-weight="700" text-anchor="middle" fill="#c0392b">15.7%</text>

      <!-- Descent: 2.6% -->
      <rect x="400" y="248" width="60" height="32" fill="#c0392b" stroke="#8b1a13" stroke-width="1"/>
      <text x="430" y="242" font-size="11" font-weight="700" text-anchor="middle" fill="#c0392b">2.6%</text>

      <!-- Maneuvering: 13% -->
      <rect x="480" y="124" width="60" height="156" fill="#c0392b" stroke="#8b1a13" stroke-width="1"/>
      <text x="510" y="118" font-size="11" font-weight="700" text-anchor="middle" fill="#c0392b">13%</text>

      <!-- Approach: 9.7% -->
      <rect x="560" y="164" width="60" height="116" fill="#c0392b" stroke="#8b1a13" stroke-width="1"/>
      <text x="590" y="158" font-size="11" font-weight="700" text-anchor="middle" fill="#c0392b">9.7%</text>

      <!-- Landing: 24.1% -->
      <rect x="640" y="42" width="60" height="238" fill="#c0392b" stroke="#8b1a13" stroke-width="1"/>
      <text x="670" y="36" font-size="11" font-weight="700" text-anchor="middle" fill="#c0392b">24.1%</text>

      <!-- Other: 4.7% -->
      <rect x="720" y="224" width="40" height="56" fill="#c0392b" stroke="#8b1a13" stroke-width="1"/>
      <text x="740" y="218" font-size="11" font-weight="700" text-anchor="middle" fill="#c0392b">4.7%</text>

      <!-- X axis labels -->
      <text x="110" y="298" font-size="10" text-anchor="middle" fill="#333">Preflight/</text>
      <text x="110" y="310" font-size="10" text-anchor="middle" fill="#333">Taxi</text>

      <text x="190" y="298" font-size="10" text-anchor="middle" fill="#333">Take-off/</text>
      <text x="190" y="310" font-size="10" text-anchor="middle" fill="#333">Initial Climb</text>

      <text x="270" y="298" font-size="10" text-anchor="middle" fill="#333">Climb</text>
      <text x="350" y="298" font-size="10" text-anchor="middle" fill="#333">Cruise</text>
      <text x="430" y="298" font-size="10" text-anchor="middle" fill="#333">Descent</text>
      <text x="510" y="298" font-size="10" text-anchor="middle" fill="#333">Maneuvering</text>
      <text x="590" y="298" font-size="10" text-anchor="middle" fill="#333">Approach</text>
      <text x="670" y="298" font-size="10" text-anchor="middle" fill="#333">Landing</text>
      <text x="740" y="298" font-size="10" text-anchor="middle" fill="#333">Other</text>

      <!-- Flight time groupings (top banners) -->
      <rect x="160" y="328" width="60" height="22" fill="#2c5aa0" opacity="0.85"/>
      <text x="190" y="343" font-size="10" font-weight="700" text-anchor="middle" fill="#fff">2%</text>

      <rect x="240" y="328" width="220" height="22" fill="#2c5aa0" opacity="0.85"/>
      <text x="350" y="343" font-size="10" font-weight="700" text-anchor="middle" fill="#fff">Flight Time 83% (Climb + Cruise + Descent)</text>

      <rect x="560" y="328" width="140" height="22" fill="#2c5aa0" opacity="0.85"/>
      <text x="630" y="343" font-size="10" font-weight="700" text-anchor="middle" fill="#fff">15% (Approach + Landing)</text>

      <text x="190" y="370" font-size="9" text-anchor="middle" fill="#666" font-style="italic">↑ % flight time</text>
    </svg>
