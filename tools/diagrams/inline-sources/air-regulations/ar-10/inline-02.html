<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:700px;display:block;margin:0 auto;">
    <defs>
      <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#344563"/>
      </marker>
    </defs>
    <!-- Diamond: Is first aircraft SAR? -->
    <polygon points="350,30 500,100 350,170 200,100" fill="#0B1F3A" stroke="#D4A017" stroke-width="2"/>
    <text x="350" y="90" text-anchor="middle" fill="#F0C040" font-family="Barlow Condensed,sans-serif" font-size="13" font-weight="700">First aircraft to</text>
    <text x="350" y="108" text-anchor="middle" fill="#F0C040" font-family="Barlow Condensed,sans-serif" font-size="13" font-weight="700">reach scene = SAR?</text>
    <!-- YES path — right -->
    <line x1="500" y1="100" x2="610" y2="100" stroke="#344563" stroke-width="2" marker-end="url(#arr2)"/>
    <text x="548" y="92" text-anchor="middle" fill="#1E8449" font-family="Barlow Condensed,sans-serif" font-size="12" font-weight="700">YES</text>
    <rect x="610" y="72" width="80" height="56" rx="8" fill="#1E8449"/>
    <text x="650" y="95" text-anchor="middle" fill="white" font-family="Barlow Condensed,sans-serif" font-size="11" font-weight="700">SAR aircraft</text>
    <text x="650" y="111" text-anchor="middle" fill="white" font-family="Barlow Condensed,sans-serif" font-size="11">takes command</text>
    <!-- NO path — left -->
    <line x1="200" y1="100" x2="90" y2="100" stroke="#344563" stroke-width="2" marker-end="url(#arr2)"/>
    <text x="142" y="92" text-anchor="middle" fill="#C0392B" font-family="Barlow Condensed,sans-serif" font-size="12" font-weight="700">NO</text>
    <rect x="10" y="72" width="80" height="56" rx="8" fill="#C0392B"/>
    <text x="50" y="95" text-anchor="middle" fill="white" font-family="Barlow Condensed,sans-serif" font-size="11" font-weight="700">First non-SAR</text>
    <text x="50" y="111" text-anchor="middle" fill="white" font-family="Barlow Condensed,sans-serif" font-size="11">takes command</text>
    <!-- Arrow down from NO box -->
    <line x1="50" y1="128" x2="50" y2="200" stroke="#344563" stroke-width="2" marker-end="url(#arr2)"/>
    <rect x="0" y="200" width="100" height="70" rx="8" fill="#142D52"/>
    <text x="50" y="220" text-anchor="middle" fill="#AED6F1" font-family="Barlow Condensed,sans-serif" font-size="10">Commands ALL</text>
    <text x="50" y="234" text-anchor="middle" fill="#AED6F1" font-family="Barlow Condensed,sans-serif" font-size="10">subsequent aircraft</text>
    <text x="50" y="252" text-anchor="middle" fill="#F0C040" font-family="Barlow Condensed,sans-serif" font-size="10" font-weight="700">UNTIL 1st SAR a/c</text>
    <text x="50" y="266" text-anchor="middle" fill="#F0C040" font-family="Barlow Condensed,sans-serif" font-size="10" font-weight="700">arrives</text>
    <!-- Arrow: SAR arrives, takes over -->
    <line x1="100" y1="255" x2="160" y2="255" stroke="#344563" stroke-width="2" marker-end="url(#arr2)"/>
    <line x1="160" y1="255" x2="160" y2="128" stroke="#344563" stroke-width="2"/>
    <line x1="160" y1="128" x2="350" y2="128" stroke="#344563" stroke-width="2" marker-end="url(#arr2)"/>
    <text x="240" y="120" text-anchor="middle" fill="#2E86C1" font-family="Barlow Condensed,sans-serif" font-size="11">SAR a/c arrives → takes over</text>
  </svg>
