<svg viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:680px;display:block;margin:auto;">
      <!-- Background -->
      <rect x="0" y="0" width="680" height="320" fill="#f8f9fc" rx="10"/>

      <!-- Title row -->
      <text x="340" y="25" text-anchor="middle" font-size="13" font-weight="800" fill="#0d1b4b">BELOW FL290 — CVSM (Non-RVSM Airspace)</text>

      <!-- Compass circle left half (000–179 = Odd/Even IFR) -->
      <circle cx="170" cy="175" r="120" fill="white" stroke="#1a3a7a" stroke-width="2"/>
      <!-- Left semi -->
      <path d="M170,55 A120,120 0 0,0 170,295" fill="#d6eaf8" stroke="none"/>
      <!-- Right semi -->
      <path d="M170,55 A120,120 0 0,1 170,295" fill="#d5f5e3" stroke="none"/>
      <!-- Dividing line -->
      <line x1="170" y1="55" x2="170" y2="295" stroke="#0d1b4b" stroke-width="2" stroke-dasharray="6,3"/>

      <!-- Labels inside circle -->
      <text x="100" y="160" text-anchor="middle" font-size="10" font-weight="700" fill="#1a5276">000°–179°</text>
      <text x="100" y="173" text-anchor="middle" font-size="9" fill="#1a5276">IFR: ODD</text>
      <text x="100" y="186" text-anchor="middle" font-size="9" fill="#1a5276">(010,030...)</text>
      <text x="100" y="202" text-anchor="middle" font-size="9" fill="#c0392b">VFR: ODD+500'</text>

      <text x="240" y="160" text-anchor="middle" font-size="10" font-weight="700" fill="#1e8449">180°–359°</text>
      <text x="240" y="173" text-anchor="middle" font-size="9" fill="#1e8449">IFR: EVEN</text>
      <text x="240" y="186" text-anchor="middle" font-size="9" fill="#1e8449">(020,040...)</text>
      <text x="240" y="202" text-anchor="middle" font-size="9" fill="#c0392b">VFR: EVEN+500'</text>

      <!-- North/South labels -->
      <text x="170" y="48" text-anchor="middle" font-size="11" font-weight="800" fill="#0d1b4b">000° / 359°</text>
      <text x="170" y="310" text-anchor="middle" font-size="11" font-weight="800" fill="#0d1b4b">180° / 179°</text>

      <!-- RVSM explanation right side -->
      <rect x="360" y="50" width="300" height="240" rx="10" fill="white" stroke="#c0392b" stroke-width="2"/>
      <text x="510" y="72" text-anchor="middle" font-size="12" font-weight="800" fill="#c0392b">AT &amp; ABOVE FL290 — RVSM</text>
      <text x="510" y="88" text-anchor="middle" font-size="10" fill="#555">(FL290 to FL410 — India)</text>

      <!-- RVSM table inside -->
      <text x="375" y="112" font-size="10" font-weight="700" fill="#0d1b4b">Track 000°–179°</text>
      <text x="375" y="128" font-size="9" fill="#1a5276">IFR: ODD (up to FL400)</text>
      <text x="375" y="143" font-size="9" fill="#1a5276">Then: 430, 470 etc.</text>
      <text x="375" y="158" font-size="9" fill="#c0392b">VFR: NOT ALLOWED</text>

      <text x="510" y="112" font-size="10" font-weight="700" fill="#0d1b4b">Track 180°–359°</text>
      <text x="510" y="128" font-size="9" fill="#1e8449">IFR: EVEN (up to FL410)</text>
      <text x="510" y="143" font-size="9" fill="#1e8449">Then: 450, 490 etc.</text>
      <text x="510" y="158" font-size="9" fill="#c0392b">VFR: NOT ALLOWED</text>

      <line x1="375" y1="170" x2="645" y2="170" stroke="#ccc" stroke-width="1"/>

      <text x="510" y="190" text-anchor="middle" font-size="10" font-weight="700" fill="#6c3483">SEPARATION RULES</text>
      <text x="375" y="208" font-size="9.5" fill="#0d1b4b">Below FL290: Same direction = 2000'</text>
      <text x="375" y="224" font-size="9.5" fill="#0d1b4b">Below FL290: Reciprocal = 1000'</text>
      <text x="375" y="240" font-size="9.5" fill="#0d1b4b">IFR–VFR (both ways) = 500'</text>
      <text x="375" y="258" font-size="9" fill="#c0392b">RVSM: Same dir = 2000' | Recip = 1000'</text>
      <text x="375" y="274" font-size="9" fill="#c0392b">Above RVSM: doubles</text>
    </svg>
