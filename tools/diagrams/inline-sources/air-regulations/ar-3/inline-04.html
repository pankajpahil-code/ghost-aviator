<svg viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:600px;display:block;margin:auto;">
      <!-- Aircraft body -->
      <ellipse cx="300" cy="200" rx="18" ry="60" fill="#2c3e50" />
      <!-- Wings -->
      <polygon points="300,210 100,240 100,250 300,235" fill="#7f8c8d" />
      <polygon points="300,210 500,240 500,250 300,235" fill="#7f8c8d" />
      <!-- Tail -->
      <polygon points="290,140 310,140 305,175 295,175" fill="#7f8c8d" />

      <!-- Red light arc - PORT (left wing) -->
      <path d="M300,200 L100,60 A220,220 0 0,1 100,340 Z" fill="rgba(220,50,50,0.15)" stroke="none"/>
      <!-- Green light arc - STARBOARD (right wing) -->
      <path d="M300,200 L500,60 A220,220 0 0,0 500,340 Z" fill="rgba(40,180,50,0.15)" stroke="none"/>
      <!-- White light arc - REAR -->
      <path d="M300,140 L100,200 A150,150 0 1,0 500,200 Z" fill="rgba(255,255,255,0.12)" stroke="none"/>

      <!-- Light indicators -->
      <circle cx="105" cy="235" r="15" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
      <text x="105" y="240" text-anchor="middle" font-size="9" font-weight="700" fill="white">RED</text>

      <circle cx="495" cy="235" r="15" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
      <text x="495" y="240" text-anchor="middle" font-size="9" font-weight="700" fill="white">GRN</text>

      <circle cx="300" cy="130" r="15" fill="white" stroke="#bdc3c7" stroke-width="2"/>
      <text x="300" y="135" text-anchor="middle" font-size="8" font-weight="700" fill="#555">WHT</text>

      <!-- Angle labels -->
      <text x="55" y="100" font-size="10" font-weight="700" fill="#c0392b">PORT (Left)</text>
      <text x="55" y="114" font-size="10" fill="#c0392b">110° coverage</text>

      <text x="450" y="100" font-size="10" font-weight="700" fill="#27ae60">STBD (Right)</text>
      <text x="450" y="114" font-size="10" fill="#27ae60">110° coverage</text>

      <text x="260" y="55" font-size="10" font-weight="700" fill="#555">WHITE (Rear)</text>
      <text x="255" y="69" font-size="10" fill="#555">140° coverage</text>

      <!-- Memory aid boxes -->
      <rect x="30" y="275" width="180" height="38" rx="6" fill="#fde8e8" stroke="#c0392b" stroke-width="1.5"/>
      <text x="120" y="292" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c0392b">See RED → Give way</text>
      <text x="120" y="306" text-anchor="middle" font-size="9" fill="#555">(other's starboard side)</text>

      <rect x="395" y="275" width="180" height="38" rx="6" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/>
      <text x="485" y="292" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1e8449">See GREEN → Safe</text>
      <text x="485" y="306" text-anchor="middle" font-size="9" fill="#555">(other's port side)</text>
    </svg>
