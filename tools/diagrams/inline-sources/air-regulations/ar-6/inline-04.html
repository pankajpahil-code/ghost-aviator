<svg viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" width="640">
      <!-- Airport circle -->
      <circle cx="340" cy="160" r="60" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
      <text x="340" y="155" text-anchor="middle" font-family="Source Sans 3" font-size="9" fill="#334155" font-weight="700">AERODROME</text>
      <text x="340" y="170" text-anchor="middle" font-family="Source Sans 3" font-size="8" fill="#64748b">THR</text>
      <!-- Runway on circle -->
      <line x1="310" y1="160" x2="370" y2="160" stroke="#94a3b8" stroke-width="3"/>
      <!-- Straight-in approach arrow (A) -->
      <line x1="50" y1="160" x2="280" y2="160" stroke="#1560a8" stroke-width="2.5" marker-end="url(#arr)"/>
      <text x="95" y="135" font-family="Source Sans 3" font-size="9" fill="#1560a8" font-weight="700">Straight-in approach (A)</text>
      <text x="190" y="182" font-family="Source Sans 3" font-size="8" fill="#1560a8">5 min before TDZ</text>
      <!-- 5 min tick -->
      <circle cx="180" cy="160" r="5" fill="#1560a8" opacity="0.7"/>
      <text x="183" y="150" font-family="JetBrains Mono" font-size="7.5" fill="#1560a8">5 min</text>
      <!-- 3 min tick -->
      <circle cx="230" cy="160" r="5" fill="#c8860a" opacity="0.8"/>
      <text x="233" y="150" font-family="JetBrains Mono" font-size="7.5" fill="#c8860a">3 min</text>
      <!-- Procedure turn approach (B) -->
      <path d="M 120 50 Q 200 90 260 130 Q 290 150 310 160" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arr2)"/>
      <text x="140" y="42" font-family="Source Sans 3" font-size="9" fill="#16a34a" font-weight="700">Procedure turn / base turn (B)</text>
      <!-- Departing aircraft tracks -->
      <line x1="370" y1="160" x2="560" y2="80" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5,4"/>
      <text x="490" y="72" font-family="Source Sans 3" font-size="9" fill="#b91c1c" font-weight="700">Dep: ≥45° from reciprocal</text>
      <line x1="370" y1="160" x2="600" y2="160" stroke="#334155" stroke-width="2" stroke-dasharray="5,4"/>
      <text x="470" y="152" font-family="Source Sans 3" font-size="9" fill="#334155">Dep: any direction (before 5 min)</text>
      <!-- Shaded no-takeoff zone -->
      <path d="M 280 130 A 60 60 0 0 1 340 100 L 340 160 Z" fill="rgba(185,28,28,0.10)" stroke="#b91c1c" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="292" y="125" font-family="Source Sans 3" font-size="7.5" fill="#b91c1c">No take-off after</text>
      <text x="292" y="136" font-family="Source Sans 3" font-size="7.5" fill="#b91c1c">procedure turn started</text>
      <!-- Arrow markers -->
      <defs>
        <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
          <polygon points="0,0 8,4 0,8" fill="#1560a8"/>
        </marker>
        <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
          <polygon points="0,0 8,4 0,8" fill="#16a34a"/>
        </marker>
      </defs>
    </svg>
