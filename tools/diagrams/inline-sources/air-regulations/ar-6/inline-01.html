      <rect x="90" y="97" width="15" height="6" rx="2" fill="#fcd34d"/>

      <polygon points="270,100 260,92 260,108" fill="#1560a8"/>

      <line x1="275" y1="72" x2="275" y2="78" stroke="#0d2b4e" stroke-width="1.5"/>

      <polygon points="380,100 370,92 370,108" fill="#c8860a"/>

      <line x1="380" y1="100" x2="560" y2="100" stroke="#1560a8" stroke-width="2" stroke-dasharray="6,4"/>

      <line x1="380" y1="100" x2="560" y2="28" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="6,4"/>

      <path d="M 420 100 A 40 40 0 0 0 408 72" fill="none" stroke="#16a34a" stroke-width="1.5"/>

      <text x="564" y="26" font-family="Source Sans 3" font-size="9" fill="#16a34a" font-weight="700">Diverging ≥45°</text>

      <text x="480" y="165" text-anchor="middle" font-family="Source Sans 3" font-size="9" fill="#64748b" font-style="italic">Lateral separation established immediately after take-off</text>
    </svg>
