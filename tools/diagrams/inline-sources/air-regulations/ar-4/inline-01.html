<svg viewBox="0 0 720 170" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1a6fa8"/>
    </marker>
  </defs>
  <!-- ATS box -->
  <rect x="280" y="10" width="160" height="50" rx="8" fill="#0d2137" />
  <text x="360" y="30" text-anchor="middle" fill="#fff" font-family="Source Sans 3,sans-serif" font-size="12" font-weight="700">AIR TRAFFIC</text>
  <text x="360" y="48" text-anchor="middle" fill="#f59e0b" font-family="Source Sans 3,sans-serif" font-size="11" font-weight="700">SERVICES (ATS)</text>
  <!-- Lines -->
  <line x1="200" y1="60" x2="100" y2="100" stroke="#1a6fa8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="360" y1="60" x2="360" y2="100" stroke="#1a6fa8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="520" y1="60" x2="620" y2="100" stroke="#1a6fa8" stroke-width="2" marker-end="url(#arr)"/>
  <!-- ATC box -->
  <rect x="20" y="100" width="180" height="60" rx="8" fill="#1a6fa8"/>
  <text x="110" y="120" text-anchor="middle" fill="#fff" font-family="Source Sans 3,sans-serif" font-size="11" font-weight="700">Air Traffic Control</text>
  <text x="110" y="134" text-anchor="middle" fill="#dbeafe" font-family="Source Sans 3,sans-serif" font-size="9">Obj. a, b, c</text>
  <text x="110" y="148" text-anchor="middle" fill="#fef9c3" font-family="Source Sans 3,sans-serif" font-size="8">Area · Approach · Aerodrome</text>
  <!-- FIS box -->
  <rect x="270" y="100" width="180" height="60" rx="8" fill="#0e8a7a"/>
  <text x="360" y="120" text-anchor="middle" fill="#fff" font-family="Source Sans 3,sans-serif" font-size="11" font-weight="700">Flight Information</text>
  <text x="360" y="134" text-anchor="middle" fill="#fff" font-family="Source Sans 3,sans-serif" font-size="11" font-weight="700">Service</text>
  <text x="360" y="150" text-anchor="middle" fill="#fef9c3" font-family="Source Sans 3,sans-serif" font-size="9">Obj. d</text>
  <!-- Alerting box -->
  <rect x="520" y="100" width="180" height="60" rx="8" fill="#b91c1c"/>
  <text x="610" y="120" text-anchor="middle" fill="#fff" font-family="Source Sans 3,sans-serif" font-size="11" font-weight="700">Alerting Service</text>
  <text x="610" y="148" text-anchor="middle" fill="#fef9c3" font-family="Source Sans 3,sans-serif" font-size="9">Obj. e</text>
</svg>
