<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;">
      <defs>
        <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
          <path d="M0,0 L0,6 L9,3 z" fill="#1b4080"/>
        </marker>
      </defs>
      <!-- Sensory Input -->
      <text x="20" y="180" font-family="Arial" font-size="14" font-weight="700" fill="#1a1a1a">Sensory Input</text>
      <line x1="120" y1="100" x2="200" y2="140" stroke="#1b4080" stroke-width="2" marker-end="url(#arr)"/>
      <line x1="120" y1="170" x2="200" y2="170" stroke="#1b4080" stroke-width="2" marker-end="url(#arr)"/>
      <line x1="120" y1="240" x2="200" y2="200" stroke="#1b4080" stroke-width="2" marker-end="url(#arr)"/>
      <!-- Sensor Memory -->
      <rect x="200" y="115" width="120" height="120" fill="#2c5aa0" rx="4"/>
      <text x="260" y="170" font-family="Arial" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">SENSORY</text>
      <text x="260" y="195" font-family="Arial" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">MEMORY</text>
      <!-- Arrows out -->
      <line x1="320" y1="140" x2="430" y2="140" stroke="#1b4080" stroke-width="2" marker-end="url(#arr)"/>
      <text x="340" y="130" font-family="Arial" font-size="12" fill="#0f2a4a">Attention</text>
      <line x1="320" y1="200" x2="430" y2="200" stroke="#1b4080" stroke-width="2" marker-end="url(#arr)"/>
      <text x="335" y="215" font-family="Arial" font-size="12" fill="#0f2a4a">Pattern Recog.</text>
      <line x1="260" y1="235" x2="260" y2="305" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr)"/>
      <text x="265" y="325" font-family="Arial" font-size="12" fill="#c0392b">Decay</text>
      <!-- Short-Term Memory -->
      <rect x="430" y="115" width="140" height="120" fill="#0f2a4a" rx="4"/>
      <text x="500" y="160" font-family="Arial" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">SHORT-TERM</text>
      <text x="500" y="185" font-family="Arial" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">MEMORY</text>
      <text x="500" y="210" font-family="Arial" font-size="11" fill="#ffd" text-anchor="middle">(10–20 s)</text>
      <!-- Rehearsal loop -->
      <path d="M500 115 C 480 80, 520 80, 510 115" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr)"/>
      <text x="510" y="78" font-family="Arial" font-size="12" fill="#c0392b" text-anchor="middle">Rehearsal</text>
      <line x1="500" y1="235" x2="500" y2="305" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr)"/>
      <text x="500" y="325" font-family="Arial" font-size="12" fill="#c0392b" text-anchor="middle">Displacement / Decay</text>
      <!-- Arrows STM <-> LTM -->
      <line x1="570" y1="145" x2="650" y2="145" stroke="#1b4080" stroke-width="2" marker-end="url(#arr)"/>
      <text x="580" y="138" font-family="Arial" font-size="12" fill="#0f2a4a">Encoding</text>
      <line x1="650" y1="200" x2="570" y2="200" stroke="#1b4080" stroke-width="2" marker-end="url(#arr)"/>
      <text x="580" y="218" font-family="Arial" font-size="12" fill="#0f2a4a">Retrieval</text>
      <!-- LTM -->
      <rect x="650" y="115" width="120" height="120" fill="#b75800" rx="4"/>
      <text x="710" y="165" font-family="Arial" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">LONG-TERM</text>
      <text x="710" y="190" font-family="Arial" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">MEMORY</text>
      <line x1="710" y1="235" x2="710" y2="305" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr)"/>
      <text x="710" y="325" font-family="Arial" font-size="12" fill="#c0392b" text-anchor="middle">Interference / Lost Cues</text>
      <text x="400" y="350" font-family="Arial" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">L O S S</text>
    </svg>
