<svg viewBox="0 0 760 220" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;">
  <text x="380" y="22" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" text-anchor="middle" fill="#0b2545">Off-Centre Viewing at Night — Why It Works</text>

  <!-- Scenario A: stare directly -->
  <text x="160" y="50" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" text-anchor="middle" fill="#b91c1c" font-weight="700">A. Stare directly = INVISIBLE</text>

  <circle cx="160" cy="120" r="40" fill="#fef6e4" stroke="#b45309" stroke-width="2"/>
  <!-- Pupil arrow direct -->
  <line x1="100" y1="120" x2="138" y2="120" stroke="#0b2545" stroke-width="2.5" marker-end="url(#ax2)"/>
  <defs><marker id="ax2" markerWidth="8" markerHeight="8" refX="4" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#0b2545"/></marker></defs>
  <!-- Target (faint star) -->
  <circle cx="80" cy="120" r="5" fill="#fff" stroke="#0b2545"/>
  <text x="80" y="100" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" text-anchor="middle" fill="#0b2545">Dim target</text>
  <!-- Fovea (all cones) -->
  <circle cx="190" cy="120" r="6" fill="#b91c1c"/>
  <text x="190" y="180" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#7a0d0d">Image lands on fovea</text>
  <text x="190" y="194" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#7a0d0d">→ no rods → INVISIBLE</text>

  <!-- Scenario B: 15-20 deg off-centre -->
  <text x="560" y="50" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" text-anchor="middle" fill="#15803d" font-weight="700">B. Look 15–20° off = VISIBLE</text>

  <circle cx="560" cy="120" r="40" fill="#fef6e4" stroke="#b45309" stroke-width="2"/>
  <!-- Pupil arrow off-axis -->
  <line x1="480" y1="120" x2="520" y2="100" stroke="#0b2545" stroke-width="2.5" marker-end="url(#ax2)"/>
  <!-- Target (faint star) -->
  <circle cx="460" cy="120" r="5" fill="#fff" stroke="#0b2545"/>
  <text x="460" y="100" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" text-anchor="middle" fill="#0b2545">Dim target</text>
  <!-- Off-fovea spot (rods!) -->
  <circle cx="580" cy="135" r="6" fill="#1d4ed8"/>
  <!-- Fovea inert -->
  <circle cx="590" cy="115" r="5" fill="#b91c1c" opacity="0.4"/>
  <text x="560" y="180" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#14532d">Image lands in rod-rich zone</text>
  <text x="560" y="194" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#14532d">→ rods detect dim light ✓</text>

  <!-- Mnemonic banner -->
  <rect x="220" y="200" width="320" height="40" rx="6" fill="#fff4cc" stroke="#d4a017" stroke-width="1.5"/>
  <text x="380" y="226" font-family="Georgia, 'Times New Roman', serif" font-size="13" text-anchor="middle" font-weight="700" fill="#6b4f00">"At night, don't stare — scan."</text>
</svg>
