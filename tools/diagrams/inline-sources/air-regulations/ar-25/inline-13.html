<svg viewBox="0 0 700 230" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;">
  <text x="350" y="22" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" text-anchor="middle" fill="#0b2545">Same drink — very different effect at altitude</text>

  <!-- Sea level scene -->
  <rect x="40" y="50" width="280" height="150" rx="8" fill="#e9f7ee" stroke="#15803d" stroke-width="2"/>
  <text x="180" y="75" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#14532d">SEA LEVEL</text>
  <text x="180" y="90" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#14532d">pO₂ ≈ 21 kPa</text>
  <!-- Drink glass -->
  <path d="M155,110 L155,150 Q155,165 175,165 Q195,165 195,150 L195,110 Z" fill="#d4a017" stroke="#0b2545" stroke-width="1.5"/>
  <text x="175" y="135" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#fff" font-weight="700">1×</text>
  <text x="180" y="187" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#14532d">Effect ≈ 1 drink</text>

  <!-- Arrow -->
  <line x1="330" y1="125" x2="370" y2="125" stroke="#b45309" stroke-width="2.5" marker-end="url(#ax)"/>
  <defs><marker id="ax" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#b45309"/></marker></defs>
  <text x="350" y="115" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#b45309" font-weight="700">Climb to 6,000 ft</text>

  <!-- 6000 ft scene -->
  <rect x="380" y="50" width="280" height="150" rx="8" fill="#fcecec" stroke="#b91c1c" stroke-width="2"/>
  <text x="520" y="75" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#7a0d0d">6,000 ft (1,800 m)</text>
  <text x="520" y="90" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#7a0d0d">pO₂ reduced — hypoxia stacks</text>
  <!-- Two glasses (illusion of doubling) -->
  <path d="M475,110 L475,150 Q475,165 495,165 Q515,165 515,150 L515,110 Z" fill="#d4a017" stroke="#0b2545" stroke-width="1.5"/>
  <text x="495" y="135" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#fff" font-weight="700">1×</text>
  <path d="M525,110 L525,150 Q525,165 545,165 Q565,165 565,150 L565,110 Z" fill="#d4a017" stroke="#0b2545" stroke-width="1.5" opacity="0.55"/>
  <text x="545" y="135" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#fff" font-weight="700">+1×</text>
  <text x="520" y="187" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#7a0d0d">Effect ≈ 2 drinks</text>
</svg>
