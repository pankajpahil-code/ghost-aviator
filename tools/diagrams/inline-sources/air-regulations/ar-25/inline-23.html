<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;">
  <text x="390" y="22" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700" text-anchor="middle" fill="#0b2545">Refractive Defects — Where Light Focuses</text>

  <!-- NORMAL EYE -->
  <text x="120" y="58" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#15803d">NORMAL</text>
  <ellipse cx="120" cy="120" rx="50" ry="40" fill="#e9f7ee" stroke="#15803d" stroke-width="2"/>
  <line x1="50" y1="120" x2="115" y2="120" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="50" y1="100" x2="115" y2="120" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="50" y1="140" x2="115" y2="120" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="160" cy="120" r="4" fill="#15803d"/>
  <text x="120" y="180" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#14532d">Light focuses ON retina ✓</text>

  <!-- MYOPIA -->
  <text x="320" y="58" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1d4ed8">MYOPIA</text>
  <text x="320" y="71" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" text-anchor="middle" fill="#0b2545">eyeball LONGER</text>
  <ellipse cx="320" cy="120" rx="60" ry="40" fill="#e8f0fb" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="240" y1="120" x2="305" y2="120" stroke="#b91c1c" stroke-width="2"/>
  <line x1="240" y1="100" x2="305" y2="120" stroke="#b91c1c" stroke-width="2"/>
  <line x1="240" y1="140" x2="305" y2="120" stroke="#b91c1c" stroke-width="2"/>
  <circle cx="350" cy="120" r="4" fill="#b91c1c"/>
  <text x="320" y="180" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#7a0d0d">Focuses IN FRONT of retina</text>
  <text x="320" y="195" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#0b2545" font-weight="700">→ CONCAVE lens</text>

  <!-- HYPERMETROPIA -->
  <text x="540" y="58" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#b91c1c">HYPERMETROPIA</text>
  <text x="540" y="71" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" text-anchor="middle" fill="#7a0d0d">eyeball SHORTER</text>
  <ellipse cx="540" cy="120" rx="42" ry="40" fill="#fcecec" stroke="#b91c1c" stroke-width="2"/>
  <line x1="475" y1="120" x2="525" y2="120" stroke="#b91c1c" stroke-width="2"/>
  <line x1="475" y1="103" x2="525" y2="120" stroke="#b91c1c" stroke-width="2"/>
  <line x1="475" y1="137" x2="525" y2="120" stroke="#b91c1c" stroke-width="2"/>
  <line x1="525" y1="120" x2="595" y2="120" stroke="#b91c1c" stroke-width="2" stroke-dasharray="3,2"/>
  <circle cx="595" cy="120" r="4" fill="#b91c1c"/>
  <text x="540" y="180" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#7a0d0d">Would focus BEHIND retina</text>
  <text x="540" y="195" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#0b2545" font-weight="700">→ CONVEX lens</text>

  <!-- ASTIGMATISM -->
  <text x="700" y="58" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#b45309">ASTIGMATISM</text>
  <text x="700" y="71" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" text-anchor="middle" fill="#5c2d04">misshapen cornea</text>
  <ellipse cx="700" cy="120" rx="50" ry="32" fill="#fff4e0" stroke="#b45309" stroke-width="2"/>
  <line x1="640" y1="105" x2="685" y2="115" stroke="#b45309" stroke-width="2"/>
  <line x1="640" y1="125" x2="685" y2="135" stroke="#b45309" stroke-width="2"/>
  <text x="700" y="180" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#7a3a07">Objects appear irregularly shaped</text>
  <text x="700" y="195" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#0b2545" font-weight="700">→ Cylindrical lens</text>

  <!-- PRESBYOPIA banner -->
  <rect x="60" y="225" width="660" height="60" rx="6" fill="#fff4cc" stroke="#d4a017" stroke-width="2"/>
  <text x="390" y="248" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700" text-anchor="middle" fill="#6b4f00">PRESBYOPIA — age-related</text>
  <text x="390" y="266" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle" fill="#5c3f00">Lens stops accommodating well between 40 – 50 years &nbsp;·&nbsp; form of long-sightedness</text>
  <text x="390" y="280" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle" fill="#0b2545" font-weight="700">→ CONVEX lens (often bi-focal for pilots)</text>
</svg>
