<svg viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;">
  <text x="360" y="22" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700" text-anchor="middle" fill="#0b2545">Reading a Blood-Pressure Cuff — 120 / 80</text>

  <!-- Sphygmomanometer (simplified) -->
  <rect x="30" y="50" width="220" height="170" rx="10" fill="#fff" stroke="#0b2545" stroke-width="2"/>
  <circle cx="140" cy="125" r="55" fill="#f6f8fb" stroke="#0b2545" stroke-width="2"/>
  <line x1="140" y1="125" x2="172" y2="100" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>
  <text x="140" y="195" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#0b2545">Sphygmomanometer</text>
  <text x="140" y="208" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#6b7280">measures arm-artery pressure</text>

  <!-- BP value box -->
  <rect x="290" y="65" width="180" height="140" rx="10" fill="#e9f7ee" stroke="#15803d" stroke-width="2.5"/>
  <text x="380" y="92" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#14532d">Normal Young Adult</text>
  <text x="380" y="145" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="900" text-anchor="middle" fill="#15803d">120/80</text>
  <text x="380" y="175" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle" fill="#14532d">mmHg</text>
  <text x="380" y="195" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" font-style="italic" text-anchor="middle" fill="#14532d">Systolic / Diastolic</text>

  <!-- Definitions panel -->
  <rect x="510" y="50" width="195" height="170" rx="8" fill="#fff" stroke="#d4d9e1" stroke-width="1.5"/>
  <text x="608" y="72" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#0b2545">Definitions</text>

  <text x="525" y="100" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#b91c1c">SYSTOLIC (120)</text>
  <text x="525" y="114" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" fill="#5a1010">↑ pressure with</text>
  <text x="525" y="126" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" fill="#5a1010">each heartbeat</text>

  <text x="525" y="155" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#1d4ed8">DIASTOLIC (80)</text>
  <text x="525" y="169" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" fill="#0b2545">Permanent pressure</text>
  <text x="525" y="181" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" fill="#0b2545">against artery wall</text>

  <text x="525" y="205" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" font-style="italic" fill="#6b7280">Measured in upper-arm artery</text>
</svg>
