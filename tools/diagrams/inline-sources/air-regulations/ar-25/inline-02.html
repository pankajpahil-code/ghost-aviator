<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;">
  <!-- Sea level balloon -->
  <ellipse cx="120" cy="120" rx="42" ry="50" fill="#fde2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="120" y="125" font-family="'Cascadia Code', 'Consolas', 'Courier New', monospace" font-size="14" font-weight="700" text-anchor="middle" fill="#7a0d0d">V = 1</text>
  <text x="120" y="200" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" text-anchor="middle" fill="#0b2545">Sea Level · 760 mmHg</text>
  <text x="120" y="40" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle" fill="#0b2545">Pressure HIGH ↓ Volume small</text>

  <!-- Arrow -->
  <line x1="190" y1="120" x2="290" y2="120" stroke="#d4a017" stroke-width="3" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#d4a017"/></marker></defs>
  <text x="240" y="110" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" text-anchor="middle" fill="#b45309" font-weight="700">Climb (P ↓)</text>

  <!-- 18000 ft balloon -->
  <ellipse cx="380" cy="120" rx="60" ry="72" fill="#fde2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="380" y="125" font-family="'Cascadia Code', 'Consolas', 'Courier New', monospace" font-size="14" font-weight="700" text-anchor="middle" fill="#7a0d0d">V = 2</text>
  <text x="380" y="200" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" text-anchor="middle" fill="#0b2545">18,000 ft · 380 mmHg</text>

  <!-- Arrow -->
  <line x1="450" y1="120" x2="540" y2="120" stroke="#d4a017" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="495" y="110" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" text-anchor="middle" fill="#b45309" font-weight="700">Climb further</text>

  <!-- 34000 ft balloon -->
  <ellipse cx="620" cy="120" rx="78" ry="90" fill="#fde2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="620" y="125" font-family="'Cascadia Code', 'Consolas', 'Courier New', monospace" font-size="14" font-weight="700" text-anchor="middle" fill="#7a0d0d">V = 4</text>
  <text x="620" y="200" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" text-anchor="middle" fill="#0b2545">34,000 ft · 190 mmHg</text>
</svg>
