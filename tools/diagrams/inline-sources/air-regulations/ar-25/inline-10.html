<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;">
  <!-- Title -->
  <text x="380" y="22" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700" text-anchor="middle" fill="#0b2545">Where each type of hypoxia BREAKS the oxygen-delivery chain</text>

  <!-- 4-stage delivery chain -->
  <!-- Stage 1: Atmosphere -->
  <rect x="30" y="60" width="140" height="80" rx="8" fill="#e8f0fb" stroke="#1d4ed8" stroke-width="2"/>
  <text x="100" y="82" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#0b2545">1. Atmosphere</text>
  <text x="100" y="100" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#0b2545">Adequate pO₂</text>
  <text x="100" y="115" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#0b2545">at sea level</text>
  <text x="100" y="130" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#0b2545">↓ with altitude</text>

  <!-- Arrow -->
  <line x1="170" y1="100" x2="200" y2="100" stroke="#0b2545" stroke-width="2" marker-end="url(#aH)"/>
  <defs><marker id="aH" markerWidth="8" markerHeight="8" refX="4" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#0b2545"/></marker></defs>

  <!-- Stage 2: Blood/Hb -->
  <rect x="200" y="60" width="140" height="80" rx="8" fill="#fde2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="270" y="82" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#7a0d0d">2. Blood / Hb</text>
  <text x="270" y="100" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#7a0d0d">RBCs carry O₂</text>
  <text x="270" y="115" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#7a0d0d">via haemoglobin</text>

  <line x1="340" y1="100" x2="370" y2="100" stroke="#0b2545" stroke-width="2" marker-end="url(#aH)"/>

  <!-- Stage 3: Circulation -->
  <rect x="370" y="60" width="140" height="80" rx="8" fill="#fff4e0" stroke="#b45309" stroke-width="2"/>
  <text x="440" y="82" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#7a3a07">3. Circulation</text>
  <text x="440" y="100" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#7a3a07">Heart pumps</text>
  <text x="440" y="115" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#7a3a07">blood to tissue</text>

  <line x1="510" y1="100" x2="540" y2="100" stroke="#0b2545" stroke-width="2" marker-end="url(#aH)"/>

  <!-- Stage 4: Cell -->
  <rect x="540" y="60" width="160" height="80" rx="8" fill="#f3e8ff" stroke="#6b21a8" stroke-width="2"/>
  <text x="620" y="82" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#5b1989">4. Cell / Mitochondria</text>
  <text x="620" y="100" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#5b1989">Use O₂ for</text>
  <text x="620" y="115" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#5b1989">energy</text>

  <!-- Break points -->
  <!-- Type a: at stage 1 -->
  <text x="100" y="175" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#b91c1c">⛔ Break here ⛔</text>
  <rect x="20" y="190" width="160" height="60" rx="6" fill="#fff5f5" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="100" y="208" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#7a0d0d">(a) HYPOXIC</text>
  <text x="100" y="223" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" text-anchor="middle" fill="#5a1010">Low atmospheric pO₂</text>
  <text x="100" y="236" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" text-anchor="middle" fill="#5a1010">= altitude / hypobaric</text>

  <!-- Type b: at stage 2 -->
  <text x="270" y="175" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1d4ed8">⛔ Break here ⛔</text>
  <rect x="190" y="190" width="160" height="60" rx="6" fill="#f0f5fc" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="270" y="208" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#0b2545">(b) ANEMIC</text>
  <text x="270" y="223" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" text-anchor="middle" fill="#0b2545">Hb low or doesn't work</text>
  <text x="270" y="236" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" text-anchor="middle" fill="#0b2545">CO · bleeding · anemia</text>

  <!-- Type c: at stage 3 -->
  <text x="440" y="175" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#b45309">⛔ Break here ⛔</text>
  <rect x="360" y="190" width="160" height="60" rx="6" fill="#fff8ec" stroke="#b45309" stroke-width="1.5"/>
  <text x="440" y="208" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#7a3a07">(c) ISCHEMIC / STAGNANT</text>
  <text x="440" y="223" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" text-anchor="middle" fill="#5c2d04">Inadequate flow</text>
  <text x="440" y="236" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" text-anchor="middle" fill="#5c2d04">G-forces · fainting · cold</text>

  <!-- Type d: at stage 4 -->
  <text x="620" y="175" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#6b21a8">⛔ Break here ⛔</text>
  <rect x="540" y="190" width="170" height="60" rx="6" fill="#f8f3fb" stroke="#6b21a8" stroke-width="1.5"/>
  <text x="625" y="208" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#5b1989">(d) HISTOTOXIC</text>
  <text x="625" y="223" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" text-anchor="middle" fill="#5b1989">Cells can't USE the O₂</text>
  <text x="625" y="236" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" text-anchor="middle" fill="#5b1989">cyanide · alcohol · drugs</text>

  <!-- Bottom panel: O₂ therapy -->
  <rect x="30" y="275" width="680" height="90" rx="6" fill="#e9f7ee" stroke="#15803d" stroke-width="1.5"/>
  <text x="370" y="297" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#14532d">Does Oxygen Therapy Help?</text>
  <text x="100" y="320" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#14532d">(a) YES</text>
  <text x="100" y="334" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#14532d">100% O₂ + descend</text>
  <text x="100" y="348" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#14532d">below 10,000 ft</text>
  <text x="270" y="320" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#14532d">(b) YES</text>
  <text x="270" y="334" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#14532d">Increase O₂ to</text>
  <text x="270" y="348" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#14532d">remaining Hb</text>
  <text x="440" y="320" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#b91c1c">(c) NOT VERY</text>
  <text x="440" y="334" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#5a1010">Fix the underlying</text>
  <text x="440" y="348" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#5a1010">flow problem first</text>
  <text x="625" y="320" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#b91c1c">(d) NO</text>
  <text x="625" y="334" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#5a1010">Cells can't use it.</text>
  <text x="625" y="348" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#5a1010">Treat the poison</text>
</svg>
