<svg viewBox="0 0 760 280" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;">
  <text x="380" y="22" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700" text-anchor="middle" fill="#0b2545">The Black Hole Effect — Why Pilots Land Short</text>

  <!-- Night sky -->
  <rect x="20" y="40" width="720" height="200" fill="#0b2545"/>
  <g fill="#fff">
    <circle cx="100" cy="60" r="1.5"/>
    <circle cx="200" cy="55" r="1"/>
    <circle cx="350" cy="65" r="1.2"/>
    <circle cx="500" cy="50" r="1.5"/>
    <circle cx="630" cy="58" r="1"/>
    <circle cx="680" cy="70" r="1.2"/>
  </g>

  <!-- Black hole (no cues) -->
  <rect x="20" y="120" width="540" height="80" fill="#000"/>
  <text x="290" y="170" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" text-anchor="middle" fill="#3a3a3a" font-style="italic">No visual cues — "Black Hole"</text>

  <!-- Runway in distance -->
  <polygon points="560,140 620,140 600,210 540,210" fill="#fff4cc" stroke="#d4a017" stroke-width="1.5"/>
  <line x1="568" y1="160" x2="612" y2="160" stroke="#d4a017" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="556" y1="185" x2="604" y2="185" stroke="#d4a017" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="580" y="225" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle" fill="#fff4cc">Runway lights</text>

  <!-- Aircraft -->
  <g transform="translate(80,90)">
    <polygon points="0,0 30,5 45,0 30,-5" fill="#fff" stroke="#b91c1c" stroke-width="1.5"/>
    <polygon points="20,5 25,15 5,15 12,5" fill="#fff" stroke="#b91c1c" stroke-width="1.5"/>
  </g>
  <text x="105" y="80" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#fff">Aircraft</text>

  <!-- Correct (3°) glide path -->
  <line x1="125" y1="100" x2="570" y2="160" stroke="#15803d" stroke-width="2.5" stroke-dasharray="6,3"/>
  <text x="350" y="115" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#86c79e">Correct glide ≈ 3°</text>

  <!-- Pilot's (shallow) path -->
  <line x1="125" y1="100" x2="570" y2="195" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="350" y="155" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#fbbdbd">Pilot's path — too shallow</text>

  <!-- Touchdown short -->
  <line x1="450" y1="170" x2="450" y2="245" stroke="#b91c1c" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="450" y="260" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#b91c1c" font-weight="700">TOUCHDOWN SHORT ⚠</text>
</svg>
