<svg viewBox="0 0 760 280" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;">
  <text x="380" y="22" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700" text-anchor="middle" fill="#0b2545">The Soda-Bottle Analogy — Why Pressure Drop = Bubbles</text>

  <!-- LEFT: sealed bottle -->
  <rect x="80" y="60" width="80" height="160" rx="6" fill="#e9f7ee" stroke="#15803d" stroke-width="2"/>
  <rect x="105" y="50" width="30" height="14" fill="#0b2545"/>
  <text x="120" y="240" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#14532d">SEALED</text>
  <text x="120" y="254" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#14532d">N₂ dissolved</text>
  <text x="120" y="266" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#14532d">in solution</text>
  <!-- liquid -->
  <rect x="84" y="100" width="72" height="116" fill="#86c79e" opacity="0.5"/>

  <!-- Middle: cap off -->
  <rect x="240" y="60" width="80" height="160" rx="6" fill="#fff4e0" stroke="#b45309" stroke-width="2"/>
  <rect x="260" y="40" width="30" height="14" fill="#b45309" transform="rotate(-25,275,47)"/>
  <text x="280" y="240" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#7a3a07">CAP OFF</text>
  <text x="280" y="254" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#5c2d04">Pressure drops</text>
  <text x="280" y="266" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#5c2d04">→ bubbles form</text>
  <rect x="244" y="100" width="72" height="116" fill="#fbbdbd" opacity="0.5"/>
  <!-- bubbles -->
  <g fill="#fff" stroke="#b45309" stroke-width="1">
    <circle cx="260" cy="150" r="4"/>
    <circle cx="275" cy="170" r="5"/>
    <circle cx="290" cy="140" r="3"/>
    <circle cx="300" cy="180" r="4"/>
    <circle cx="265" cy="195" r="6"/>
    <circle cx="295" cy="200" r="3"/>
  </g>

  <!-- Arrow connecting two -->
  <line x1="180" y1="140" x2="220" y2="140" stroke="#0b2545" stroke-width="2" marker-end="url(#bx)"/>
  <defs><marker id="bx" markerWidth="8" markerHeight="8" refX="4" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#0b2545"/></marker></defs>

  <!-- Right: the human body analog -->
  <rect x="400" y="55" width="330" height="180" rx="8" fill="#fcecec" stroke="#b91c1c" stroke-width="2"/>
  <text x="565" y="80" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#7a0d0d">The same in YOUR body at altitude</text>
  <!-- Body silhouette -->
  <ellipse cx="450" cy="115" rx="14" ry="16" fill="#fde2e2" stroke="#b91c1c"/>
  <rect x="438" y="130" width="24" height="50" fill="#fde2e2" stroke="#b91c1c"/>
  <line x1="438" y1="140" x2="425" y2="170" stroke="#b91c1c" stroke-width="2"/>
  <line x1="462" y1="140" x2="475" y2="170" stroke="#b91c1c" stroke-width="2"/>
  <line x1="445" y1="180" x2="438" y2="220" stroke="#b91c1c" stroke-width="2"/>
  <line x1="455" y1="180" x2="462" y2="220" stroke="#b91c1c" stroke-width="2"/>
  <!-- bubbles in joints -->
  <circle cx="425" cy="170" r="4" fill="#fff" stroke="#b91c1c"/>
  <circle cx="475" cy="170" r="4" fill="#fff" stroke="#b91c1c"/>
  <circle cx="438" cy="220" r="4" fill="#fff" stroke="#b91c1c"/>
  <circle cx="462" cy="220" r="4" fill="#fff" stroke="#b91c1c"/>
  <!-- callouts -->
  <line x1="430" y1="170" x2="500" y2="135" stroke="#b91c1c" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="505" y="135" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#7a0d0d">Joints → "Bends" (dull pain)</text>
  <line x1="450" y1="115" x2="500" y2="115" stroke="#b91c1c" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="505" y="118" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#7a0d0d">Brain → "Staggers"</text>
  <line x1="450" y1="155" x2="500" y2="175" stroke="#b91c1c" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="505" y="178" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#7a0d0d">Lungs → "Chokes" (chest pain)</text>
  <line x1="442" y1="180" x2="500" y2="200" stroke="#b91c1c" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="505" y="203" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#7a0d0d">Skin → "Creeps" (formication)</text>
  <text x="505" y="225" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" font-style="italic" fill="#5a1010">Severe cases: collapse + shock</text>
</svg>
