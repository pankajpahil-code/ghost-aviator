<svg viewBox="0 0 760 280" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;">
  <text x="380" y="22" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700" text-anchor="middle" fill="#0b2545">Hb vs O₂ &nbsp;|&nbsp; Hb vs CO — the 200:1 affinity problem</text>

  <!-- Left scenario: normal -->
  <rect x="30" y="50" width="320" height="200" rx="8" fill="#e9f7ee" stroke="#15803d" stroke-width="2"/>
  <text x="190" y="72" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#14532d">NORMAL — clean air</text>

  <!-- Hb -->
  <circle cx="120" cy="150" r="35" fill="#fff4cc" stroke="#d4a017" stroke-width="2"/>
  <text x="120" y="155" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#6b4f00">Hb</text>

  <!-- O2 molecules -->
  <g fill="#15803d">
    <circle cx="220" cy="110" r="9"/>
    <text x="220" y="114" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" text-anchor="middle" fill="#fff" font-weight="700">O₂</text>
    <circle cx="250" cy="140" r="9"/>
    <text x="250" y="144" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" text-anchor="middle" fill="#fff" font-weight="700">O₂</text>
    <circle cx="220" cy="170" r="9"/>
    <text x="220" y="174" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" text-anchor="middle" fill="#fff" font-weight="700">O₂</text>
    <circle cx="280" cy="180" r="9"/>
    <text x="280" y="184" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" text-anchor="middle" fill="#fff" font-weight="700">O₂</text>
  </g>
  <line x1="155" y1="150" x2="200" y2="150" stroke="#15803d" stroke-width="2" marker-end="url(#aN)"/>
  <defs><marker id="aN" markerWidth="8" markerHeight="8" refX="4" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#15803d"/></marker></defs>
  <text x="190" y="215" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle" fill="#14532d">Hb binds available O₂</text>
  <text x="190" y="230" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#14532d">→ delivers O₂ to tissues ✓</text>

  <!-- Right scenario: CO present -->
  <rect x="380" y="50" width="350" height="200" rx="8" fill="#fde2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="555" y="72" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#7a0d0d">CO PRESENT — even trace amounts</text>

  <!-- Hb -->
  <circle cx="470" cy="150" r="35" fill="#fff4cc" stroke="#d4a017" stroke-width="2"/>
  <text x="470" y="155" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#6b4f00">Hb</text>

  <!-- CO molecules pulling on Hb -->
  <g fill="#b91c1c">
    <circle cx="570" cy="120" r="11"/>
    <text x="570" y="124" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" text-anchor="middle" fill="#fff" font-weight="700">CO</text>
    <circle cx="600" cy="155" r="11"/>
    <text x="600" y="159" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" text-anchor="middle" fill="#fff" font-weight="700">CO</text>
    <circle cx="570" cy="190" r="11"/>
    <text x="570" y="194" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" text-anchor="middle" fill="#fff" font-weight="700">CO</text>
  </g>
  <!-- Ignored O2 -->
  <g fill="#9ca3af">
    <circle cx="660" cy="110" r="8" stroke="#9ca3af" stroke-width="2" stroke-dasharray="2,2"/>
    <text x="660" y="114" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="7" text-anchor="middle" fill="#fff">O₂</text>
    <circle cx="680" cy="170" r="8" stroke="#9ca3af" stroke-width="2" stroke-dasharray="2,2"/>
    <text x="680" y="174" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="7" text-anchor="middle" fill="#fff">O₂</text>
  </g>
  <line x1="505" y1="150" x2="555" y2="150" stroke="#b91c1c" stroke-width="3" marker-end="url(#aR)"/>
  <defs><marker id="aR" markerWidth="8" markerHeight="8" refX="4" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#b91c1c"/></marker></defs>
  <text x="555" y="215" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle" fill="#7a0d0d">Hb grabs CO &gt;200× faster than O₂</text>
  <text x="555" y="230" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#7a0d0d">→ no O₂ delivery → anemic hypoxia ✗</text>

  <!-- Big "200x" badge -->
  <circle cx="380" cy="150" r="32" fill="#b91c1c" stroke="#fff" stroke-width="3"/>
  <text x="380" y="148" font-family="Georgia, 'Times New Roman', serif" font-size="14" text-anchor="middle" fill="#fff" font-weight="900">200×</text>
  <text x="380" y="162" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="7" text-anchor="middle" fill="#fff">affinity</text>
</svg>
