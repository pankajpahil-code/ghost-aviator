<svg viewBox="0 0 780 360" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;">
  <text x="390" y="22" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700" text-anchor="middle" fill="#0b2545">Anatomy of the Human Ear — Outer, Middle &amp; Inner</text>

  <!-- OUTER EAR (pinna + auditory canal) -->
  <path d="M40,140 Q80,80 130,90 Q170,100 180,140 L180,210 Q170,250 130,260 Q80,270 40,210 Z" fill="#fde2e2" stroke="#b91c1c" stroke-width="2"/>
  <path d="M70,150 Q90,130 120,135 L120,205 Q90,210 70,200 Z" fill="#fbbdbd" stroke="#b91c1c" stroke-width="1"/>
  <!-- External auditory canal -->
  <rect x="180" y="160" width="60" height="22" fill="#fff4cc" stroke="#d4a017" stroke-width="1.5"/>
  
  <text x="105" y="295" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#b91c1c">OUTER EAR</text>
  <text x="105" y="308" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#7a0d0d">Pinna · Auditory canal</text>
  <text x="105" y="320" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#7a0d0d">collects sound waves</text>

  <!-- MIDDLE EAR -->
  <rect x="240" y="130" width="120" height="80" fill="#fff4e0" stroke="#b45309" stroke-width="2"/>
  <!-- Eardrum -->
  <line x1="240" y1="135" x2="240" y2="205" stroke="#b91c1c" stroke-width="3"/>
  <text x="232" y="125" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" text-anchor="middle" fill="#b91c1c">Eardrum</text>
  <text x="232" y="225" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" text-anchor="middle" fill="#b91c1c">(Tympanum)</text>
  <!-- Ossicles -->
  <circle cx="270" cy="160" r="6" fill="#0b2545"/>
  <text x="270" y="118" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="7" text-anchor="middle" fill="#0b2545">Malleus</text>
  <line x1="270" y1="155" x2="270" y2="125" stroke="#0b2545" stroke-width="1"/>
  <circle cx="300" cy="170" r="6" fill="#0b2545"/>
  <text x="300" y="118" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="7" text-anchor="middle" fill="#0b2545">Incus</text>
  <line x1="300" y1="165" x2="300" y2="125" stroke="#0b2545" stroke-width="1"/>
  <circle cx="335" cy="175" r="6" fill="#0b2545"/>
  <text x="335" y="118" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="7" text-anchor="middle" fill="#0b2545">Stapes</text>
  <line x1="335" y1="170" x2="335" y2="125" stroke="#0b2545" stroke-width="1"/>
  <!-- Eustachian tube -->
  <path d="M280,210 Q300,230 320,255 L370,280" fill="none" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
  <text x="350" y="300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#b45309">Eustachian Tube</text>
  <text x="350" y="312" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" fill="#5c2d04">→ throat / pharynx</text>

  <text x="300" y="92" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#b45309">MIDDLE EAR</text>

  <!-- INNER EAR -->
  <!-- Cochlea -->
  <g transform="translate(420,160)">
    <path d="M0,0 Q30,-20 30,10 Q30,40 0,30 Q-20,20 -10,5 Q0,-5 10,5" fill="#e9f7ee" stroke="#15803d" stroke-width="2"/>
  </g>
  <text x="420" y="225" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#15803d">Cochlea</text>
  <text x="420" y="237" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" text-anchor="middle" fill="#14532d">(hearing)</text>

  <!-- Semicircular canals -->
  <g transform="translate(520,150)">
    <ellipse cx="0" cy="0" rx="20" ry="8" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>
    <ellipse cx="0" cy="0" rx="8" ry="22" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>
    <ellipse cx="0" cy="0" rx="14" ry="14" transform="rotate(45)" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>
  </g>
  <text x="520" y="185" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#1d4ed8">Semicircular</text>
  <text x="520" y="197" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#1d4ed8">Canals (3)</text>
  <text x="520" y="210" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" text-anchor="middle" fill="#0b2545">angular acceleration</text>

  <!-- Otoliths -->
  <circle cx="475" cy="200" r="14" fill="#fff4cc" stroke="#d4a017" stroke-width="2"/>
  <g fill="#6b4f00">
    <circle cx="470" cy="195" r="2"/>
    <circle cx="478" cy="200" r="2"/>
    <circle cx="473" cy="205" r="2"/>
  </g>
  <text x="475" y="232" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#6b4f00">Otoliths</text>
  <text x="475" y="244" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" text-anchor="middle" fill="#5c3f00">linear acceleration</text>

  <text x="490" y="125" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#15803d">INNER EAR (Labyrinth)</text>

  <!-- Vestibular cochlear nerve -->
  <path d="M555,170 Q620,170 670,170" fill="none" stroke="#7a0d0d" stroke-width="3"/>
  <text x="615" y="160" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#7a0d0d">Vestibular Cochlear Nerve</text>
  <text x="615" y="173" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" fill="#5a1010">→ to brain</text>

  <!-- Sound-wave arrow at outer -->
  <g stroke="#1d4ed8" stroke-width="1.5" fill="none">
    <path d="M10,170 Q20,160 30,170 Q40,180 50,170"/>
    <path d="M10,178 Q20,168 30,178 Q40,188 50,178"/>
  </g>
  <text x="30" y="155" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#1d4ed8">Sound</text>
</svg>
