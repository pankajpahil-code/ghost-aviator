<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;">
  <text x="360" y="22" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700" text-anchor="middle" fill="#0b2545">The Three Major Minerals — DGCA-Quoted Roles</text>

  <!-- Calcium -->
  <g transform="translate(50,55)">
    <rect x="0" y="0" width="180" height="120" rx="8" fill="#e9f7ee" stroke="#15803d" stroke-width="2.5"/>
    <text x="90" y="40" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="900" text-anchor="middle" fill="#15803d">Ca</text>
    <text x="90" y="62" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#14532d">CALCIUM</text>
    <text x="90" y="85" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#14532d">Healthy bones</text>
    <text x="90" y="100" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#14532d">&amp; teeth</text>
  </g>

  <!-- Phosphorous -->
  <g transform="translate(270,55)">
    <rect x="0" y="0" width="180" height="120" rx="8" fill="#fff4e0" stroke="#b45309" stroke-width="2.5"/>
    <text x="90" y="40" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="900" text-anchor="middle" fill="#b45309">P</text>
    <text x="90" y="62" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#7a3a07">PHOSPHOROUS</text>
    <text x="90" y="85" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#5c2d04">Body's chemical</text>
    <text x="90" y="100" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#5c2d04">reactions</text>
  </g>

  <!-- Iron -->
  <g transform="translate(490,55)">
    <rect x="0" y="0" width="180" height="120" rx="8" fill="#fcecec" stroke="#b91c1c" stroke-width="2.5"/>
    <text x="90" y="40" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="900" text-anchor="middle" fill="#b91c1c">Fe</text>
    <text x="90" y="62" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#7a0d0d">IRON</text>
    <text x="90" y="85" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#5a1010">For</text>
    <text x="90" y="100" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#5a1010">HAEMOGLOBIN</text>
  </g>
</svg>
