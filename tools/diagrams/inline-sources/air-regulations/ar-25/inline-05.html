<svg viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b2545"/>
      <stop offset="100%" stop-color="#a8d0f5"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="700" height="260" fill="url(#sky)"/>
  <rect x="0" y="260" width="700" height="20" fill="#3a5e26"/>

  <!-- Bands with labels -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="700" font-size="12">
    <!-- > 40000 -->
    <rect x="0" y="0" width="700" height="48" fill="rgba(185,28,28,0.7)"/>
    <text x="350" y="18" fill="#fff" text-anchor="middle">Above 40,000 ft</text>
    <text x="350" y="34" fill="#fff" text-anchor="middle" font-weight="500">100 % Oxygen UNDER PRESSURE (pressure-breathing)</text>

    <!-- 33700 - 40000 -->
    <rect x="0" y="48" width="700" height="48" fill="rgba(180,83,9,0.75)"/>
    <text x="350" y="68" fill="#fff" text-anchor="middle">33,700 – 40,000 ft</text>
    <text x="350" y="84" fill="#fff" text-anchor="middle" font-weight="500">100 % Oxygen</text>

    <!-- 10000 - 33000 -->
    <rect x="0" y="96" width="700" height="80" fill="rgba(212,160,23,0.6)"/>
    <text x="350" y="125" fill="#0b2545" text-anchor="middle">10,000 – 33,000 ft</text>
    <text x="350" y="142" fill="#0b2545" text-anchor="middle" font-weight="500">Oxygen + Air Mixture (supplementary O₂)</text>

    <!-- 0 - 10000 -->
    <rect x="0" y="176" width="700" height="84" fill="rgba(21,128,61,0.55)"/>
    <text x="350" y="208" fill="#fff" text-anchor="middle">Up to 10,000 ft</text>
    <text x="350" y="226" fill="#fff" text-anchor="middle" font-weight="500">Air Only — no supplementary O₂ required</text>
  </g>
  <text x="20" y="276" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#fff">Earth's Surface</text>
</svg>
