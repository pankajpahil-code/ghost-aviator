<svg viewBox="0 0 760 280" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;">
  <text x="380" y="22" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700" text-anchor="middle" fill="#0b2545">Dark Adaptation Curve — Cones First (7 min), Then Rods (30 min)</text>

  <!-- Axes -->
  <line x1="60" y1="220" x2="720" y2="220" stroke="#0b2545" stroke-width="2"/>
  <line x1="60" y1="220" x2="60" y2="40" stroke="#0b2545" stroke-width="2"/>

  <text x="40" y="135" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle" fill="#0b2545" transform="rotate(-90,40,135)">Light Sensitivity</text>
  <text x="390" y="250" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle" fill="#0b2545">Time in darkness (minutes)</text>

  <!-- X-axis ticks -->
  <line x1="60" y1="220" x2="60" y2="225" stroke="#0b2545" stroke-width="1"/><text x="60" y="240" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#0b2545">0</text>
  <line x1="200" y1="220" x2="200" y2="225" stroke="#0b2545" stroke-width="1"/><text x="200" y="240" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#0b2545">5</text>
  <line x1="280" y1="220" x2="280" y2="225" stroke="#b91c1c" stroke-width="2"/><text x="280" y="240" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle" fill="#b91c1c" font-weight="700">7</text>
  <line x1="420" y1="220" x2="420" y2="225" stroke="#0b2545" stroke-width="1"/><text x="420" y="240" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#0b2545">15</text>
  <line x1="540" y1="220" x2="540" y2="225" stroke="#0b2545" stroke-width="1"/><text x="540" y="240" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#0b2545">22</text>
  <line x1="660" y1="220" x2="660" y2="225" stroke="#15803d" stroke-width="2"/><text x="660" y="240" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle" fill="#15803d" font-weight="700">30</text>

  <!-- Cone curve (first 7 min) -->
  <path d="M60,200 Q140,180 200,150 Q240,140 280,135" fill="none" stroke="#b91c1c" stroke-width="3"/>
  <!-- Knee point at 7 min -->
  <circle cx="280" cy="135" r="5" fill="#b91c1c"/>
  <text x="280" y="125" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#b91c1c" font-weight="700">CONE BREAK</text>

  <!-- Rod curve (continues to 30 min) -->
  <path d="M280,135 Q380,110 480,80 Q580,65 660,60" fill="none" stroke="#1d4ed8" stroke-width="3"/>
  <circle cx="660" cy="60" r="5" fill="#15803d"/>
  <text x="660" y="50" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#15803d" font-weight="700">FULL ADAPT</text>

  <!-- Zone labels -->
  <text x="170" y="190" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#b91c1c">CONE phase</text>
  <text x="170" y="203" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" fill="#7a0d0d">colour, detail, day-light</text>

  <text x="450" y="120" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#1d4ed8">ROD phase</text>
  <text x="450" y="133" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" fill="#0b2545">night vision, B&amp;W</text>

  <!-- Highlight 10s bright adaptation -->
  <rect x="80" y="55" width="100" height="40" rx="4" fill="#fff4cc" stroke="#d4a017" stroke-width="1.5"/>
  <text x="130" y="73" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#6b4f00" font-weight="700">REVERSE direction:</text>
  <text x="130" y="86" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#6b4f00">dark → bright = 10 s</text>
</svg>
