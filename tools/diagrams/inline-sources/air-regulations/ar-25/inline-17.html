<svg viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;">
  <text x="360" y="22" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700" text-anchor="middle" fill="#0b2545">Performance vs Cockpit Temperature</text>

  <!-- Axes -->
  <line x1="60" y1="200" x2="700" y2="200" stroke="#0b2545" stroke-width="2"/>
  <line x1="60" y1="200" x2="60" y2="60" stroke="#0b2545" stroke-width="2"/>
  <text x="40" y="120" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#0b2545" transform="rotate(-90,40,120)">Performance</text>
  <text x="380" y="246" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle" fill="#0b2545">Temperature (°C)</text>

  <!-- Inverted-U curve -->
  <path d="M80,180 Q200,170 280,100 Q380,60 480,100 Q580,170 680,190" fill="none" stroke="#13315c" stroke-width="3"/>

  <!-- Markers -->
  <line x1="160" y1="200" x2="160" y2="195" stroke="#0b2545" stroke-width="2"/>
  <text x="160" y="215" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#0b2545">5°C</text>
  <line x1="280" y1="200" x2="280" y2="195" stroke="#0b2545" stroke-width="2"/>
  <text x="280" y="215" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#0b2545">15°C</text>
  <line x1="380" y1="200" x2="380" y2="195" stroke="#15803d" stroke-width="2.5"/>
  <text x="380" y="215" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle" fill="#15803d" font-weight="700">20°C ★</text>
  <line x1="480" y1="200" x2="480" y2="195" stroke="#0b2545" stroke-width="2"/>
  <text x="480" y="215" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#0b2545">25°C</text>
  <line x1="580" y1="200" x2="580" y2="195" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="580" y="215" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle" fill="#b91c1c" font-weight="700">30°C ↑</text>

  <!-- Peak marker -->
  <circle cx="380" cy="60" r="6" fill="#15803d"/>
  <text x="380" y="50" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle" fill="#15803d" font-weight="700">OPTIMAL</text>

  <!-- Cold zone -->
  <rect x="60" y="60" width="220" height="140" fill="#1d4ed8" opacity="0.06"/>
  <text x="160" y="80" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle" fill="#1d4ed8" font-weight="700">COLD</text>
  <text x="160" y="93" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" text-anchor="middle" fill="#0b2545">↓ feeling in hands</text>
  <text x="160" y="105" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" text-anchor="middle" fill="#0b2545">poor fine motor</text>

  <!-- Hot zone -->
  <rect x="480" y="60" width="220" height="140" fill="#b91c1c" opacity="0.06"/>
  <text x="590" y="80" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle" fill="#b91c1c" font-weight="700">HOT</text>
  <text x="590" y="93" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" text-anchor="middle" fill="#7a0d0d">↑ HR · ↑ BP</text>
  <text x="590" y="105" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" text-anchor="middle" fill="#7a0d0d">↑ sweating</text>
</svg>
