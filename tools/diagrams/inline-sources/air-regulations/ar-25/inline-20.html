<svg viewBox="0 0 760 280" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;">
  <text x="380" y="22" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700" text-anchor="middle" fill="#0b2545">Where Are Rods &amp; Cones on the Retina?</text>

  <!-- Retina cross-section -->
  <path d="M150,140 Q300,40 600,140 Q300,240 150,140 Z" fill="#fef6e4" stroke="#b45309" stroke-width="2"/>

  <!-- Fovea (centre) -->
  <circle cx="375" cy="140" r="22" fill="#b91c1c"/>
  <text x="375" y="144" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#fff" font-weight="700">FOVEA</text>
  <text x="375" y="155" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="7" text-anchor="middle" fill="#fff">all cones</text>

  <!-- Cones zone (central) -->
  <circle cx="375" cy="140" r="60" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Cone dots -->
  <g fill="#b91c1c">
    <circle cx="350" cy="120" r="2"/>
    <circle cx="400" cy="120" r="2"/>
    <circle cx="340" cy="160" r="2"/>
    <circle cx="410" cy="160" r="2"/>
    <circle cx="360" cy="105" r="2"/>
    <circle cx="390" cy="175" r="2"/>
    <circle cx="320" cy="140" r="2"/>
    <circle cx="430" cy="140" r="2"/>
  </g>

  <!-- Rod dots (peripheral) -->
  <g fill="#1d4ed8">
    <circle cx="200" cy="120" r="2"/>
    <circle cx="220" cy="160" r="2"/>
    <circle cx="190" cy="140" r="2"/>
    <circle cx="240" cy="100" r="2"/>
    <circle cx="260" cy="180" r="2"/>
    <circle cx="280" cy="115" r="2"/>
    <circle cx="270" cy="165" r="2"/>
    <circle cx="465" cy="120" r="2"/>
    <circle cx="490" cy="160" r="2"/>
    <circle cx="510" cy="140" r="2"/>
    <circle cx="475" cy="180" r="2"/>
    <circle cx="525" cy="115" r="2"/>
    <circle cx="540" cy="155" r="2"/>
    <circle cx="555" cy="135" r="2"/>
  </g>

  <!-- Optic disc (blind spot) -->
  <ellipse cx="455" cy="140" rx="10" ry="14" fill="#fff" stroke="#0b2545" stroke-width="1.5"/>
  <text x="455" y="143" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="7" text-anchor="middle" fill="#0b2545" font-weight="700">BS</text>

  <!-- Labels -->
  <text x="200" y="220" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#1d4ed8" font-weight="700">PERIPHERY = RODS</text>
  <text x="200" y="234" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#0b2545">night vision, B&amp;W, movement</text>

  <text x="375" y="220" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="middle">CENTRE = CONES</text>
  <text x="375" y="234" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#7a0d0d" text-anchor="middle">day vision, colour, detail</text>

  <text x="455" y="105" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#0b2545" font-weight="700" text-anchor="middle">Blind Spot</text>
  <text x="455" y="116" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" fill="#0b2545" text-anchor="middle">(optic nerve exits)</text>

  <text x="600" y="220" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#7a3a07" font-style="italic">Look slightly to the side</text>
  <text x="600" y="232" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#7a3a07" font-style="italic">at night → rod vision</text>
</svg>
