<svg viewBox="0 0 760 280" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;">
  <text x="380" y="22" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700" text-anchor="middle" fill="#0b2545">Vibration Frequency → Body Region Affected</text>

  <!-- Body silhouette -->
  <g transform="translate(60,50)">
    <!-- Head -->
    <circle cx="60" cy="20" r="18" fill="#fde2e2" stroke="#b91c1c" stroke-width="2"/>
    <text x="60" y="24" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" text-anchor="middle" font-weight="700" fill="#7a0d0d">HEAD</text>
    <!-- Neck -->
    <rect x="55" y="38" width="10" height="12" fill="#fde2e2" stroke="#b91c1c"/>
    <!-- Torso -->
    <rect x="35" y="50" width="50" height="80" rx="4" fill="#fde2e2" stroke="#b91c1c" stroke-width="2"/>
    <text x="60" y="92" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" text-anchor="middle" font-weight="700" fill="#7a0d0d">TORSO</text>
    <!-- Lower back -->
    <rect x="38" y="130" width="44" height="18" fill="#fff4e0" stroke="#b45309"/>
    <text x="60" y="142" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" text-anchor="middle" font-weight="700" fill="#7a3a07">BACK</text>
    <!-- Legs -->
    <rect x="40" y="148" width="14" height="60" fill="#fde2e2" stroke="#b91c1c"/>
    <rect x="66" y="148" width="14" height="60" fill="#fde2e2" stroke="#b91c1c"/>
    <!-- Eyes detail -->
    <circle cx="54" cy="16" r="2.5" fill="#1d4ed8"/>
    <circle cx="66" cy="16" r="2.5" fill="#1d4ed8"/>
  </g>

  <!-- Frequency bars -->
  <g transform="translate(180,55)">
    <!-- 1-4 Hz: Head -->
    <rect x="0" y="0" width="30" height="22" fill="#fde2e2" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="15" y="14" font-family="'Cascadia Code', 'Consolas', 'Courier New', monospace" font-size="9" text-anchor="middle" font-weight="700" fill="#7a0d0d">1–4 Hz</text>
    <text x="40" y="14" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#5a1010"><tspan font-weight="700">Skull resonance</tspan> · Interference with breathing · Neck pain</text>

    <!-- 4-10 Hz: chest -->
    <rect x="0" y="35" width="80" height="22" fill="#fff4e0" stroke="#b45309" stroke-width="1.5"/>
    <text x="40" y="49" font-family="'Cascadia Code', 'Consolas', 'Courier New', monospace" font-size="9" text-anchor="middle" font-weight="700" fill="#7a3a07">4–10 Hz</text>
    <text x="90" y="49" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#5c2d04">Chest and abdominal pain</text>

    <!-- 8-12 Hz: backache -->
    <rect x="50" y="70" width="50" height="22" fill="#e8f0fb" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="75" y="84" font-family="'Cascadia Code', 'Consolas', 'Courier New', monospace" font-size="9" text-anchor="middle" font-weight="700" fill="#0b2545">8–12 Hz</text>
    <text x="110" y="84" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#0b2545">Backache</text>

    <!-- 10-12 Hz: head symptoms -->
    <rect x="80" y="105" width="40" height="22" fill="#f3e8ff" stroke="#6b21a8" stroke-width="1.5"/>
    <text x="100" y="119" font-family="'Cascadia Code', 'Consolas', 'Courier New', monospace" font-size="9" text-anchor="middle" font-weight="700" fill="#5b1989">10–12 Hz</text>
    <text x="130" y="119" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#5b1989">Headache · eyestrain · throat pain · speech difficulty · muscle tension</text>

    <!-- 30-40 Hz: vision -->
    <rect x="200" y="140" width="50" height="22" fill="#fcecec" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="225" y="154" font-family="'Cascadia Code', 'Consolas', 'Courier New', monospace" font-size="9" text-anchor="middle" font-weight="700" fill="#7a0d0d">30–40 Hz</text>
    <text x="260" y="154" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#7a0d0d"><tspan font-weight="700">Eyeball resonance</tspan> · Interference with vision</text>
  </g>

  <!-- Bottom note -->
  <rect x="60" y="240" width="640" height="30" rx="4" fill="#fff4cc" stroke="#d4a017" stroke-width="1.5"/>
  <text x="380" y="259" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle" fill="#6b4f00" font-style="italic">Match frequency = match the body part. Skull at 1–4 Hz · Eyeball at 30–40 Hz — both classic DGCA single-fact questions.</text>
</svg>
