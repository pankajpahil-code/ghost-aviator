  <defs>

      <stop offset="0%" stop-color="#86c79e"/>
      <stop offset="100%" stop-color="#fff"/>
    </linearGradient>
  </defs>
  <text x="140" y="50" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#14532d">NON-SMOKER</text>
  <line x1="80" y1="125" x2="200" y2="125" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="6,3"/>

  <text x="140" y="195" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#14532d">Safe up to</text>

  <text x="140" y="235" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#14532d">unpressurised</text>

  <rect x="380" y="60" width="120" height="220" rx="6" fill="#fcecec" stroke="#b91c1c" stroke-width="2"/>
  <rect x="380" y="60" width="120" height="220" rx="6" fill="url(#g2)" opacity="0.4"/>
  <defs>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5a3a3"/>
      <stop offset="100%" stop-color="#fff"/>
    </linearGradient>
  </defs>
  <text x="440" y="50" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#7a0d0d">SMOKER (1 pack/day)</text>

  <text x="316" y="158" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#b91c1c">−3,000 ft</text>

  <rect x="615" y="185" width="97" height="14" fill="#b91c1c"/>

  <!-- Lost capacity callout -->
  <text x="668" y="225" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#b91c1c">Lost: 5 – 8 %</text>
  <text x="668" y="240" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" text-anchor="middle" fill="#7a0d0d">of total O₂ capacity</text>
