<svg viewBox="0 0 780 360" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;">
  <text x="390" y="22" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700" text-anchor="middle" fill="#0b2545">Anatomy of the Human Eye</text>

  <!-- Eyeball -->
  <defs>
    <radialGradient id="eyeball" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="100%" stop-color="#fde2e2"/>
    </radialGradient>
  </defs>

  <!-- Sclera (eyeball body) -->
  <circle cx="350" cy="180" r="120" fill="url(#eyeball)" stroke="#b91c1c" stroke-width="2.5"/>

  <!-- Cornea bulge (front) -->
  <path d="M225,160 Q205,180 225,200 Q235,210 245,210 L245,150 Q235,150 225,160 Z" fill="#e8f0fb" stroke="#1d4ed8" stroke-width="2"/>

  <!-- Iris (colored ring) -->
  <ellipse cx="248" cy="180" rx="6" ry="30" fill="#0b2545" stroke="#13315c"/>

  <!-- Pupil (black center) -->
  <ellipse cx="246" cy="180" rx="3" ry="12" fill="#000"/>

  <!-- Lens (just behind iris) -->
  <ellipse cx="265" cy="180" rx="14" ry="26" fill="#fff4cc" stroke="#d4a017" stroke-width="2" opacity="0.8"/>

  <!-- Retina (back inner lining) -->
  <path d="M380,80 Q450,130 470,180 Q450,230 380,280" fill="none" stroke="#b91c1c" stroke-width="4"/>

  <!-- Fovea (small region at the back) -->
  <circle cx="468" cy="180" r="8" fill="#b91c1c"/>
  <circle cx="468" cy="180" r="4" fill="#7a0d0d"/>

  <!-- Optic nerve -->
  <path d="M468,210 Q500,235 540,260" fill="none" stroke="#fff4cc" stroke-width="8" stroke-linecap="round"/>
  <path d="M468,210 Q500,235 540,260" fill="none" stroke="#d4a017" stroke-width="2"/>

  <!-- Labels with leader lines -->
  <line x1="220" y1="160" x2="180" y2="100" stroke="#1d4ed8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="50" y="95" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#1d4ed8" font-weight="700">CORNEA</text>
  <text x="50" y="108" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#0b2545">clear front window</text>
  <text x="50" y="120" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#0b2545">70–80% focusing</text>

  <line x1="248" y1="152" x2="260" y2="80" stroke="#0b2545" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="240" y="65" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#0b2545" font-weight="700">IRIS &amp; PUPIL</text>
  <text x="240" y="78" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#0b2545">controls light entry</text>

  <line x1="265" y1="156" x2="350" y2="80" stroke="#b45309" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="350" y="65" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#b45309" font-weight="700">LENS</text>
  <text x="350" y="78" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#5c2d04">muscles change shape</text>

  <line x1="430" y1="120" x2="540" y2="90" stroke="#b91c1c" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="550" y="85" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#b91c1c" font-weight="700">RETINA</text>
  <text x="550" y="98" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#7a0d0d">light-sensitive screen</text>
  <text x="550" y="110" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#7a0d0d">100M rods + 6M cones</text>

  <line x1="470" y1="180" x2="620" y2="170" stroke="#b91c1c" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="630" y="165" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#b91c1c" font-weight="700">FOVEA</text>
  <text x="630" y="178" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#7a0d0d">central pit, all cones</text>
  <text x="630" y="190" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#7a0d0d">best day vision</text>
  <text x="630" y="202" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#7a0d0d">NO night vision</text>

  <line x1="540" y1="260" x2="640" y2="270" stroke="#b45309" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="650" y="265" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#b45309" font-weight="700">OPTIC NERVE</text>
  <text x="650" y="278" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#5c2d04">→ to brain</text>
  <text x="650" y="290" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#5c2d04">creates BLIND SPOT</text>

  <!-- Sclera label -->
  <line x1="380" y1="295" x2="290" y2="330" stroke="#7a0d0d" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="190" y="335" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#7a0d0d" font-weight="700">SCLERA (white outer coat)</text>
</svg>
