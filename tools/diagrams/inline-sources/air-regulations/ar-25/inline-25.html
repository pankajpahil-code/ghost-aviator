<svg viewBox="0 0 760 280" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;">
  <text x="380" y="22" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700" text-anchor="middle" fill="#0b2545">The Three Orientation Factors — Ranked by Reliability</text>

  <!-- Factor 1: Vision -->
  <g transform="translate(50,55)">
    <rect x="0" y="0" width="200" height="170" rx="10" fill="#e9f7ee" stroke="#15803d" stroke-width="2.5"/>
    <text x="100" y="25" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#15803d">1. PRIMARY · MOST RELIABLE</text>
    <text x="100" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="900" text-anchor="middle" fill="#0b2545">VISION</text>
    <!-- Eye icon -->
    <ellipse cx="100" cy="100" rx="35" ry="22" fill="#fff" stroke="#15803d" stroke-width="2"/>
    <circle cx="100" cy="100" r="14" fill="#1d4ed8"/>
    <circle cx="100" cy="100" r="6" fill="#000"/>
    <text x="100" y="148" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#14532d">Eyes + Instruments</text>
    <text x="100" y="160" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#14532d">→ TRUST in IFR</text>
  </g>

  <!-- Factor 2: Vestibular -->
  <g transform="translate(270,55)">
    <rect x="0" y="0" width="200" height="170" rx="10" fill="#fff4e0" stroke="#b45309" stroke-width="2.5"/>
    <text x="100" y="25" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#b45309">2. SECONDARY · PARTIAL</text>
    <text x="100" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="900" text-anchor="middle" fill="#0b2545">VESTIBULAR</text>
    <text x="100" y="78" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#5c2d04">(otoliths + canals)</text>
    <!-- Ear icon -->
    <g transform="translate(85,90) scale(0.7)">
      <path d="M0,30 Q-20,0 10,-10 Q40,-15 45,15 Q50,40 30,55 Q10,60 0,40 Z" fill="#fff" stroke="#b45309" stroke-width="2"/>
    </g>
    <text x="100" y="148" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#5c2d04">Linear &amp; angular accel.</text>
    <text x="100" y="160" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#7a0d0d">→ LIES in steady turns</text>
  </g>

  <!-- Factor 3: Somatosensory -->
  <g transform="translate(490,55)">
    <rect x="0" y="0" width="200" height="170" rx="10" fill="#fcecec" stroke="#b91c1c" stroke-width="2.5"/>
    <text x="100" y="25" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#b91c1c">3. TERTIARY · NOT RELIABLE</text>
    <text x="100" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="900" text-anchor="middle" fill="#0b2545">SOMATOSENSORY</text>
    <text x="100" y="78" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" font-style="italic" text-anchor="middle" fill="#7a0d0d">"seat of the pants"</text>
    <!-- Body icon -->
    <g transform="translate(85,90)">
      <circle cx="15" cy="10" r="8" fill="#fff" stroke="#b91c1c" stroke-width="1.5"/>
      <rect x="8" y="18" width="14" height="22" fill="#fff" stroke="#b91c1c" stroke-width="1.5"/>
      <line x1="8" y1="22" x2="0" y2="32" stroke="#b91c1c" stroke-width="1.5"/>
      <line x1="22" y1="22" x2="30" y2="32" stroke="#b91c1c" stroke-width="1.5"/>
      <line x1="12" y1="40" x2="10" y2="55" stroke="#b91c1c" stroke-width="1.5"/>
      <line x1="18" y1="40" x2="20" y2="55" stroke="#b91c1c" stroke-width="1.5"/>
    </g>
    <text x="100" y="160" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#7a0d0d">→ G-force / pressure</text>
  </g>

  <!-- Bottom bar: rank arrow -->
  <rect x="50" y="240" width="640" height="30" rx="6" fill="#fff4cc" stroke="#d4a017" stroke-width="1.5"/>
  <text x="370" y="259" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle" fill="#6b4f00" font-style="italic">"Vision is primary; the vestibular apparatus is partial; the somatosensory system is not reliable at all."</text>
</svg>
