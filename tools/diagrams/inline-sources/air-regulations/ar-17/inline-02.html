<svg class="diagram" viewBox="0 0 620 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Microburst diagram">
      <defs>
        <marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" fill="#2f6db0"/>
        </marker>
      </defs>
      <rect x="0" y="220" width="620" height="40" fill="#eae6da"/>
      <text x="310" y="245" text-anchor="middle" font-family="Archivo,sans-serif" font-size="11" font-weight="700" fill="#6b6b63">RUNWAY / GROUND</text>
      <!-- downdraft -->
      <line x1="310" y1="30" x2="310" y2="200" stroke="#d9534f" stroke-width="6" marker-end="url(#ar)"/>
      <text x="320" y="110" font-family="Archivo,sans-serif" font-size="13" font-weight="800" fill="#d9534f">DOWNDRAFT</text>
      <!-- outflow -->
      <line x1="300" y1="205" x2="120" y2="205" stroke="#2f6db0" stroke-width="4" marker-end="url(#ar)"/>
      <line x1="320" y1="205" x2="500" y2="205" stroke="#2f6db0" stroke-width="4" marker-end="url(#ar)"/>
      <text x="150" y="195" font-family="Archivo,sans-serif" font-size="12" font-weight="800" fill="#2f6db0">HEADWIND</text>
      <text x="150" y="180" font-family="Archivo,sans-serif" font-size="10" fill="#1f5232">performance &#8593;</text>
      <text x="408" y="195" font-family="Archivo,sans-serif" font-size="12" font-weight="800" fill="#2f6db0">TAILWIND</text>
      <text x="408" y="180" font-family="Archivo,sans-serif" font-size="10" fill="#7d211d">performance &#8595;</text>
      <!-- aircraft path -->
      <path d="M70,170 Q260,120 310,160 Q380,205 560,150" fill="none" stroke="#10243e" stroke-width="2" stroke-dasharray="6 5"/>
      <text x="70" y="155" font-family="Archivo,sans-serif" font-size="11" font-weight="700" fill="#10243e">(1) climb</text>
      <text x="500" y="135" font-family="Archivo,sans-serif" font-size="11" font-weight="700" fill="#7d211d">(3) sink / crash path</text>
    </svg>
