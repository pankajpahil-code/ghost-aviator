<svg class="diagram" viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aircraft mark placement diagram">
      <!-- background -->
      <rect width="720" height="340" fill="#fbfaf7"/>

      <!-- fuselage side view -->
      <path d="M100,200 Q140,175 200,170 L520,170 Q580,170 620,190 L640,200 L620,215 Q580,235 520,235 L200,235 Q140,230 100,205 Z"
            fill="#e8f0fb" stroke="#10243e" stroke-width="2"/>
      <!-- cockpit window -->
      <path d="M580,180 L620,190 L620,205 L580,210 Z" fill="#c8dbf2" stroke="#10243e" stroke-width="1"/>
      <!-- wing (side view stub) -->
      <path d="M300,210 L470,215 L470,225 L300,225 Z" fill="#d3dfef" stroke="#10243e" stroke-width="1.5"/>
      <!-- vertical tail -->
      <path d="M120,200 L140,120 L200,135 L200,175 Z" fill="#d3dfef" stroke="#10243e" stroke-width="1.5"/>
      <!-- horizontal stab -->
      <path d="M100,205 L60,215 L60,225 L110,225 Z" fill="#c8dbf2" stroke="#10243e" stroke-width="1"/>

      <!-- registration marks -->
      <!-- on fuselage -->
      <text x="330" y="202" font-family="Archivo,sans-serif" font-weight="800" font-size="20" fill="#10243e">VT-EPC</text>
      <!-- on tail -->
      <text x="158" y="165" font-family="Archivo,sans-serif" font-weight="800" font-size="12" fill="#10243e" transform="rotate(-8 158 165)">VT-EPC</text>

      <!-- fuselage height measurement -->
      <line x1="670" y1="170" x2="670" y2="235" stroke="#c8961e" stroke-width="2"/>
      <line x1="662" y1="170" x2="678" y2="170" stroke="#c8961e" stroke-width="2"/>
      <line x1="662" y1="235" x2="678" y2="235" stroke="#c8961e" stroke-width="2"/>
      <text x="685" y="210" font-family="JetBrains Mono,monospace" font-weight="700" font-size="12" fill="#7a5708">&#8805;30 cm</text>
      <text x="685" y="225" font-family="Archivo,sans-serif" font-size="10" fill="#7a5708">on fuselage &amp; tail</text>

      <!-- wing (plan view stub below) -->
      <g transform="translate(120,260)">
        <path d="M0,10 L440,10 L440,50 L0,50 Z" fill="#d3dfef" stroke="#10243e" stroke-width="1.5"/>
        <text x="140" y="38" font-family="Archivo,sans-serif" font-weight="800" font-size="22" fill="#10243e">VT-EPC</text>
        <line x1="470" y1="10" x2="470" y2="50" stroke="#c8961e" stroke-width="2"/>
        <line x1="462" y1="10" x2="478" y2="10" stroke="#c8961e" stroke-width="2"/>
        <line x1="462" y1="50" x2="478" y2="50" stroke="#c8961e" stroke-width="2"/>
        <text x="486" y="35" font-family="JetBrains Mono,monospace" font-weight="700" font-size="12" fill="#7a5708">&#8805;50 cm</text>
        <text x="486" y="49" font-family="Archivo,sans-serif" font-size="10" fill="#7a5708">on wings</text>
        <text x="0" y="-2" font-family="Archivo,sans-serif" font-weight="700" font-size="10" fill="#6b6b63">(underside of wing shown)</text>
      </g>

      <text x="60" y="30" font-family="Archivo,sans-serif" font-weight="800" font-size="13" fill="#2f6db0" letter-spacing="1">HEAVIER-THAN-AIR</text>
      <text x="60" y="46" font-family="Lora,serif" font-style="italic" font-size="11" fill="#6b6b63">All characters in one group must be equal height.</text>
    </svg>
