<svg viewBox="0 0 740 540" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="'Source Sans 3', sans-serif">
    <rect width="740" height="540" fill="#f7f9fc" rx="8"/>
    <text x="370" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#0d1b2a">ATS Surveillance Service — Identification Method Selection</text>

    <!-- START -->
    <ellipse cx="370" cy="60" rx="100" ry="26" fill="#0d1b2a"/>
    <text x="370" y="65" text-anchor="middle" font-size="12" font-weight="700" fill="white">ATS Service Required</text>

    <!-- Arrow down -->
    <line x1="370" y1="86" x2="370" y2="116" stroke="#0d1b2a" stroke-width="2" marker-end="url(#arr)"/>

    <!-- Decision: ADS-B? -->
    <polygon points="370,118 500,148 370,178 240,148" fill="#fff8e7" stroke="#c8961e" stroke-width="2"/>
    <text x="370" y="145" text-anchor="middle" font-size="12" font-weight="700" fill="#7a5800">ADS-B Available?</text>
    <text x="370" y="161" text-anchor="middle" font-size="11" fill="#7a5800">Is ADS-B equipped?</text>

    <!-- YES branch ADS-B -->
    <line x1="500" y1="148" x2="620" y2="148" stroke="#38a169" stroke-width="1.5" marker-end="url(#arr2)"/>
    <text x="555" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="#38a169">YES</text>
    <rect x="620" y="120" width="110" height="56" rx="6" fill="#f0fff4" stroke="#1a5c2a" stroke-width="2"/>
    <text x="675" y="143" text-anchor="middle" font-size="11" font-weight="700" fill="#1a5c2a">ADS-B ID</text>
    <text x="675" y="158" text-anchor="middle" font-size="10" fill="#1a5c2a">a) ADS-B label</text>
    <text x="675" y="170" text-anchor="middle" font-size="10" fill="#1a5c2a">b) Transfer c) IDENT</text>

    <!-- NO branch -->
    <line x1="370" y1="178" x2="370" y2="208" stroke="#e53e3e" stroke-width="1.5" marker-end="url(#arr3)"/>
    <text x="380" y="198" text-anchor="middle" font-size="11" font-weight="700" fill="#e53e3e">NO</text>

    <!-- Decision: SSR/MLAT? -->
    <polygon points="370,210 500,240 370,270 240,240" fill="#e8f4fd" stroke="#1a6fa8" stroke-width="2"/>
    <text x="370" y="237" text-anchor="middle" font-size="12" font-weight="700" fill="#1a6fa8">SSR / MLAT?</text>
    <text x="370" y="253" text-anchor="middle" font-size="11" fill="#1a6fa8">Transponder equipped?</text>

    <!-- YES branch SSR -->
    <line x1="500" y1="240" x2="620" y2="240" stroke="#38a169" stroke-width="1.5" marker-end="url(#arr2)"/>
    <text x="555" y="232" text-anchor="middle" font-size="11" font-weight="700" fill="#38a169">YES</text>
    <rect x="620" y="210" width="110" height="60" rx="6" fill="#e8f4fd" stroke="#1a6fa8" stroke-width="2"/>
    <text x="675" y="228" text-anchor="middle" font-size="11" font-weight="700" fill="#1a6fa8">SSR/MLAT ID</text>
    <text x="675" y="242" text-anchor="middle" font-size="10" fill="#1a6fa8">a–f: Code, IDENT,</text>
    <text x="675" y="254" text-anchor="middle" font-size="10" fill="#1a6fa8">Mode S, Transfer...</text>
    <text x="675" y="266" text-anchor="middle" font-size="10" fill="#1a6fa8">(6 methods)</text>

    <!-- NO — PSR -->
    <line x1="370" y1="270" x2="370" y2="300" stroke="#e53e3e" stroke-width="1.5" marker-end="url(#arr3)"/>
    <text x="380" y="290" text-anchor="middle" font-size="11" font-weight="700" fill="#e53e3e">NO</text>

    <!-- PSR box -->
    <rect x="270" y="302" width="200" height="36" rx="6" fill="#f8f0ff" stroke="#4a1a6b" stroke-width="2"/>
    <text x="370" y="325" text-anchor="middle" font-size="12" font-weight="700" fill="#4a1a6b">PSR Identification Required</text>

    <!-- PSR 3 methods -->
    <line x1="370" y1="338" x2="370" y2="358" stroke="#4a1a6b" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="80" y="360" width="160" height="60" rx="6" fill="#e8f4fd" stroke="#1a6fa8" stroke-width="2"/>
    <text x="160" y="382" text-anchor="middle" font-size="11" font-weight="700" fill="#1a6fa8">① Position Report</text>
    <text x="160" y="397" text-anchor="middle" font-size="10" fill="#1a6fa8">Report over/bearing</text>
    <text x="160" y="411" text-anchor="middle" font-size="10" fill="#1a6fa8">from a known point</text>
    <line x1="270" y1="360" x2="240" y2="360" stroke="#1a6fa8" stroke-width="1.5"/>

    <rect x="285" y="360" width="170" height="60" rx="6" fill="#f0fff4" stroke="#1a5c2a" stroke-width="2"/>
    <text x="370" y="382" text-anchor="middle" font-size="11" font-weight="700" fill="#1a5c2a">② Departing A/C</text>
    <text x="370" y="397" text-anchor="middle" font-size="10" fill="#1a5c2a">Within 1 NM of</text>
    <text x="370" y="411" text-anchor="middle" font-size="10" fill="#1a5c2a">runway end</text>

    <rect x="470" y="360" width="190" height="60" rx="6" fill="#fff8e7" stroke="#c8961e" stroke-width="2"/>
    <text x="565" y="382" text-anchor="middle" font-size="11" font-weight="700" fill="#7a5800">③ Turn Method</text>
    <text x="565" y="397" text-anchor="middle" font-size="10" fill="#7a5800">30° or more heading</text>
    <text x="565" y="411" text-anchor="middle" font-size="10" fill="#7a5800">change instruction</text>
    <line x1="455" y1="360" x2="470" y2="360" stroke="#c8961e" stroke-width="1.5"/>

    <!-- Pilot informed box -->
    <line x1="370" y1="422" x2="370" y2="456" stroke="#0d1b2a" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="220" y="458" width="300" height="36" rx="6" fill="#0d1b2a"/>
    <text x="370" y="481" text-anchor="middle" font-size="12" font-weight="700" fill="#c8961e">PILOT INFORMED → Service Provided</text>

    <!-- Arrow markers -->
    <defs>
      <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L0,6 L8,3 z" fill="#0d1b2a"/>
      </marker>
      <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L0,6 L8,3 z" fill="#38a169"/>
      </marker>
      <marker id="arr3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L0,6 L8,3 z" fill="#e53e3e"/>
      </marker>
    </defs>
  </svg>
