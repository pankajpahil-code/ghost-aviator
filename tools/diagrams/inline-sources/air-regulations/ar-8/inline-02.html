<svg viewBox="0 0 700 280" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="'Source Sans 3', sans-serif">

    <polygon points="350,70 335,100 365,100" fill="#0d1b2a"/>

    <text x="110" y="192" text-anchor="middle" font-size="10" fill="#1a6fa8">Receives at T₁</text>
    <!-- Ground station 2 -->
    <rect x="290" y="200" width="120" height="40" rx="6" fill="#f0fff4" stroke="#1a5c2a" stroke-width="2"/>

    <text x="350" y="232" text-anchor="middle" font-size="10" fill="#1a5c2a">Receives at T₂</text>

    <rect x="540" y="160" width="100" height="40" rx="6" fill="#fff8e7" stroke="#c8961e" stroke-width="2"/>

    <text x="590" y="192" text-anchor="middle" font-size="10" fill="#7a5800">Receives at T₃</text>

    <line x1="360" y1="98" x2="542" y2="162" stroke="#c8961e" stroke-width="1.5" stroke-dasharray="4,3"/>

    <rect x="265" y="250" width="170" height="24" rx="5" fill="#0d1b2a"/>

    <line x1="110" y1="200" x2="265" y2="258" stroke="#0d1b2a" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="350" y1="240" x2="350" y2="250" stroke="#0d1b2a" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="590" y1="200" x2="435" y2="258" stroke="#0d1b2a" stroke-width="1" stroke-dasharray="3,2"/>
  </svg>
