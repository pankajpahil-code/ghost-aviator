<svg viewBox="0 0 720 160" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="'Source Sans 3', sans-serif">

    <polygon points="60,72 48,90 72,90" fill="#0d1b2a"/>

    <line x1="560" y1="65" x2="560" y2="95" stroke="#38a169" stroke-width="2"/>
    <text x="560" y="58" text-anchor="middle" font-size="10" font-weight="700" fill="#38a169">5.0 NM</text>
    <text x="560" y="110" text-anchor="middle" font-size="10" fill="#1a5c2a">9.3 km</text>
    <text x="560" y="124" text-anchor="middle" font-size="9" fill="#1a5c2a">(Standard Min.)</text>
    <!-- Bracket from 60 to 230 -->
    <path d="M60,140 L230,140" stroke="#e53e3e" stroke-width="2" fill="none" marker-start="url(#a)" marker-end="url(#b)"/>
    <text x="145" y="155" text-anchor="middle" font-size="9" fill="#e53e3e">Minimum gap possible</text>
    <!-- Bracket 60 to 560 -->
    <path d="M60,75 Q60,30 560,30" stroke="#38a169" stroke-width="1.5" fill="none" stroke-dasharray="4,2"/>
