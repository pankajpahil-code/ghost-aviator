<svg viewBox="0 0 580 280" xmlns="http://www.w3.org/2000/svg" style="max-width:580px;">
  <rect width="580" height="280" fill="#f4f7fb" rx="10"/>
  <text x="290" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d1b2a">Track Classification Diagram</text>

  <!-- SAME TRACK diagram (left) -->
  <g transform="translate(30,40)">
    <rect width="155" height="210" rx="8" fill="#d0eaf7" stroke="#4a9eca" stroke-width="1.5"/>
    <text x="77" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b2d42">SAME TRACK</text>
    <text x="77" y="35" text-anchor="middle" font-size="9.5" fill="#4a9eca">&lt;45° or &gt;315°</text>
    <!-- Circle -->
    <circle cx="77" cy="130" r="60" fill="rgba(74,158,202,0.15)" stroke="#4a9eca" stroke-width="1.5"/>
    <!-- Main track horizontal -->
    <line x1="10" y1="130" x2="144" y2="130" stroke="#1b2d42" stroke-width="2.5" marker-end="url(#arr1)"/>
    <!-- Aircraft on track -->
    <text x="110" y="126" font-size="14" fill="#1b2d42">✈</text>
    <!-- Converging track (less than 45) -->
    <line x1="10" y1="158" x2="144" y2="135" stroke="#4a9eca" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr2)"/>
    <text x="110" y="152" font-size="14" fill="#4a9eca" transform="rotate(-8,110,148)">✈</text>
    <!-- Angle label -->
    <text x="40" y="145" font-size="9" fill="#2e9e6e" font-weight="bold">&lt;45°</text>
    <text x="77" y="208" text-anchor="middle" font-size="9.5" fill="#1b2d42" font-style="italic">Same level → 15 min</text>
  </g>

  <!-- RECIPROCAL TRACK diagram (middle) -->
  <g transform="translate(210,40)">
    <rect width="155" height="210" rx="8" fill="#fde8e8" stroke="#c94a4a" stroke-width="1.5"/>
    <text x="77" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b2d42">RECIPROCAL</text>
    <text x="77" y="35" text-anchor="middle" font-size="9.5" fill="#c94a4a">135° – 225°</text>
    <!-- Circle -->
    <circle cx="77" cy="130" r="60" fill="rgba(201,74,74,0.1)" stroke="#c94a4a" stroke-width="1.5"/>
    <!-- Aircraft going right -->
    <line x1="10" y1="120" x2="144" y2="120" stroke="#1b2d42" stroke-width="2.5" marker-end="url(#arr3)"/>
    <text x="100" y="116" font-size="14" fill="#1b2d42">✈</text>
    <!-- Aircraft going left (opposite) -->
    <line x1="144" y1="140" x2="10" y2="140" stroke="#c94a4a" stroke-width="2.5" marker-end="url(#arr4)"/>
    <text x="50" y="155" font-size="14" fill="#c94a4a" transform="rotate(180,50,147)">✈</text>
    <!-- Angle label -->
    <text x="55" y="115" font-size="9" fill="#2e9e6e" font-weight="bold">180°</text>
    <text x="77" y="208" text-anchor="middle" font-size="9.5" fill="#1b2d42" font-style="italic">10 min before/after</text>
  </g>

  <!-- CROSSING TRACK diagram (right) -->
  <g transform="translate(390,40)">
    <rect width="155" height="210" rx="8" fill="#f0faf5" stroke="#2e9e6e" stroke-width="1.5"/>
    <text x="77" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b2d42">CROSSING</text>
    <text x="77" y="35" text-anchor="middle" font-size="9.5" fill="#2e9e6e">45° – 135°, 225°–315°</text>
    <!-- Circle -->
    <circle cx="77" cy="130" r="60" fill="rgba(46,158,110,0.1)" stroke="#2e9e6e" stroke-width="1.5"/>
    <!-- Track 1 horizontal -->
    <line x1="10" y1="130" x2="144" y2="130" stroke="#1b2d42" stroke-width="2.5" marker-end="url(#arr5)"/>
    <text x="100" y="126" font-size="14" fill="#1b2d42">✈</text>
    <!-- Track 2 vertical/diagonal -->
    <line x1="77" y1="70" x2="77" y2="190" stroke="#2e9e6e" stroke-width="2.5" marker-end="url(#arr6)"/>
    <text x="73" y="88" font-size="14" fill="#2e9e6e" transform="rotate(90,73,88)">✈</text>
    <!-- Angle label -->
    <text x="96" y="103" font-size="9" fill="#2e9e6e" font-weight="bold">90°</text>
    <text x="77" y="208" text-anchor="middle" font-size="9.5" fill="#1b2d42" font-style="italic">15 min same level</text>
  </g>

  <defs>
    <marker id="arr1" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0,6 2.5,0 5" fill="#1b2d42"/></marker>
    <marker id="arr2" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0,6 2.5,0 5" fill="#4a9eca"/></marker>
    <marker id="arr3" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0,6 2.5,0 5" fill="#1b2d42"/></marker>
    <marker id="arr4" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0,6 2.5,0 5" fill="#c94a4a"/></marker>
    <marker id="arr5" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0,6 2.5,0 5" fill="#1b2d42"/></marker>
    <marker id="arr6" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0,6 2.5,0 5" fill="#2e9e6e"/></marker>
  </defs>
</svg>
