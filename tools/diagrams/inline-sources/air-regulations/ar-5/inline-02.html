<svg viewBox="0 0 520 200" xmlns="http://www.w3.org/2000/svg" style="max-width:500px;">
  <rect width="520" height="200" fill="#f4f7fb" rx="10"/>
  <!-- VOR -->
  <circle cx="80" cy="120" r="16" fill="none" stroke="#c9a84c" stroke-width="3"/>
  <circle cx="80" cy="120" r="6" fill="#c9a84c"/>
  <text x="80" y="148" text-anchor="middle" font-size="11" fill="#c9a84c" font-weight="bold">VOR</text>
  <!-- Upper radial -->
  <line x1="80" y1="120" x2="470" y2="80" stroke="#1b2d42" stroke-width="2.5" stroke-dasharray="6,3"/>
  <!-- Lower radial (15° diverging) -->
  <line x1="80" y1="120" x2="420" y2="185" stroke="#4a9eca" stroke-width="2.5" stroke-dasharray="6,3"/>
  <!-- Aircraft 1 -->
  <text x="390" y="75" font-size="22" text-anchor="middle" fill="#1b2d42">✈</text>
  <!-- Aircraft 2 -->
  <text x="370" y="185" font-size="22" text-anchor="middle" fill="#4a9eca" transform="rotate(8,370,185)">✈</text>
  <!-- 15 NM arrow -->
  <line x1="80" y1="105" x2="290" y2="80" stroke="#c9a84c" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="290" y1="80" x2="80" y2="105" stroke="#c9a84c" stroke-width="1.5" marker-start="url(#ar)"/>
  <text x="175" y="82" text-anchor="middle" font-size="10.5" fill="#c9a84c" font-weight="bold">15 NM (28 km)</text>
  <!-- Angle arc -->
  <path d="M 155,120 A 75,75 0 0,1 148,100" fill="none" stroke="#2e9e6e" stroke-width="2"/>
  <text x="170" y="110" font-size="12" fill="#2e9e6e" font-weight="bold">15°</text>
  <!-- Defs for arrowhead -->
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#c9a84c"/>
    </marker>
  </defs>
  <text x="260" y="20" text-anchor="middle" font-size="12" fill="#1b2d42" font-weight="bold">VOR Lateral Separation</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#7b5ea7" font-style="italic">Both a/c on radials diverging ≥15°; at least one a/c ≥15 NM from VOR</text>
</svg>
