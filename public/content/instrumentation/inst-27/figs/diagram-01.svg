 class="nodeLabel">~5 ft GA<br />FLARE disengages → touchdown<br />LOC disengages<br />ROLL OUT engages</span></div></foreignObject></g></g><g class="node default default flowchart-label" id="flowchart-G-1033" data-node="true" data-id="G" transform="translate(175.9609375, 924)"><rect class="basic label-container" style="" rx="0" ry="0" x="-119.078125" y="-29" width="238.15625" height="58"/><g class="label" style="" transform="translate(-109.078125, -19)"><rect/><foreignObject width="218.15625" height="38"><div xmlns="http://www.w3.org/1999/xhtml" style="display: inline-block; white-space: nowrap;"><span class="nodeLabel">~1 ft GA<br />Pitch attitude decreased to 2°</span></div></foreignObject></g></g><g class="node default default flowchart-label" id="flowchart-H-1035" data-node="true" data-id="H" transform="translate(175.9609375, 1060.5)"><rect class="basic label-container" style="" rx="0" ry="0" x="-165.25" y="-57.5" width="330.5" height="115"/><g class="label" style="" transform="translate(-155.25, -47.5)"><rect/><foreignObject width="310.5" height="95"><div xmlns="http://www.w3.org/1999/xhtml" style="display: inline-block; white-space: nowrap;"><span class="nodeLabel">Touchdown<br />Elevators lower nose<br />Nose gear contacts runway<br />A/T auto-disengages ~2 sec after TD<br />AFCS remains on until manually disengaged</span></div></foreignObject></g></g></g></g></g></svg>