<svg xmlns="http://www.w3.org/2000/svg" width="800" height="388" viewBox="0 0 800 388" role="img" aria-labelledby="title description"><title id="title">Recognising bank on the attitude indicator</title><desc id="description">The aircraft symbol stays fixed. With a right bank the displayed horizon rises to the right. A left bank reverses the slope.</desc><rect width="800" height="388" fill="#fff"/><g font-family="Arial, sans-serif"><text x="400" y="44" text-anchor="middle" font-size="29" fill="#17304d">Recognising bank on the attitude indicator</text><defs><clipPath id="window-32-116"><rect x="32" y="116" width="226" height="160" rx="8"/></clipPath></defs><g clip-path="url(#window-32-116)"><g transform="rotate(20 145.0 196.0)"><rect x="-455.0" y="-504.0" width="1200" height="1400" fill="#4380ab"/><rect x="-455.0" y="196.0" width="1200" height="700" fill="#8b633d"/><line x1="-455.00" y1="196.00" x2="745.00" y2="196.00" stroke="white" stroke-width="3"/></g></g><line x1="92.00" y1="196.00" x2="135.00" y2="196.00" stroke="#ffde52" stroke-width="5"/><line x1="155.00" y1="196.00" x2="198.00" y2="196.00" stroke="#ffde52" stroke-width="5"/><circle cx="145.0" cy="196.0" r="4" fill="#ffde52" stroke="#17304d" stroke-width="3"/><defs><clipPath id="window-287-116"><rect x="287" y="116" width="226" height="160" rx="8"/></clipPath></defs><g clip-path="url(#window-287-116)"><g transform="rotate(0 400.0 196.0)"><rect x="-200.0" y="-504.0" width="1200" height="1400" fill="#4380ab"/><rect x="-200.0" y="196.0" width="1200" height="700" fill="#8b633d"/><line x1="-200.00" y1="196.00" x2="1000.00" y2="196.00" stroke="white" stroke-width="3"/></g></g><line x1="347.00" y1="196.00" x2="390.00" y2="196.00" stroke="#ffde52" stroke-width="5"/><line x1="410.00" y1="196.00" x2="453.00" y2="196.00" stroke="#ffde52" stroke-width="5"/><circle cx="400.0" cy="196.0" r="4" fill="#ffde52" stroke="#17304d" stroke-width="3"/><defs><clipPath id="window-542-116"><rect x="542" y="116" width="226" height="160"