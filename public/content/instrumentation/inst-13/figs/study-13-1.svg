<svg xmlns="http://www.w3.org/2000/svg" width="800" height="388" viewBox="0 0 800 388" role="img" aria-labelledby="title description"><title id="title">Reference axes of an attitude indicator</title><desc id="description">The spin axis is vertical in level flight. Pitch is about the lateral axis and roll about the longitudinal axis.</desc><rect width="800" height="388" fill="#fff"/><g font-family="Arial, sans-serif"><text x="400" y="44" text-anchor="middle" font-size="29" fill="#17304d">Reference axes of an attitude indicator</text><line x1="232.00" y1="291.00" x2="232.00" y2="98.00" stroke="#205d93" stroke-width="3"/><line x1="82.00" y1="217.00" x2="382.00" y2="217.00" stroke="#205d93" stroke-width="3"/><line x1="140.00" y1="282.00" x2="320.00" y2="156.00" stroke="#205d93" stroke-width="3"/><circle cx="232" cy="217" r="7" fill="#17304d" stroke="#17304d" stroke-width="3"/><text x="232" y="84" text-anchor="middle" font-size="22" fill="#17304d">Vertical spin axis</text><text x="232" y="320" text-anchor="middle" font-size="22" fill="#17304d">Reference axes</text><text x="85" y="201" font-size="18" fill="#17304d">Lateral</text><text x="275" y="153" font-size="18" fill="#17304d">Longitudinal</text><rect x="430" y="103" width="335" height="152" rx="8" fill="#edf5fa" stroke="#205d93" stroke-width="2"/><text x="597.5" y="170.5" text-anchor="middle" font-size="22" fill="#17304d">Pitch → lateral axis</text><text x="597.5" y="201.5" text-anchor="middle" font-size="22" fill="#17304d">Roll → longitudinal axis</text><text x="400" y="363" text-anchor="middle" font-size="19" fill="#17304d">Axes shown schematically in level flight.</text></g></svg>