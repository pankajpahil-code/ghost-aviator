<svg xmlns="http://www.w3.org/2000/svg" width="900" height="515" viewBox="0 0 900 515" role="img" aria-labelledby="title desc"><title id="title">FMCW radio altimeter: delay and beat frequency</title><desc id="desc">Original teaching schematic for this lesson; the image simplifies the illustrated system.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5eb1"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5eb1"/></marker></defs><rect width="900" height="515" fill="white"/><g font-family="Arial, sans-serif"><line x1="90" y1="330" x2="800" y2="330" stroke="#17304d" stroke-width="3"/><line x1="90" y1="330" x2="90" y2="55" stroke="#17304d" stroke-width="3"/><text x="75" y="35" font-size="25" fill="#17304d" text-anchor="start" font-weight="400">Frequency</text><text x="800" y="375" font-size="25" fill="#17304d" text-anchor="middle" font-weight="400">Time</text><path d="M100 300 L310 95 L310 300 L520 95 L520 300 L730 95" fill="none" stroke="#1d5eb1" stroke-width="4"/><path d="M145 300 L355 95 L355 300 L565 95 L565 300 L775 95" fill="none" stroke="#087e8b" stroke-width="4" stroke-dasharray="9 6"/><text x="450" y="425" font-size="24" fill="#17304d" text-anchor="middle" font-weight="400">Blue: transmitted sweep • Teal: delayed received sweep</text><text x="450" y="470" font-size="24" fill="#17304d" text-anchor="middle" font-weight="400">For a fixed sweep rate, beat frequency increases with height.</text></g></svg>