<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Radio-altimeter indicator: principal controls</title><desc id="desc">Original teaching schematic for this lesson; the image simplifies the illustrated system.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5eb1"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5eb1"/></marker></defs><rect width="900" height="450" fill="white"/><g font-family="Arial, sans-serif"><circle cx="320" cy="220" r="145" fill="#132334" stroke="#17304d" stroke-width="3"/><text x="320" y="160" font-size="27" fill="white" text-anchor="middle" font-weight="400">RAD ALT</text><text x="320" y="230" font-size="48" fill="white" text-anchor="middle" font-weight="400">500 ft</text><text x="320" y="290" font-size="24" fill="#f6d452" text-anchor="middle" font-weight="400">DH selector</text><rect x="560" y="70" width="280" height="85" rx="14" fill="#edf4fc" stroke="#1d5eb1" stroke-width="2"/><text x="700.0" y="103.5" font-size="25" fill="#17304d" text-anchor="middle" font-weight="400">Height above</text><text x="700.0" y="139.5" font-size="25" fill="#17304d" text-anchor="middle" font-weight="400">terrain</text><rect x="560" y="190" width="280" height="85" rx="14" fill="#edf4fc" stroke="#1d5eb1" stroke-width="2"/><text x="700.0" y="223.5" font-size="25" fill="#17304d" text-anchor="middle" font-weight="400">Failure / low-height</text><text x="700.0" y="259.5" font-size="25" fill="#17304d" text-anchor="middle" font-weight="400">warning</text><rect x="560" y="310" width="280" height="85" rx="14" fill="#edf4fc" stroke="#1d5eb1" stroke-width="2"/><text x="700.0" y="343.5" font-size="25" fill="#17304d" text-anchor="middle" font-weight="400">Press to test /</text><text x="700.0" y="379.5" font-size="25" fill="#17304d" text-anchor="middle" font-weight="400">height selection</text><path d="M555 113 L455 160" fill="none" stroke="#1d5eb1" stroke-width="3" marker-end="url(#arrow)"/><path d="M555 232 L465 232" fill="none" stroke="#1d5eb1" stroke-width="3" marker-end="url(#arrow)"/><path d="M555 352 L420 325" fill="none" stroke="#1d5eb1" stroke-width="3" marker-end="url(#arrow)"/></g></svg>