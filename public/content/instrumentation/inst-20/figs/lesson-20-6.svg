<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Airbus-style radio-altitude colour change</title><desc id="desc">Original teaching schematic for this lesson; the image simplifies the illustrated system.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5eb1"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5eb1"/></marker></defs><rect width="900" height="450" fill="white"/><g font-family="Arial, sans-serif"><rect x="55" y="65" width="365" height="230" rx="14" fill="#edf4fc" stroke="#1d5eb1" stroke-width="2"/><text x="237" y="115" font-size="25" fill="#17304d" text-anchor="middle" font-weight="400">Above decision height</text><text x="237" y="160" font-size="24" fill="#17304d" text-anchor="middle" font-weight="400">Radio altitude at PFD base</text><text x="237" y="255" font-size="52" fill="#00844c" text-anchor="middle" font-weight="400">200</text><rect x="480" y="65" width="365" height="230" rx="14" fill="#fff7e4" stroke="#a35c00" stroke-width="2"/><text x="662" y="115" font-size="25" fill="#17304d" text-anchor="middle" font-weight="400">Below decision height</text><text x="662" y="160" font-size="24" fill="#17304d" text-anchor="middle" font-weight="400">Larger amber numerals</text><text x="662" y="262" font-size="64" fill="#a35c00" text-anchor="middle" font-weight="400">80</text><text x="450" y="355" font-size="25" fill="#17304d" text-anchor="middle" font-weight="400">Example: selected decision height 100 ft.</text><text x="450" y="400" font-size="24" fill="#17304d" text-anchor="middle" font-weight="400">The illustrated system provides configured height callouts.</text></g></svg>