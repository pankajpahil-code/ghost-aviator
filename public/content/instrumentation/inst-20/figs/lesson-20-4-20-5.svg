<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">Boeing-style radio altitude: approach to decision height</title><desc id="desc">Original teaching schematic for this lesson; the image simplifies the illustrated system.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5eb1"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5eb1"/></marker></defs><rect width="900" height="420" fill="white"/><g font-family="Arial, sans-serif"><rect x="55" y="60" width="365" height="240" rx="14" fill="#edf4fc" stroke="#1d5eb1" stroke-width="2"/><text x="237.5" y="153.0" font-size="25" fill="#17304d" text-anchor="middle" font-weight="400">Below 1000 ft</text><text x="237.5" y="189.0" font-size="25" fill="#17304d" text-anchor="middle" font-weight="400">White radio-altitude scale</text><text x="237.5" y="225.0" font-size="25" fill="#17304d" text-anchor="middle" font-weight="400">Magenta DH marker</text><rect x="480" y="60" width="365" height="240" rx="14" fill="#fff7e4" stroke="#a35c00" stroke-width="2"/><text x="662.5" y="153.0" font-size="25" fill="#17304d" text-anchor="middle" font-weight="400">At selected DH</text><text x="662.5" y="189.0" font-size="25" fill="#17304d" text-anchor="middle" font-weight="400">Amber / yellow alert</text><text x="662.5" y="225.0" font-size="25" fill="#17304d" text-anchor="middle" font-weight="400">Scale and marker flash</text><path d="M425 180 L475 180" fill="none" stroke="#1d5eb1" stroke-width="3" marker-end="url(#arrow)"/><text x="450" y="375" font-size="24" fill="#17304d" text-anchor="middle" font-weight="400">Illustrative presentation states; details vary by installation.</text></g></svg>