<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc"><title id="title">Radio-altimeter installation: residual height at touchdown</title><desc id="desc">Original teaching schematic for this lesson; the image simplifies the illustrated system.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5eb1"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5eb1"/></marker></defs><rect width="900" height="500" fill="white"/><g font-family="Arial, sans-serif"><line x1="80" y1="345" x2="820" y2="345" stroke="#50724f" stroke-width="5"/><text x="780" y="390" font-size="26" fill="#17304d" text-anchor="middle" font-weight="400">Ground</text><path d="M160 180 Q145 165 185 160 H520 L615 105 H660 L630 160 L730 175 Q760 185 730 195 H225 L150 220 H110 L160 185 Z" fill="#edf4fc" stroke="#17304d" stroke-width="3"/><line x1="340" y1="185" x2="325" y2="320" stroke="#17304d" stroke-width="6"/><circle cx="325" cy="330" r="15" fill="#17304d" stroke="#17304d" stroke-width="3"/><line x1="615" y1="185" x2="630" y2="320" stroke="#17304d" stroke-width="6"/><circle cx="630" cy="330" r="15" fill="#17304d" stroke="#17304d" stroke-width="3"/><circle cx="450" cy="190" r="7" fill="#087e8b" stroke="#17304d" stroke-width="3"/><path d="M450 205 L450 335" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#back)"/><text x="625" y="270" font-size="26" fill="#17304d" text-anchor="middle" font-weight="400">Antenna height</text><text x="625" y="307" font-size="23" fill="#17304d" text-anchor="middle" font-weight="400">with wheels on ground</text><text x="450" y="455" font-size="24" fill="#17304d" text-anchor="middle" font-weight="400">Installation compensation allows a zero indication at touchdown.</text></g></svg>