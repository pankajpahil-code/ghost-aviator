<svg xmlns="http://www.w3.org/2000/svg" width="800" height="388" viewBox="0 0 800 388" role="img" aria-labelledby="title description"><title id="title">Reading vertical speed</title><desc id="description">The pointer is in the upper half at 1. On this scale that means a climb at 1,000 feet per minute.</desc><rect width="800" height="388" fill="#fff"/><g font-family="Arial, sans-serif"><text x="400" y="44" text-anchor="middle" font-size="29" fill="#17304d">Reading vertical speed</text><circle cx="206" cy="195" r="106" fill="#fff" stroke="#17304d" stroke-width="3"/><line x1="265.08" y1="279.37" x2="259.34" y2="271.18" stroke="#17304d" stroke-width="2"/><text x="249.01823272632845" y="261.4364033216744" text-anchor="middle" font-size="17" fill="#17304d">2</text><line x1="158.44" y1="286.36" x2="163.06" y2="277.49" stroke="#17304d" stroke-width="2"/><text x="171.36885400737248" y="266.5258124883666" text-anchor="middle" font-size="17" fill="#17304d">1</text><line x1="103.00" y1="195.00" x2="113.00" y2="195.00" stroke="#17304d" stroke-width="2"/><text x="131.0" y="200.0" text-anchor="middle" font-size="17" fill="#17304d">0</text><line x1="158.44" y1="103.64" x2="163.06" y2="112.51" stroke="#17304d" stroke-width="2"/><text x="171.36885400737242" y="133.47418751163337" text-anchor="middle" font-size="17" fill="#17304d">1</text><line x1="265.08" y1="110.63" x2="259.34" y2="118.82" stroke="#17304d" stroke-width="2"/><text x="249.01823272632845" y="138.5635966783256" text-anchor="middle" font-size="17" fill="#17304d">2</text><line x1="206.00" y1="195.00" x2="179.50" y2="144.09" stroke="#a25206" stroke-width="5"/><circle cx="206" cy="195" r="5" fill="#17304d" stroke="#17304d" stroke-width="3"/><rect x="401" y="125" width="350" height="144" rx="8" fill="#edf5fa" stroke="#205d93" stroke-width="2"/><text x="576.0" y="173.0" text-anchor="middle" font-size="22" fill="#17304d">Upper half = climb</text><text x="576.0" y="204.0" text-anchor="middle" font-size="22" fill="#17304d">Lower half = descent</text><text x="576.0" y="235.0" text-anchor="middle" font-size="22" fill="#17304d">Scale × 1,000 ft/min</text><text x="400" y="363" text-anchor="middle" font-size="19" fill="#17304d">Pointer shown at +1,000 ft/min.</text></g></svg>