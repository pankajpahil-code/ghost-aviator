<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">Ring laser gyro: counter-propagating light</title><desc id="desc">Original teaching schematic for this lesson; the image simplifies the illustrated system.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5eb1"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5eb1"/></marker></defs><rect width="900" height="480" fill="white"/><g font-family="Arial, sans-serif"><path d="M200 310 L450 65 L700 310 Z" fill="#edf4fc" stroke="#1d5eb1" stroke-width="4"/><path d="M240 310 L450 105 L660 310" fill="none" stroke="#087e8b" stroke-width="4" marker-end="url(#arrow)"/><path d="M620 280 L450 145 L280 280" fill="none" stroke="#a12b79" stroke-width="4" marker-end="url(#arrow)"/><text x="450" y="380" font-size="26" fill="#17304d" text-anchor="middle" font-weight="400">Light travels around the same ring in opposite directions.</text><text x="450" y="430" font-size="26" fill="#17304d" text-anchor="middle" font-weight="400">Rotation produces a measurable frequency difference.</text></g></svg>