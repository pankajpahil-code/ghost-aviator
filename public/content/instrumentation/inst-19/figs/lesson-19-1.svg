<svg xmlns="http://www.w3.org/2000/svg" width="900" height="435" viewBox="0 0 900 435" role="img" aria-labelledby="title desc"><title id="title">Inertial reference unit: strap-down sensors and computing</title><desc id="desc">Original teaching schematic for this lesson; the image simplifies the illustrated system.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5eb1"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5eb1"/></marker></defs><rect width="900" height="435" fill="white"/><g font-family="Arial, sans-serif"><rect x="70" y="45" width="760" height="285" rx="14" fill="#edf4fc" stroke="#1d5eb1" stroke-width="2"/><text x="450" y="88" font-size="30" fill="#17304d" text-anchor="middle" font-weight="600">Inertial reference unit</text><rect x="110" y="115" width="300" height="145" rx="14" fill="white" stroke="#1d5eb1" stroke-width="2"/><text x="260.0" y="178.5" font-size="26" fill="#17304d" text-anchor="middle" font-weight="400">Three gyroscopes</text><text x="260.0" y="214.5" font-size="26" fill="#17304d" text-anchor="middle" font-weight="400">Three accelerometers</text><path d="M415 185 L475 185" fill="none" stroke="#1d5eb1" stroke-width="3" marker-end="url(#arrow)"/><rect x="480" y="115" width="300" height="145" rx="14" fill="white" stroke="#1d5eb1" stroke-width="2"/><text x="630.0" y="178.5" font-size="26" fill="#17304d" text-anchor="middle" font-weight="400">Digital</text><text x="630.0" y="214.5" font-size="26" fill="#17304d" text-anchor="middle" font-weight="400">computation</text><text x="450" y="390" font-size="27" fill="#17304d" text-anchor="middle" font-weight="400">Sensors are fixed to the airframe; attitude is computed.</text></g></svg>