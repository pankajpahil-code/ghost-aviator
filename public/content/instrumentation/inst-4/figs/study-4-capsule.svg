<svg xmlns="http://www.w3.org/2000/svg" width="800" height="388" viewBox="0 0 800 388" role="img" aria-labelledby="title description"><title id="title">Inside a mechanical airspeed indicator</title><desc id="description">The diaphragm responds to total pressure minus static pressure. The linkage moves the airspeed pointer.</desc><rect width="800" height="388" fill="#fff"/><g font-family="Arial, sans-serif"><text x="400" y="44" text-anchor="middle" font-size="29" fill="#17304d">Inside a mechanical airspeed indicator</text><rect x="280" y="102" width="355" height="180" rx="8" fill="#edf5fa" stroke="#205d93" stroke-width="2"/><text x="458" y="135" text-anchor="middle" font-size="22" fill="#17304d">Case at static pressure</text><rect x="310" y="165" width="185" height="57" rx="8" fill="#fff" stroke="#205d93" stroke-width="2"/><text x="403" y="200" text-anchor="middle" font-size="22" fill="#17304d">Capsule</text><text x="135" y="180" text-anchor="middle" font-size="22" fill="#17304d">Pitot line</text><line x1="85.00" y1="195.00" x2="310.00" y2="195.00" stroke="#205d93" stroke-width="3"/><path d="M 301 188 L 310 195 L 301 202" fill="none" stroke="#205d93" stroke-width="3"/><line x1="495.00" y1="193.00" x2="548.00" y2="193.00" stroke="#205d93" stroke-width="3"/><line x1="548.00" y1="193.00" x2="578.00" y2="157.00" stroke="#205d93" stroke-width="3"/><text x="400" y="317" text-anchor="middle" font-size="22" fill="#17304d">Diaphragm movement drives the pointer</text><text x="400" y="363" text-anchor="middle" font-size="19" fill="#17304d">The measured difference is impact pressure.</text></g></svg>