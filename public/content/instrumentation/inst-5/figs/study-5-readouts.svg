<svg xmlns="http://www.w3.org/2000/svg" width="800" height="388" viewBox="0 0 800 388" role="img" aria-labelledby="title description"><title id="title">Altimeter readout examples</title><desc id="description">A pointer dial shows 265 feet. A separate example reads 12,850 feet, about 3,917 metres.</desc><rect width="800" height="388" fill="#fff"/><g font-family="Arial, sans-serif"><text x="400" y="44" text-anchor="middle" font-size="29" fill="#17304d">Altimeter readout examples</text><circle cx="195" cy="198" r="113" fill="#fff" stroke="#17304d" stroke-width="3"/><text x="195.0" y="108.0" text-anchor="middle" font-size="16" fill="#17304d">0</text><text x="250.83959896778495" y="126.14338553437999" text-anchor="middle" font-size="16" fill="#17304d">1</text><text x="285.35036904803957" y="173.64338553438" text-anchor="middle" font-size="16" fill="#17304d">2</text><text x="285.35036904803957" y="232.35661446562" text-anchor="middle" font-size="16" fill="#17304d">3</text><text x="250.83959896778495" y="279.85661446562" text-anchor="middle" font-size="16" fill="#17304d">4</text><text x="195.0" y="298.0" text-anchor="middle" font-size="16" fill="#17304d">5</text><text x="139.16040103221508" y="279.85661446562" text-anchor="middle" font-size="16" fill="#17304d">6</text><text x="104.64963095196042" y="232.35661446562" text-anchor="middle" font-size="16" fill="#17304d">7</text><text x="104.6496309519604" y="173.64338553438" text-anchor="middle" font-size="16" fill="#17304d">8</text><text x="139.16040103221505" y="126.14338553438" text-anchor="middle" font-size="16" fill="#17304d">9</text><line x1="195.00" y1="198.00" x2="195.71" y2="155.07" stroke="#17304d" stroke-width="8"/><line x1="195.00" y1="198.00" x2="205.86" y2="133.37" stroke="#17304d" stroke-width="6"/><line x1="195.00" y1="198.00" x2="280.50" y2="206.08" stroke="#17304d" stroke-width="3"/><circle cx="195" cy="198" r="4" fill="#17304d" stroke="#17304d" stroke-width="3"/><text x="195" y="337" text-anchor="middle" font-size="22" fill="#17304d">265 ft</text><rect x="412" y="131" width="338" height="145" rx="8" fill="#edf5fa" stroke="#205d93" stroke-width="2"/><text x="581.0" y="195.0" text-anchor="middle" font-size="22" fill="#17304d">12,850 ft</text><text x="581.0" y="226.0" text-anchor="middle" font-size="22" fill="#17304d">≈ 3,917 m</text><text x="400" y="363" text-anchor="middle" font-size="19" fill="#17304d">The two examples represent different altitudes.</text></g></svg>