<svg xmlns="http://www.w3.org/2000/svg" width="800" height="388" viewBox="0 0 800 388" role="img" aria-labelledby="title description"><title id="title">A cold-temperature correction example</title><desc id="description">An altitude of 6,200 feet minus airport elevation of 3,206 feet gives 2,994 feet of height. At minus 12 Celsius the example correction is about 300 feet.</desc><rect width="800" height="388" fill="#fff"/><g font-family="Arial, sans-serif"><text x="400" y="44" text-anchor="middle" font-size="29" fill="#17304d">A cold-temperature correction example</text><rect x="30.0" y="85" width="366.0" height="52" rx="8" fill="#d8e8f6" stroke="#205d93" stroke-width="2"/><text x="213.0" y="118" text-anchor="middle" font-size="20" fill="#17304d">Input</text><rect x="400.0" y="85" width="366.0" height="52" rx="8" fill="#d8e8f6" stroke="#205d93" stroke-width="2"/><text x="583.0" y="118" text-anchor="middle" font-size="20" fill="#17304d">Worked example</text><rect x="30.0" y="144" width="366.0" height="52" rx="8" fill="#f6f9fc" stroke="#205d93" stroke-width="2"/><text x="213.0" y="177" text-anchor="middle" font-size="20" fill="#17304d">Altitude − airport elevation</text><rect x="400.0" y="144" width="366.0" height="52" rx="8" fill="#f6f9fc" stroke="#205d93" stroke-width="2"/><text x="583.0" y="177" text-anchor="middle" font-size="20" fill="#17304d">6,200 − 3,206 = 2,994 ft</text><rect x="30.0" y="203" width="366.0" height="52" rx="8" fill="#f6f9fc" stroke="#205d93" stroke-width="2"/><text x="213.0" y="236" text-anchor="middle" font-size="20" fill="#17304d">Airport temperature</text><rect x="400.0" y="203" width="366.0" height="52" rx="8" fill="#f6f9fc" stroke="#205d93" stroke-width="2"/><text x="583.0" y="236" text-anchor="middle" font-size="20" fill="#17304d">−12 °C</text><rect x="30.0" y="262" width="366.0" height="52" rx="8" fill="#f6f9fc" stroke="#205d93" stroke-width="2"/><text x="213.0" y="295" text-anchor="middle" font-size="20" fill="#17304d">Corrected segment altitude</text><rect x="400.0" y="262" width="366.0" height="52" rx="8" fill="#f6f9fc" stroke="#205d93" stroke-width="2"/><text x="583.0" y="295" text-anchor="middle" font-size="20" fill="#17304d">6,200 + 300 = 6,500 ft</text><text x="400" y="363" text-anchor="middle" font-size="19" fill="#17304d">Training example from FAA AIM §7-3. Use the applicable published procedure.</text></g></svg>