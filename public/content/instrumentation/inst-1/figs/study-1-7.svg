<svg xmlns="http://www.w3.org/2000/svg" width="800" height="388" viewBox="0 0 800 388" role="img" aria-labelledby="title description"><title id="title">The conventional six-instrument panel</title><desc id="description">Airspeed, attitude and altitude occupy the top row. Heading sits under attitude in the basic T.</desc><rect width="800" height="388" fill="#fff"/><g font-family="Arial, sans-serif"><text x="400" y="44" text-anchor="middle" font-size="29" fill="#17304d">The conventional six-instrument panel</text><rect x="36" y="83" width="235" height="82" rx="8" fill="#edf5fa" stroke="#205d93" stroke-width="2"/><text x="153.5" y="131.0" text-anchor="middle" font-size="22" fill="#17304d">Airspeed</text><rect x="282" y="83" width="235" height="82" rx="8" fill="#edf5fa" stroke="#205d93" stroke-width="2"/><text x="399.5" y="131.0" text-anchor="middle" font-size="22" fill="#17304d">Attitude</text><rect x="528" y="83" width="235" height="82" rx="8" fill="#edf5fa" stroke="#205d93" stroke-width="2"/><text x="645.5" y="131.0" text-anchor="middle" font-size="22" fill="#17304d">Altimeter</text><rect x="36" y="193" width="235" height="82" rx="8" fill="#edf5fa" stroke="#205d93" stroke-width="2"/><text x="153.5" y="241.0" text-anchor="middle" font-size="22" fill="#17304d">Turn coordinator</text><rect x="282" y="193" width="235" height="82" rx="8" fill="#edf5fa" stroke="#205d93" stroke-width="2"/><text x="399.5" y="241.0" text-anchor="middle" font-size="22" fill="#17304d">Heading</text><rect x="528" y="193" width="235" height="82" rx="8" fill="#edf5fa" stroke="#205d93" stroke-width="2"/><text x="645.5" y="241.0" text-anchor="middle" font-size="22" fill="#17304d">Vertical speed</text><text x="400" y="363" text-anchor="middle" font-size="19" fill="#17304d">The top row and centre column form the basic T.</text></g></svg>