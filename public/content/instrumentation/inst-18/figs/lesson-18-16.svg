<svg xmlns="http://www.w3.org/2000/svg" width="900" height="555" viewBox="0 0 900 555" role="img" aria-labelledby="title desc"><title id="title">INS mode selector: functions</title><desc id="desc">Original teaching schematic for this lesson; the image simplifies the illustrated system.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5eb1"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5eb1"/></marker></defs><rect width="900" height="555" fill="white"/><g font-family="Arial, sans-serif"><rect x="65" y="55" width="770" height="66" rx="14" fill="#edf4fc" stroke="#1d5eb1" stroke-width="2"/><text x="450.0" y="97.0" font-size="26" fill="#17304d" text-anchor="middle" font-weight="400">OFF • power off</text><rect x="65" y="136" width="770" height="66" rx="14" fill="#edf4fc" stroke="#1d5eb1" stroke-width="2"/><text x="450.0" y="178.0" font-size="26" fill="#17304d" text-anchor="middle" font-weight="400">STBY • initial position entry</text><rect x="65" y="217" width="770" height="66" rx="14" fill="#edf4fc" stroke="#1d5eb1" stroke-width="2"/><text x="450.0" y="259.0" font-size="26" fill="#17304d" text-anchor="middle" font-weight="400">ALIGN • level and align</text><rect x="65" y="298" width="770" height="66" rx="14" fill="#edf4fc" stroke="#1d5eb1" stroke-width="2"/><text x="450.0" y="340.0" font-size="26" fill="#17304d" text-anchor="middle" font-weight="400">NAV • navigation computation</text><rect x="65" y="379" width="770" height="66" rx="14" fill="#edf4fc" stroke="#1d5eb1" stroke-width="2"/><text x="450.0" y="421.0" font-size="26" fill="#17304d" text-anchor="middle" font-weight="400">ATT REF • attitude reference</text><text x="450" y="510" font-size="25" fill="#17304d" text-anchor="middle" font-weight="400">Annunciators include READY NAV and battery warning.</text></g></svg>