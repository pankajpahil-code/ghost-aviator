<svg xmlns="http://www.w3.org/2000/svg" width="900" height="405" viewBox="0 0 900 405" role="img" aria-labelledby="title desc"><title id="title">DSR TK/STS display: desired track and status</title><desc id="desc">Original teaching schematic for this lesson; the image simplifies the illustrated system.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5eb1"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5eb1"/></marker></defs><rect width="900" height="405" fill="white"/><g font-family="Arial, sans-serif"><rect x="70" y="45" width="760" height="265" rx="14" fill="#f4f8fc" stroke="#17304d" stroke-width="2"/><rect x="100" y="82" width="330" height="145" rx="14" fill="#edf4fc" stroke="#1d5eb1" stroke-width="2"/><text x="265.0" y="145.5" font-size="28" fill="#17304d" text-anchor="middle" font-weight="400">DSR TK</text><text x="265.0" y="181.5" font-size="28" fill="#17304d" text-anchor="middle" font-weight="400">Desired track</text><rect x="470" y="82" width="330" height="145" rx="14" fill="#edf4fc" stroke="#1d5eb1" stroke-width="2"/><text x="635.0" y="145.5" font-size="28" fill="#17304d" text-anchor="middle" font-weight="400">STS</text><text x="635.0" y="181.5" font-size="28" fill="#17304d" text-anchor="middle" font-weight="400">System status code</text><text x="450" y="275" font-size="25" fill="#17304d" text-anchor="middle" font-weight="400">Status is normally blank in NAV.</text><text x="450" y="360" font-size="25" fill="#17304d" text-anchor="middle" font-weight="400">Status checks are generally available in ALIGN.</text></g></svg>