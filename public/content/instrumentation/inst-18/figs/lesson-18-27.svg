<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-labelledby="title desc"><title id="title">TEST display: checking illuminated segments</title><desc id="desc">Original teaching schematic for this lesson; the image simplifies the illustrated system.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5eb1"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5eb1"/></marker></defs><rect width="900" height="410" fill="white"/><g font-family="Arial, sans-serif"><rect x="100" y="60" width="700" height="190" rx="14" fill="#132334" stroke="#17304d" stroke-width="2"/><text x="450" y="185" font-size="58" fill="#eae593" text-anchor="middle" font-weight="400">888888   888888</text><text x="450" y="320" font-size="25" fill="#17304d" text-anchor="middle" font-weight="400">The test illuminates display segments to reveal failed elements.</text><text x="450" y="365" font-size="25" fill="#17304d" text-anchor="middle" font-weight="400">A segment test does not establish navigation accuracy.</text></g></svg>