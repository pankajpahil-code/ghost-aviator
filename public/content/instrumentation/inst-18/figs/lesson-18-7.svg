<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title desc"><title id="title">Stabilised INS platform and sensors</title><desc id="desc">Original teaching schematic for this lesson; the image simplifies the illustrated system.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5eb1"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5eb1"/></marker></defs><rect width="900" height="460" fill="white"/><g font-family="Arial, sans-serif"><rect x="240" y="145" width="420" height="130" rx="14" fill="#edf4fc" stroke="#1d5eb1" stroke-width="2"/><text x="450.0" y="201.0" font-size="30" fill="#17304d" text-anchor="middle" font-weight="400">Mechanically stabilised</text><text x="450.0" y="237.0" font-size="30" fill="#17304d" text-anchor="middle" font-weight="400">platform</text><rect x="40" y="35" width="330" height="75" rx="14" fill="#edf4fc" stroke="#1d5eb1" stroke-width="2"/><text x="205.0" y="81.5" font-size="26" fill="#17304d" text-anchor="middle" font-weight="400">N/S accelerometer</text><rect x="530" y="35" width="330" height="75" rx="14" fill="#edf4fc" stroke="#1d5eb1" stroke-width="2"/><text x="695.0" y="81.5" font-size="26" fill="#17304d" text-anchor="middle" font-weight="400">E/W accelerometer</text><path d="M205 115 L320 140" fill="none" stroke="#1d5eb1" stroke-width="3" marker-end="url(#arrow)"/><path d="M695 115 L580 140" fill="none" stroke="#1d5eb1" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="330" width="210" height="80" rx="14" fill="#edf4fc" stroke="#1d5eb1" stroke-width="2"/><text x="165.0" y="379.0" font-size="26" fill="#17304d" text-anchor="middle" font-weight="400">Pitch gyro</text><rect x="345" y="330" width="210" height="80" rx="14" fill="#edf4fc"