<svg xmlns="http://www.w3.org/2000/svg" width="900" height="530" viewBox="0 0 900 530" role="img" aria-labelledby="title desc"><title id="title">Rate-integrating gyroscope: sensing rotation</title><desc id="desc">Original teaching schematic for this lesson; the image simplifies the illustrated system.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5eb1"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5eb1"/></marker></defs><rect width="900" height="530" fill="white"/><g font-family="Arial, sans-serif"><circle cx="210" cy="220" r="110" fill="#edf4fc" stroke="#1d5eb1" stroke-width="3"/><circle cx="210" cy="220" r="58" fill="none" stroke="#17304d" stroke-width="3"/><line x1="110" y1="220" x2="310" y2="220" stroke="#17304d" stroke-width="3"/><text x="210" y="390" font-size="28" fill="#17304d" text-anchor="middle" font-weight="400">Gyroscope</text><rect x="420" y="70" width="390" height="90" rx="14" fill="#edf4fc" stroke="#1d5eb1" stroke-width="2"/><text x="615.0" y="124.0" font-size="26" fill="#17304d" text-anchor="middle" font-weight="400">Input angular rate</text><path d="M615 165 L615 225" fill="none" stroke="#1d5eb1" stroke-width="3" marker-end="url(#arrow)"/><rect x="420" y="230" width="390" height="90" rx="14" fill="#edf4fc" stroke="#1d5eb1" stroke-width="2"/><text x="615.0" y="284.0" font-size="26" fill="#17304d" text-anchor="middle" font-weight="400">Integrating response</text><path d="M615 325 L615 385" fill="none" stroke="#1d5eb1" stroke-width="3" marker-end="url(#arrow)"/><rect x="420" y="390" width="390" height="90" rx="14" fill="#edf4fc" stroke="#1d5eb1" stroke-width="2"/><text x="615.0" y="444.0" font-size="24" fill="#17304d" text-anchor="middle" font-weight="400">Output angular displacement</text></g></svg>