<svg xmlns="http://www.w3.org/2000/svg" width="900" height="530" viewBox="0 0 900 530" role="img" aria-labelledby="title desc"><title id="title">Gravity contamination when a platform is tilted</title><desc id="desc">Original teaching schematic for this lesson; the image simplifies the illustrated system.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5eb1"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5eb1"/></marker></defs><rect width="900" height="530" fill="white"/><g font-family="Arial, sans-serif"><line x1="180" y1="280" x2="660" y2="280" stroke="#94a3b8" stroke-width="2" stroke-dasharray="9 8"/><line x1="230" y1="295" x2="640" y2="160" stroke="#1d5eb1" stroke-width="7"/><path d="M450 220 L450 380" fill="none" stroke="#1d5eb1" stroke-width="3" marker-end="url(#arrow)"/><text x="500" y="365" font-size="26" fill="#17304d" text-anchor="start" font-weight="400">Gravity</text><path d="M300 270 L570 180" fill="none" stroke="#1d5eb1" stroke-width="3" marker-end="url(#arrow)"/><text x="430" y="110" font-size="28" fill="#17304d" text-anchor="middle" font-weight="400">Tilted accelerometer axis</text><text x="450" y="445" font-size="24" fill="#17304d" text-anchor="middle" font-weight="400">A gravity component along the axis creates a false acceleration signal.</text><text x="450" y="485" font-size="24" fill="#17304d" text-anchor="middle" font-weight="400">Levelling and feedback keep the platform horizontal.</text></g></svg>