<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510" role="img" aria-labelledby="title desc"><title id="title">Schuler tuning: the approximately 84.4-minute period</title><desc id="desc">Original teaching schematic for this lesson; the image simplifies the illustrated system.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5eb1"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5eb1"/></marker></defs><rect width="900" height="510" fill="white"/><g font-family="Arial, sans-serif"><circle cx="270" cy="265" r="140" fill="#edf4fc" stroke="#1d5eb1" stroke-width="3"/><line x1="270" y1="125" x2="270" y2="265" stroke="#17304d" stroke-width="3"/><circle cx="270" cy="265" r="13" fill="#17304d" stroke="#17304d" stroke-width="3"/><text x="270" y="80" font-size="25" fill="#17304d" text-anchor="middle" font-weight="400">Earth-radius pendulum model</text><text x="450" y="460" font-size="31" fill="#17304d" text-anchor="middle" font-weight="600">Ideal Schuler period ≈ 84.4 minutes</text><rect x="510" y="155" width="330" height="150" rx="14" fill="#edf4fc" stroke="#1d5eb1" stroke-width="2"/><text x="675.0" y="221.0" font-size="27" fill="#17304d" text-anchor="middle" font-weight="400">INS levelling loop</text><text x="675.0" y="257.0" font-size="27" fill="#17304d" text-anchor="middle" font-weight="400">tuned to this period</text></g></svg>