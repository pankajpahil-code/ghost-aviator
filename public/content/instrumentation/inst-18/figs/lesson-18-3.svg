<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-labelledby="title desc"><title id="title">Accelerometer principle</title><desc id="desc">Original teaching schematic for this lesson; the image simplifies the illustrated system.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5eb1"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5eb1"/></marker></defs><rect width="900" height="410" fill="white"/><g font-family="Arial, sans-serif"><rect x="90" y="100" width="720" height="155" rx="14" fill="#f4f8fc" stroke="#17304d" stroke-width="2"/><line x1="110" y1="180" x2="250" y2="180" stroke="#17304d" stroke-width="3"/><path d="M250 180 l15 -28 l30 56 l30 -56 l30 56 l30 -56 l15 28" fill="none" stroke="#1d5eb1" stroke-width="4"/><rect x="400" y="135" width="150" height="90" rx="14" fill="#edf4fc" stroke="#1d5eb1" stroke-width="2"/><text x="475.0" y="189.0" font-size="26" fill="#17304d" text-anchor="middle" font-weight="400">Mass</text><line x1="550" y1="180" x2="760" y2="180" stroke="#17304d" stroke-width="3"/><text x="260" y="300" font-size="25" fill="#17304d" text-anchor="middle" font-weight="400">Spring / restoring force</text><text x="650" y="300" font-size="25" fill="#17304d" text-anchor="middle" font-weight="400">Displacement sensing</text><path d="M160 65 L360 65" fill="none" stroke="#1d5eb1" stroke-width="3" marker-end="url(#arrow)"/><text x="590" y="73" font-size="26" fill="#17304d" text-anchor="middle" font-weight="400">Aircraft acceleration</text><text x="450" y="365" font-size="26" fill="#17304d" text-anchor="middle" font-weight="400">Measured specific force → electrical signal</text></g></svg>