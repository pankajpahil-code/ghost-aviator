<svg xmlns="http://www.w3.org/2000/svg" width="900" height="475" viewBox="0 0 900 475" role="img" aria-labelledby="title desc"><title id="title">Earth orientation: latitude and changing local vertical</title><desc id="desc">Original teaching schematic for this lesson; the image simplifies the illustrated system.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5eb1"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5eb1"/></marker></defs><rect width="900" height="475" fill="white"/><g font-family="Arial, sans-serif"><circle cx="330" cy="220" r="155" fill="#edf4fc" stroke="#1d5eb1" stroke-width="3"/><line x1="145" y1="220" x2="515" y2="220" stroke="#9bb4d5" stroke-width="2" stroke-dasharray="7 6"/><line x1="330" y1="45" x2="330" y2="395" stroke="#9bb4d5" stroke-width="2" stroke-dasharray="7 6"/><line x1="330" y1="220" x2="440" y2="110" stroke="#17304d" stroke-width="3"/><path d="M440 110 L505 45" fill="none" stroke="#1d5eb1" stroke-width="3" marker-end="url(#arrow)"/><text x="585" y="70" font-size="26" fill="#17304d" text-anchor="middle" font-weight="400">Local vertical</text><text x="330" y="430" font-size="27" fill="#17304d" text-anchor="middle" font-weight="400">Earth</text><rect x="570" y="170" width="275" height="150" rx="14" fill="#edf4fc" stroke="#1d5eb1" stroke-width="2"/><text x="707.5" y="218.0" font-size="24" fill="#17304d" text-anchor="middle" font-weight="400">Earth rotation</text><text x="707.5" y="254.0" font-size="24" fill="#17304d" text-anchor="middle" font-weight="400">and aircraft motion</text><text x="707.5" y="290.0" font-size="24" fill="#17304d" text-anchor="middle" font-weight="400">require compensation</text></g></svg>