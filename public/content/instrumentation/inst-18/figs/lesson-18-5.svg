<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-labelledby="title desc"><title id="title">First integration: acceleration to velocity</title><desc id="desc">Original teaching schematic for this lesson; the image simplifies the illustrated system.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5eb1"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5eb1"/></marker></defs><rect width="900" height="350" fill="white"/><g font-family="Arial, sans-serif"><rect x="50.0" y="95" width="240.0" height="105" rx="14" fill="#edf4fc" stroke="#1d5eb1" stroke-width="2"/><text x="170.0" y="138.5" font-size="25" fill="#17304d" text-anchor="middle" font-weight="400">Acceleration</text><text x="170.0" y="174.5" font-size="25" fill="#17304d" text-anchor="middle" font-weight="400">N/S and E/W</text><path d="M295.0 147 L324.0 147" fill="none" stroke="#1d5eb1" stroke-width="3" marker-end="url(#arrow)"/><rect x="330.0" y="95" width="240.0" height="105" rx="14" fill="#edf4fc" stroke="#1d5eb1" stroke-width="2"/><text x="450.0" y="138.5" font-size="25" fill="#17304d" text-anchor="middle" font-weight="400">Integrate</text><text x="450.0" y="174.5" font-size="25" fill="#17304d" text-anchor="middle" font-weight="400">over time</text><path d="M575.0 147 L604.0 147" fill="none" stroke="#1d5eb1" stroke-width="3" marker-end="url(#arrow)"/><rect x="610.0" y="95" width="240.0" height="105" rx="14" fill="#edf4fc" stroke="#1d5eb1" stroke-width="2"/><text x="730.0" y="138.5" font-size="25" fill="#17304d" text-anchor="middle" font-weight="400">Velocity</text><text x="730.0" y="174.5" font-size="25" fill="#17304d" text-anchor="middle" font-weight="400">N/S and E/W</text><text x="450" y="275" font-size="25" fill="#17304d" t