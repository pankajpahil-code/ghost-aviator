<svg xmlns="http://www.w3.org/2000/svg" width="800" height="388" viewBox="0 0 800 388" role="img" aria-labelledby="title description"><title id="title">Combined airspeed and Mach indications</title><desc id="description">The air-data computer uses pitot and static pressure to provide airspeed and Mach. In the ideal ISA example at FL180, 330 knots CAS corresponds to Mach 0.69.</desc><rect width="800" height="388" fill="#fff"/><g font-family="Arial, sans-serif"><text x="400" y="44" text-anchor="middle" font-size="29" fill="#17304d">Combined airspeed and Mach indications</text><rect x="22" y="130" width="200" height="110" rx="8" fill="#edf5fa" stroke="#205d93" stroke-width="2"/><text x="122.0" y="176.5" text-anchor="middle" font-size="22" fill="#17304d">Pitot pressure</text><text x="122.0" y="207.5" text-anchor="middle" font-size="22" fill="#17304d">Static pressure</text><line x1="225.00" y1="185.00" x2="277.00" y2="185.00" stroke="#205d93" stroke-width="3"/><path d="M 268 178 L 277 185 L 268 192" fill="none" stroke="#205d93" stroke-width="3"/><rect x="280" y="130" width="238" height="110" rx="8" fill="#edf5fa" stroke="#205d93" stroke-width="2"/><text x="399.0" y="176.5" text-anchor="middle" font-size="22" fill="#17304d">Air-data</text><text x="399.0" y="207.5" text-anchor="middle" font-size="22" fill="#17304d">computer</text><line x1="522.00" y1="185.00" x2="573.00" y2="185.00" stroke="#205d93" stroke-width="3"/><path d="M 564 178 L 573 185 L 564 192" fill="none" stroke="#205d93" stroke-width="3"/><rect x="575" y="130" width="200" height="110" rx="8" fill="#edf5fa" stroke="#205d93" stroke-width="2"/><text x="675.0" y="176.5" text-anchor="middle" font-size="22" fill="#17304d">330 kt</text><text x="675.0" y="207.5" text-anchor="middle" font-size="22" fill="#17304d">Mach 0.69</text><text x="400" y="363" text-anchor="middle" font-size="19" fill="#17304d">Illustrative ideal readings at FL180 in ISA.</text></g></svg>