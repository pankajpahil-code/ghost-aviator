<svg xmlns="http://www.w3.org/2000/svg" width="800" height="388" viewBox="0 0 800 388" role="img" aria-labelledby="title description"><title id="title">Climbing at 330 kt calibrated airspeed</title><desc id="description">CAS stays at 330 knots while true airspeed and Mach increase through FL360.</desc><rect width="800" height="388" fill="#fff"/><g font-family="Arial, sans-serif"><text x="400" y="44" text-anchor="middle" font-size="29" fill="#17304d">Climbing at 330 kt calibrated airspeed</text><rect x="30.0" y="85" width="181.0" height="52" rx="8" fill="#d8e8f6" stroke="#205d93" stroke-width="2"/><text x="120.5" y="118" text-anchor="middle" font-size="20" fill="#17304d">ISA altitude</text><rect x="215.0" y="85" width="181.0" height="52" rx="8" fill="#d8e8f6" stroke="#205d93" stroke-width="2"/><text x="305.5" y="118" text-anchor="middle" font-size="20" fill="#17304d">CAS (kt)</text><rect x="400.0" y="85" width="181.0" height="52" rx="8" fill="#d8e8f6" stroke="#205d93" stroke-width="2"/><text x="490.5" y="118" text-anchor="middle" font-size="20" fill="#17304d">TAS (kt)</text><rect x="585.0" y="85" width="181.0" height="52" rx="8" fill="#d8e8f6" stroke="#205d93" stroke-width="2"/><text x="675.5" y="118" text-anchor="middle" font-size="20" fill="#17304d">Mach</text><rect x="30.0" y="144" width="181.0" height="52" rx="8" fill="#f6f9fc" stroke="#205d93" stroke-width="2"/><text x="120.5" y="177" text-anchor="middle" font-size="20" fill="#17304d">Sea level</text><rect x="215.0" y="144" width="181.0" height="52" rx="8" fill="#f6f9fc" stroke="#205d93" stroke-width="2"/><text x="305.5" y="177" text-anchor="middle" font-size="20" fill="#17304d">330</text><rect x="400.0" y="144" width="181.0" height="52" rx="8" fill="#f6f9fc" stroke="#205d93" stroke-width="2"/><text x="490.5" y="177" text-anchor="middle" font-size="20" fill="#17304d">330</text><rect x="585.0" y="144" width="181.0" height="52" rx="8" fill="#f6f9fc" stroke="#205d93" stroke-width="2"/><text x="675.5" y="177" text-a