<svg xmlns="http://www.w3.org/2000/svg" width="800" height="388" viewBox="0 0 800 388" role="img" aria-labelledby="title description"><title id="title">Descending at Mach 0.80</title><desc id="description">At constant Mach, TAS follows the local speed of sound. CAS increases as static pressure increases in descent.</desc><rect width="800" height="388" fill="#fff"/><g font-family="Arial, sans-serif"><text x="400" y="44" text-anchor="middle" font-size="29" fill="#17304d">Descending at Mach 0.80</text><rect x="30.0" y="85" width="181.0" height="52" rx="8" fill="#d8e8f6" stroke="#205d93" stroke-width="2"/><text x="120.5" y="118" text-anchor="middle" font-size="20" fill="#17304d">ISA altitude</text><rect x="215.0" y="85" width="181.0" height="52" rx="8" fill="#d8e8f6" stroke="#205d93" stroke-width="2"/><text x="305.5" y="118" text-anchor="middle" font-size="20" fill="#17304d">Mach</text><rect x="400.0" y="85" width="181.0" height="52" rx="8" fill="#d8e8f6" stroke="#205d93" stroke-width="2"/><text x="490.5" y="118" text-anchor="middle" font-size="20" fill="#17304d">TAS (kt)</text><rect x="585.0" y="85" width="181.0" height="52" rx="8" fill="#d8e8f6" stroke="#205d93" stroke-width="2"/><text x="675.5" y="118" text-anchor="middle" font-size="20" fill="#17304d">CAS (kt)</text><rect x="30.0" y="144" width="181.0" height="52" rx="8" fill="#f6f9fc" stroke="#205d93" stroke-width="2"/><text x="120.5" y="177" text-anchor="middle" font-size="20" fill="#17304d">FL400</text><rect x="215.0" y="144" width="181.0" height="52" rx="8" fill="#f6f9fc" stroke="#205d93" stroke-width="2"/><text x="305.5" y="177" text-anchor="middle" font-size="20" fill="#17304d">0.80</text><rect x="400.0" y="144" width="181.0" height="52" rx="8" fill="#f6f9fc" stroke="#205d93" stroke-width="2"/><text x="490.5" y="177" text-anchor="middle" font-size="20" fill="#17304d">459</text><rect x="585.0" y="144" width="181.0" height="52" rx="8" fill="#f6f9fc" stroke="#205d93" stroke-width="2"/><text x="675.5" y="177" text-anchor="middle" font-size="20" fill="#17304d">242</text><rect x="30.0" y="203" width="181.0" height="52" rx="8" fill="#f6f9fc" stroke="#205d93" stroke-width="2"/><text x="120.5" y="236" text-anchor="middle" font-size="20" fill="#17304d">FL180</text><rect x="215.0" y="203" width="181.0" height="52" rx="8" fill="#f6f9fc" stroke="#205d93" stroke-width="2"/><text x="305.5" y="236" text-anchor="middle" font-size="20" fill="#17304d">0.80</text><rect x="400.0" y="203" width="181.0" height="52" rx="8" fill="#f6f9fc" stroke="#205d93" stroke-width="2"/><text x="490.5" y="236" text-anchor="middle" font-size="20" fill="#17304d">495</text><rect x="585.0" y="203" width="181.0" height="52" rx="8" fill="#f6f9fc" stroke="#205d93" stroke-width="2"/><text x="675.5" y="236" text-anchor="middle" font-size="20" fill="#17304d">388</text><rect x="30.0" y="262" width="181.0" height="52" rx="8" fill="#f6f9fc" stroke="#205d93" stroke-width="2"/><text x="120.5" y="295" text-anchor="middle" font-size="20" fill="#17304d">Sea level</text><rect x="215.0" y="262" width="181.0" height="52" rx="8" fill="#f6f9fc" stroke="#205d93" stroke-width="2"/><text x="305.5" y="295" text-anchor="middle" font-size="20" fill="#17304d">0.80</text><rect x="400.0" y="262" width="181.0" height="52" rx="8" fill="#f6f9fc" stroke="#205d93" stroke-width="2"/><text x="490.5" y="295" text-anchor="middle" font-size="20" fill="#17304d">529</text><rect x="585.0" y="262" width="181.0" height="52" rx="8" fill="#f6f9fc" stroke="#205d93" stroke-width="2"/><text x="675.5" y="295" text-anchor="middle" font-size="20" fill="#17304d">529</text><text x="400" y="363" text-anchor="middle" font-size="19" fill="#17304d">The stratospheric part of this example is isothermal.</text></g></svg>