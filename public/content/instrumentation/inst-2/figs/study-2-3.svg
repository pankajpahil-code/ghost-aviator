<svg xmlns="http://www.w3.org/2000/svg" width="800" height="388" viewBox="0 0 800 388" role="img" aria-labelledby="title description"><title id="title">How a static source can acquire position error</title><desc id="description">A flush port samples local pressure near the airframe. Its reading can differ from undisturbed ambient pressure.</desc><rect width="800" height="388" fill="#fff"/><g font-family="Arial, sans-serif"><text x="400" y="44" text-anchor="middle" font-size="29" fill="#17304d">How a static source can acquire position error</text><line x1="95.00" y1="230.00" x2="700.00" y2="230.00" stroke="#17304d" stroke-width="7"/><circle cx="440" cy="230" r="8" fill="#fff" stroke="#17304d" stroke-width="3"/><text x="140" y="110" text-anchor="middle" font-size="22" fill="#17304d">Free stream</text><line x1="65.00" y1="145.00" x2="220.00" y2="145.00" stroke="#205d93" stroke-width="3"/><path d="M 211 138 L 220 145 L 211 152" fill="none" stroke="#205d93" stroke-width="3"/><path d="M240 145 Q345 100 435 165 T730 145" fill="none" stroke="#208598" stroke-width="4"/><line x1="440.00" y1="242.00" x2="440.00" y2="277.00" stroke="#205d93" stroke-width="3"/><text x="440" y="305" text-anchor="middle" font-size="22" fill="#17304d">Flush port samples local pressure</text><text x="400" y="363" text-anchor="middle" font-size="19" fill="#17304d">Error depends on port location, flight condition and configuration.</text></g></svg>