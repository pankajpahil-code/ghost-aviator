<svg xmlns="http://www.w3.org/2000/svg" width="800" height="388" viewBox="0 0 800 388" role="img" aria-labelledby="title description"><title id="title">Paired fuselage static ports</title><desc id="description">Pressure from the left and right ports feeds a common static line. Pairing can reduce sideslip error.</desc><rect width="800" height="388" fill="#fff"/><g font-family="Arial, sans-serif"><text x="400" y="44" text-anchor="middle" font-size="29" fill="#17304d">Paired fuselage static ports</text><rect x="35" y="95" width="232" height="78" rx="8" fill="#edf5fa" stroke="#205d93" stroke-width="2"/><text x="151.0" y="141.0" text-anchor="middle" font-size="22" fill="#17304d">Left port</text><rect x="533" y="95" width="232" height="78" rx="8" fill="#edf5fa" stroke="#205d93" stroke-width="2"/><text x="649.0" y="141.0" text-anchor="middle" font-size="22" fill="#17304d">Right port</text><line x1="151.00" y1="173.00" x2="151.00" y2="212.00" stroke="#205d93" stroke-width="3"/><line x1="649.00" y1="173.00" x2="649.00" y2="212.00" stroke="#205d93" stroke-width="3"/><line x1="151.00" y1="212.00" x2="649.00" y2="212.00" stroke="#205d93" stroke-width="3"/><line x1="400.00" y1="212.00" x2="400.00" y2="246.00" stroke="#205d93" stroke-width="3"/><rect x="260" y="246" width="280" height="70" rx="8" fill="#edf5fa" stroke="#205d93" stroke-width="2"/><text x="400.0" y="288.0" text-anchor="middle" font-size="22" fill="#17304d">Static line</text><text x="400" y="363" text-anchor="middle" font-size="19" fill="#17304d">Example installation. The aircraft flight manual describes the actual system.</text></g></svg>