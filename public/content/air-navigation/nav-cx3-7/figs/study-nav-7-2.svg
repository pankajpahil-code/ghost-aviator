<svg xmlns="http://www.w3.org/2000/svg" width="800" height="388" viewBox="0 0 800 388" role="img" aria-labelledby="title description"><title id="title">Crossing in still water</title><desc id="description">The 10 NM track runs straight across the river. Without current the boat reaches the point opposite its starting position.</desc><rect width="800" height="388" fill="#fff"/><g font-family="Arial, sans-serif"><text x="400" y="44" text-anchor="middle" font-size="29" fill="#17304d">Crossing in still water</text><rect x="94" y="90" width="610" height="194" rx="8" fill="#d7eff7" stroke="#529bbb" stroke-width="2"/><line x1="98.00" y1="90.00" x2="699.00" y2="90.00" stroke="#17304d" stroke-width="6"/><line x1="98.00" y1="284.00" x2="699.00" y2="284.00" stroke="#17304d" stroke-width="6"/><line x1="303.00" y1="276.00" x2="303.00" y2="99.00" stroke="#205d93" stroke-width="3"/><path d="M290 115 L303 97 L316 115" fill="none" stroke="#205d93" stroke-width="4"/><text x="476" y="172" text-anchor="middle" font-size="22" fill="#17304d">Distance: 10 NM</text><text x="476" y="212" text-anchor="middle" font-size="22" fill="#17304d">Speed: 10 kt</text><text x="476" y="252" text-anchor="middle" font-size="22" fill="#17304d">Time: 1 h</text><text x="252" y="320" text-anchor="middle" font-size="22" fill="#17304d">Departure</text><text x="400" y="74" text-anchor="middle" font-size="22" fill="#17304d">Opposite bank</text><text x="400" y="363" text-anchor="middle" font-size="19" fill="#17304d">Current = 0 kt. Heading and track coincide.</text></g></svg>