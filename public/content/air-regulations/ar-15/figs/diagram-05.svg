rve" dy="1em" x="0" class="row">SUSPEND or CANCEL</tspan><tspan xml:space="preserve" dy="1em" x="0" class="row">the C of A / Special C of A</tspan></text></g></g><g class="node default default flowchart-label" id="flowchart-O2-90" data-node="true" data-id="O2" transform="translate(140.7109375, 185.5)"><rect class="basic label-container" style="" rx="0" ry="0" x="-138.83203125" y="-50.5" width="277.6640625" height="101"/><g class="label" style="" transform="translate(0, -40.5)"><rect/><text style=""><tspan xml:space="preserve" dy="1em" x="0" class="row">Option (b)</tspan><tspan xml:space="preserve" dy="1em" x="0" class="row">REQUIRE modification, repair,</tspan><tspan xml:space="preserve" dy="1em" x="0" class="row">replacement, overhaul, inspection</tspan><tspan xml:space="preserve" dy="1em" x="0" class="row">(incl. flight tests &amp; examination)</tspan><tspan xml:space="preserve" dy="1em" x="0" class="row">under an approved person</tspan></text></g></g><g class="node default default flowchart-label" id="flowchart-Y-92" data-node="true" data-id="Y" transform="translate(140.7109375, 312.5)"><rect class="basic label-container" style="" rx="0" ry="0" x="-140.7109375" y="-26.5" width="281.421875" height="53"/><g class="label" style="" transform="translate(0, -16.5)"><rect/><text style=""><tspan xml:space="preserve" dy="1em" x="0" class="row">Compliance becomes a CONDITION</tspan><tspan xml:space="preserve" dy="1em" x="0" class="row">of the C of A remaining in force</tspan></text></g></g><g class="node default default flowchart-label" id="flowchart-Z-94" data-node="true" data-id="Z" transform="translate(436.484375, 312.5)"><rect class="basic label-container" style="" rx="0" ry="0" x="-115.0625" y="-26.5" width="230.125" height="53"/><g class="label" style="" transform="translate(0, -16.5)"><rect/><text style=""><tspan xml:space="preserve" dy="1em" x="0" class="row">Aircraft must NOT be flown</tspan><tspan xml:space="preserve" dy="1em" x="0" class="row">while the C of A is suspended</tspan></text></g></g><g class="node default default flowchart-label" id="flowchart-SFP-96" data-node="true" data-id="SFP" transform="translate(436.484375, 423.5)"><rect class="basic label-container" style="" rx="0" ry="0" x="-134.078125" y="-34.5" width="268.15625" height="69"/><g class="label" style="" transform="translate(0, -24.5)"><rect/><text style=""><tspan xml:space="preserve" dy="1em" x="0" class="row">On application by owner / operator,</tspan><tspan xml:space="preserve" dy="1em" x="0" class="row">the DG MAY issue a</tspan><tspan xml:space="preserve" dy="1em" x="0" class="row">SPECIAL FLIGHT PERMIT</tspan></text></g></g></g></g></g></svg>